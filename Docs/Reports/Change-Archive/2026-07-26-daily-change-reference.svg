<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">AuraProj daily change reference for 2026-07-26</title><desc id="desc">AuraAbilityGraph plugin and data-driven ability foundation.</desc><defs><linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eaf2f9"/></linearGradient><style>.t{font:700 26px Segoe UI,Arial;fill:#17324d}.s{font:400 15px Segoe UI,Arial;fill:#47657e}.h{font:700 18px Segoe UI,Arial;fill:#17324d}.b{font:400 15px Segoe UI,Arial;fill:#25475f}.l{font:700 12px Segoe UI,Arial;fill:white;letter-spacing:1px}</style></defs><rect width="1200" height="700" fill="url(#bg)"/><text x="50" y="52" class="t">2026-07-26 - AuraAbilityGraph foundation</text><text x="50" y="80" class="s">main | 1 commit: 94d165d</text><rect x="50" y="110" width="1100" height="70" rx="14" fill="white" stroke="#7aa5c2"/><text x="75" y="140" class="h">Daily job</text><text x="190" y="140" class="b">Introduce a graph runtime beside Blueprint abilities and make FireGun data-driven.</text><text x="75" y="164" class="s">Runtime/editor modules, XML/JSON import, web editor/server, nodes, FireGun, bullet actor, and GAS integration arrive.</text><rect x="50" y="215" width="335" height="245" rx="16" fill="white" stroke="#7aa5c2"/><rect x="50" y="215" width="335" height="38" rx="16" fill="#2d668f"/><text x="72" y="240" class="l">BEFORE</text><text x="72" y="290" class="h">Blueprint-centered ability path</text><text x="72" y="322" class="b">No graph runtime/editor module.</text><text x="72" y="354" class="b">Ability composition was not represented</text><text x="72" y="380" class="b">as XML/JSON node data.</text><text x="72" y="416" class="b">BungeeMan FireGun had no graph-backed</text><text x="72" y="442" class="b">data path.</text><path d="M385 337 L430 337" stroke="#2d668f" stroke-width="3"/><rect x="430" y="215" width="720" height="245" rx="16" fill="#f5fbf7" stroke="#6ca887"/><rect x="430" y="215" width="720" height="38" rx="16" fill="#39845d"/><text x="452" y="240" class="l">AFTER</text><text x="452" y="290" class="h">Graph definitions compose native tasks</text><text x="452" y="322" class="b">AuraAbilityGraph runtime/editor modules register definitions and node types.</text><text x="452" y="354" class="b">XML/JSON describes montage, wait, targeting, hitscan, damage, projectile, and gun FX.</text><text x="452" y="386" class="b">Web editor/server and native launcher support authoring.</text><text x="452" y="418" class="b">FireGun and bullet actor connect graph definitions to GAS and character runtime.</text><text x="452" y="450" class="s">Guard: data describes the ability; graph tasks invoke runtime behavior.</text><rect x="50" y="500" width="520" height="130" rx="16" fill="#fffdf7" stroke="#d3a44f"/><text x="75" y="535" class="h">Important guard</text><text x="75" y="565" class="b">Keep definition parsing, node registration,</text><text x="75" y="590" class="b">and task execution distinct. A JSON/XML file</text><text x="75" y="615" class="b">is not itself gameplay execution.</text><rect x="600" y="500" width="550" height="130" rx="16" fill="#f2f8ff" stroke="#7aa5c2"/><text x="625" y="535" class="h">Validation / newcomer path</text><text x="625" y="565" class="b">Start with graph module registration, then XML/JSON,</text><text x="625" y="590" class="b">then FireGun and the bullet/GAS integration.</text><text x="625" y="615" class="b">Later abilities reuse this foundation.</text></svg>
