<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Playable Candidate Days 21 to 40 deep review and contract closure</title>
  <desc id="desc">A before and after flow showing the bounded in-app handoff failure, local fallback review, frozen implementation decisions, owned artifacts, four lane local gate, and separate external provider gate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#edf2f7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#243b53" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#334e68"/>
    </marker>
    <style>
      .title { font: 700 36px Segoe UI, Arial, sans-serif; fill: #102a43; }
      .subtitle { font: 400 18px Segoe UI, Arial, sans-serif; fill: #486581; }
      .h { font: 700 22px Segoe UI, Arial, sans-serif; fill: #102a43; }
      .body { font: 400 17px Segoe UI, Arial, sans-serif; fill: #243b53; }
      .small { font: 400 15px Segoe UI, Arial, sans-serif; fill: #486581; }
      .label { font: 700 15px Segoe UI, Arial, sans-serif; fill: #fff; letter-spacing: 1px; }
      .gate { font: 700 16px Segoe UI, Arial, sans-serif; fill: #102a43; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="80" y="70" class="title">Playable Candidate Days 21–40 — Deep Review Closure</text>
  <text x="80" y="105" class="subtitle">Local fallback after two bounded in-app handoff timeouts; no unsent packet was represented as external advice.</text>

  <rect x="70" y="150" width="420" height="395" rx="18" fill="#fff5f5" stroke="#e57373" stroke-width="3" filter="url(#shadow)"/>
  <rect x="70" y="150" width="420" height="54" rx="18" fill="#c62828"/>
  <rect x="70" y="185" width="420" height="19" fill="#c62828"/>
  <text x="95" y="185" class="label">BEFORE — ROADMAP RISKS</text>
  <text x="100" y="250" class="body">⚠ Day 21 still left contract choices open</text>
  <text x="100" y="292" class="body">⚠ Day 38 had no named pipeline owner</text>
  <text x="100" y="334" class="body">⚠ “Multi-hour” soak had no bound</text>
  <text x="100" y="376" class="body">⚠ Local and public gates could blur</text>
  <text x="100" y="418" class="body">⚠ Reward, restock, persistence lacked</text>
  <text x="123" y="444" class="body">one explicit cross-system contract</text>
  <text x="100" y="486" class="body">⚠ Daily outputs and owners were implicit</text>

  <line x1="510" y1="350" x2="670" y2="350" stroke="#334e68" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="525" y="270" width="125" height="92" rx="14" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="542" y="300" class="gate">HANDOFF</text>
  <text x="542" y="326" class="small">2 bounded</text>
  <text x="542" y="348" class="small">timeouts</text>
  <text x="535" y="390" class="small">→ local/legacy review</text>

  <rect x="700" y="150" width="830" height="395" rx="18" fill="#f0fff4" stroke="#58a36b" stroke-width="3" filter="url(#shadow)"/>
  <rect x="700" y="150" width="830" height="54" rx="18" fill="#2f855a"/>
  <rect x="700" y="185" width="830" height="19" fill="#2f855a"/>
  <text x="725" y="185" class="label">AFTER — IMPLEMENTATION-GRADE CONTRACT</text>
  <text x="735" y="250" class="body">✓ Day 21 freezes semi-auto, persistence, UTC/restock, reward, privacy</text>
  <text x="735" y="292" class="body">✓ Every day names owner surface, artifact, and machine-readable gate</text>
  <text x="735" y="334" class="body">✓ RunPlayableCandidate.ps1 owns Fast / Candidate / External stages</text>
  <text x="735" y="376" class="body">✓ Four local lanes: Aura/BungeeMan × listen/dedicated</text>
  <text x="735" y="418" class="body">✓ Bounded soak: 10 cycles per lane, 45-minute cap, 120s stage timeout</text>
  <text x="735" y="460" class="body">✓ Redacted identity, atomic economy, versioned player/world state</text>
  <text x="735" y="502" class="body">✓ External provider gate stays independently BLOCKED until provisioned</text>

  <text x="80" y="615" class="h">Corrected execution waves</text>
  <g filter="url(#shadow)">
    <rect x="80" y="650" width="270" height="100" rx="14" fill="#dbeafe" stroke="#4299e1" stroke-width="2"/>
    <rect x="365" y="650" width="300" height="100" rx="14" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
    <rect x="680" y="650" width="260" height="100" rx="14" fill="#feebc8" stroke="#dd6b20" stroke-width="2"/>
    <rect x="955" y="650" width="260" height="100" rx="14" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
    <rect x="1230" y="650" width="300" height="100" rx="14" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  </g>
  <text x="105" y="690" class="gate">21–24</text><text x="105" y="718" class="small">Freeze + boot + teach</text>
  <text x="390" y="690" class="gate">25–31</text><text x="390" y="718" class="small">Complete playable loop</text>
  <text x="705" y="690" class="gate">32–33</text><text x="705" y="718" class="small">Survive join/reconnect</text>
  <text x="980" y="690" class="gate">34–38</text><text x="980" y="718" class="small">Validate + diagnose + package</text>
  <text x="1255" y="690" class="gate">39–40</text><text x="1255" y="718" class="small">Soak + sign off independently</text>

  <text x="80" y="825" class="h">Candidate evidence chain</text>
  <g>
    <rect x="80" y="855" width="230" height="52" rx="26" fill="#102a43"/><text x="133" y="888" class="label">REVISION</text>
    <line x1="315" y1="881" x2="360" y2="881" stroke="#334e68" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="370" y="855" width="230" height="52" rx="26" fill="#243b53"/><text x="430" y="888" class="label">MANIFEST</text>
    <line x1="605" y1="881" x2="650" y2="881" stroke="#334e68" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="660" y="855" width="230" height="52" rx="26" fill="#334e68"/><text x="717" y="888" class="label">TEST RESULT</text>
    <line x1="895" y1="881" x2="940" y2="881" stroke="#334e68" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="950" y="855" width="230" height="52" rx="26" fill="#486581"/><text x="1015" y="888" class="label">HASH + LOGS</text>
    <line x1="1185" y1="881" x2="1230" y2="881" stroke="#334e68" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1240" y="855" width="290" height="52" rx="26" fill="#2f855a"/><text x="1300" y="888" class="label">LOCAL / EXTERNAL DECISION</text>
  </g>
  <text x="80" y="960" class="small">Archive record: 2026-08-29-playable-candidate-deep-review.md • Earlier roadmap archive remains immutable.</text>
</svg>
