<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Canton terrain plan H1 and H2 optimization</title>
  <desc id="desc">Before and after diagram showing the split of technical, city horizontal, gate local horizontal, and historical vertical acceptance gates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08131f"/>
      <stop offset="1" stop-color="#102b3d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7dd3fc"/>
    </marker>
    <style>
      .title{font:700 38px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}
      .sub{font:500 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#b9d8e7}
      .h{font:700 24px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}
      .k{font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#7dd3fc}
      .t{font:500 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#d9e8ef}
      .small{font:500 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#bfd3dd}
      .code{font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f8fafc}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="70" class="title">Canton terrain plan: evidence gates made explicit</text>
  <text x="80" y="104" class="sub">20-day implementation plan • optimized 2026-09-26 • thresholds unchanged</text>

  <g filter="url(#shadow)">
    <rect x="70" y="145" width="420" height="560" rx="24" fill="#172334" stroke="#526273" stroke-width="2"/>
    <rect x="535" y="145" width="995" height="560" rx="24" fill="#10293a" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <text x="105" y="195" class="h">Before</text>
  <text x="105" y="228" class="sub">One historical XY gate carried two jobs</text>
  <rect x="105" y="270" width="350" height="120" rx="16" fill="#3a2430" stroke="#fb7185"/>
  <text x="130" y="306" class="k" fill="#fda4af">MAP-001 affine</text>
  <text x="130" y="337" class="t">City fit + gate placement</text>
  <text x="130" y="366" class="small">93.24 m RMSE • 132.155 m worst</text>
  <path d="M280 392 L280 438" stroke="#fb7185" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="105" y="450" width="350" height="100" rx="16" fill="#392f1d" stroke="#fbbf24"/>
  <text x="130" y="487" class="t">200 × 200 m UTM boxes</text>
  <text x="130" y="517" class="small">Inherited from a failed transform</text>
  <rect x="105" y="585" width="350" height="80" rx="16" fill="#253042" stroke="#64748b"/>
  <text x="130" y="619" class="t">Technical pass blurred with</text>
  <text x="130" y="646" class="t">historical verification</text>

  <text x="575" y="195" class="h">After</text>
  <text x="575" y="228" class="sub">Four independent axes, each with its own evidence contract</text>

  <rect x="575" y="265" width="205" height="135" rx="16" fill="#123f4b" stroke="#22d3ee"/>
  <text x="596" y="301" class="k">Technical_UE</text>
  <text x="596" y="333" class="small">Encoding • map load</text>
  <text x="596" y="359" class="small">collision • cook</text>
  <text x="596" y="384" class="small">may pass provisionally</text>

  <rect x="805" y="265" width="205" height="135" rx="16" fill="#153b31" stroke="#34d399"/>
  <text x="826" y="301" class="k">H1 • City XY</text>
  <text x="826" y="333" class="small">≥5 fit • ≥8 holdouts</text>
  <text x="826" y="359" class="small">RMSE ≤15 m</text>
  <text x="826" y="384" class="small">worst ≤30 m</text>

  <rect x="1035" y="265" width="205" height="135" rx="16" fill="#19374b" stroke="#60a5fa"/>
  <text x="1056" y="301" class="k">H2 • Gate XY</text>
  <text x="1056" y="333" class="small">≥4 local checks</text>
  <text x="1056" y="359" class="small">RMSE ≤2 m</text>
  <text x="1056" y="384" class="small">worst ≤4 m</text>

  <rect x="1265" y="265" width="225" height="135" rx="16" fill="#3c2e1c" stroke="#f59e0b"/>
  <text x="1286" y="301" class="k">Historical_Z</text>
  <text x="1286" y="333" class="small">Dated walking surface</text>
  <text x="1286" y="359" class="small">named benchmark + datum</text>
  <text x="1286" y="384" class="small">modern DTM stays D-grade</text>

  <rect x="575" y="440" width="915" height="100" rx="16" fill="#2d263e" stroke="#c084fc"/>
  <text x="600" y="477" class="k">Guard: district selection cannot inherit the failed affine</text>
  <text x="600" y="510" class="t">Choose a named historical feature by source coverage → pass H2 → derive final metric bounds</text>

  <rect x="575" y="570" width="440" height="95" rx="16" fill="#2c2524" stroke="#fb923c"/>
  <text x="600" y="606" class="k">Approval state</text>
  <text x="600" y="637" class="code">owner_approval = pending</text>
  <text x="845" y="637" class="small">blocks historical Verified</text>

  <rect x="1040" y="570" width="450" height="95" rx="16" fill="#17352e" stroke="#4ade80"/>
  <text x="1065" y="606" class="k">Validated plan consistency</text>
  <text x="1065" y="637" class="small">master • 8 daily plans • 8 resource sheets • requests</text>

  <path d="M490 425 L535 425" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="70" y="750" width="1460" height="95" rx="20" fill="#0b1c29" stroke="#36576b"/>
  <text x="100" y="788" class="k">Historical M01 verification</text>
  <text x="100" y="820" class="t">Requires H1 + H2 + Historical_Z + approved Day-01 budget. Technical work can continue only on a clearly isolated provisional path.</text>
</svg>
