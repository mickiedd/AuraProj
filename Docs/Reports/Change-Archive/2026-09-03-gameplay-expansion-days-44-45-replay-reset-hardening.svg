<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">Days 44–45 replay idempotence and cancelled timeline reset hardening</title>
  <desc id="desc">A before-and-after flow showing live lease identity checks protecting heavy and support leases after bounded history eviction, an explicit cancelled-only timeline reset, and the validation and readiness gates.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .section { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 16px Arial, sans-serif; fill: #0f172a; }
      .body { font: 15px Arial, sans-serif; fill: #334155; }
      .small { font: 13px Arial, sans-serif; fill: #475569; }
      .box { stroke-width: 2; rx: 12; }
      .risk { fill: #fff1f2; stroke: #e11d48; }
      .guard { fill: #ecfdf5; stroke: #059669; }
      .neutral { fill: #f8fafc; stroke: #64748b; }
      .gate { fill: #fffbeb; stroke: #d97706; }
      .line { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1400" height="1000" fill="#ffffff"/>
  <text x="60" y="55" class="title">Days 44–45 hardening: live-lease replay authority and cancelled reset boundary</text>
  <text x="60" y="84" class="small">Inert authority-contract change; no live gameplay activation</text>

  <text x="60" y="130" class="section">1. Real defect closed: bounded history cannot forget a live lease</text>
  <rect x="60" y="155" width="270" height="120" class="box risk"/>
  <text x="80" y="185" class="label">Before: history only</text>
  <text x="80" y="211" class="body">Acquire A → cache A</text>
  <text x="80" y="235" class="body">1024 terminal requests</text>
  <text x="80" y="259" class="body">evict A → replay allocates A₂</text>

  <path d="M330 215 H405" class="line"/>
  <rect x="405" y="155" width="250" height="120" class="box risk"/>
  <text x="425" y="185" class="label">Failure consequence</text>
  <text x="425" y="211" class="body">extra lease serial</text>
  <text x="425" y="235" class="body">extra participant token</text>
  <text x="425" y="259" class="body">capacity / ownership drift</text>

  <path d="M700 215 H780" class="line"/>
  <rect x="780" y="145" width="540" height="140" class="box guard"/>
  <text x="805" y="177" class="label">After: active lease is authoritative</text>
  <text x="805" y="204" class="body">Request → prune expired → bounded history lookup</text>
  <text x="805" y="228" class="body">→ live identity + fingerprint lookup → no duplicate allocation</text>
  <text x="805" y="252" class="body">match: DuplicateAccepted + original serial | change: Conflict</text>
  <text x="805" y="276" class="small">Implemented for heavy attacks and support fields alike</text>

  <text x="60" y="335" class="section">2. Terminal lifecycle protection</text>
  <rect x="60" y="365" width="250" height="105" class="box neutral"/>
  <text x="85" y="397" class="label">Attack A</text>
  <text x="85" y="423" class="body">Windup / committed</text>
  <text x="85" y="447" class="body">callback key A</text>
  <path d="M310 417 H385" class="line"/>
  <rect x="385" y="365" width="220" height="105" class="box risk"/>
  <text x="410" y="397" class="label">Cancelled</text>
  <text x="410" y="423" class="body">terminal + observable</text>
  <text x="410" y="447" class="body">impact rejected</text>
  <path d="M605 417 H680" class="line"/>
  <rect x="680" y="365" width="230" height="105" class="box guard"/>
  <text x="705" y="397" class="label">Explicit Reset()</text>
  <text x="705" y="423" class="body">allowed only from</text>
  <text x="705" y="447" class="body">Cancelled → Idle</text>
  <path d="M910 417 H985" class="line"/>
  <rect x="985" y="365" width="335" height="105" class="box guard"/>
  <text x="1010" y="397" class="label">Replacement Attack B</text>
  <text x="1010" y="423" class="body">new authority sequence</text>
  <text x="1010" y="447" class="body">late key A cannot mutate B</text>
  <path d="M1152 470 V515 H550 V470" class="line dashed"/>
  <text x="665" y="540" class="small">stale callback path is rejected by the complete attack key</text>

  <text x="60" y="600" class="section">3. Regression and gate evidence</text>
  <rect x="60" y="630" width="390" height="230" class="box neutral"/>
  <text x="85" y="665" class="label">Native coverage authored</text>
  <text x="85" y="695" class="body">✓ Heavy history flood + active replay</text>
  <text x="85" y="723" class="body">✓ Support history flood + active replay</text>
  <text x="85" y="751" class="body">✓ Original serial / live-count invariants</text>
  <text x="85" y="779" class="body">✓ Changed-payload conflicts</text>
  <text x="85" y="807" class="body">✓ Cancel → reset → replacement + stale key</text>
  <text x="85" y="835" class="body">✓ Active Reset() is a no-op</text>

  <rect x="505" y="630" width="390" height="230" class="box guard"/>
  <text x="530" y="665" class="label">Local validation passed</text>
  <text x="530" y="695" class="body">✓ Day 44–45 Python contracts: 11/11</text>
  <text x="530" y="723" class="body">✓ Day 42–43 Python contracts: 4/4</text>
  <text x="530" y="751" class="body">✓ Python compilation</text>
  <text x="530" y="779" class="body">✓ JSON / SVG / archive-link checks</text>
  <text x="530" y="807" class="body">✓ Two handoff reviews: CONDITIONAL PASS</text>
  <text x="530" y="835" class="small">Source/native execution still requires UE5.5</text>

  <rect x="950" y="630" width="370" height="230" class="box gate"/>
  <text x="975" y="665" class="label">Still blocked / not claimed</text>
  <text x="975" y="695" class="body">• UE5.5 UHT / UBT / native automation</text>
  <text x="975" y="723" class="body">• DAY40_PACKAGED_EVIDENCE_MISSING</text>
  <text x="975" y="751" class="body">• ANCHOR_SURVEY_UNVERIFIED</text>
  <text x="975" y="779" class="body">• replication / rendered cues / movement</text>
  <text x="975" y="807" class="body">• playable runtime / production readiness</text>
  <text x="975" y="835" class="small">Evidence and environment gates, not source fixes</text>

  <line x1="60" y1="910" x2="1320" y2="910" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="945" class="small">Disposition: source-level replay and reset risks addressed; keep the profile inert until the inherited evidence and engine gates are satisfied.</text>
</svg>
