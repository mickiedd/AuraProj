<text x="58" y="324" font-size="19">1. Aim + local preview</text>
<text x="58" y="354" font-size="16">LMB confirm / RMB cancel</text>
<text x="58" y="377" font-size="16">Own input until release</text>
<text x="297" y="345" font-size="25">→</text>
<text x="343" y="324" font-size="19">2. Server validation</text>
<text x="343" y="354" font-size="16">Ground, range, height, LOS</text>
<text x="343" y="377" font-size="16">Reject before commitment</text>
<text x="582" y="345" font-size="25">→</text>
