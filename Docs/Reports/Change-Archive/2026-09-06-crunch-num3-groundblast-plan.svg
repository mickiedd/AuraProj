<rect x="40" y="412" width="1120" height="65" rx="10" fill="#47394a"/>
<text x="58" y="440" font-size="18">Cancel / invalid target / timeout → clean end; no pre-commit charge</text>
<text x="58" y="465" font-size="16">After commit: no refund or duplicate hit. Late callbacks cannot affect another activation.</text>
<text x="40" y="518" font-size="21" font-weight="700">IMPLEMENTATION COMPLETION GATES</text>
