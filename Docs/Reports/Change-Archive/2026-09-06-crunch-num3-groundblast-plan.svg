<text x="55" y="178" font-size="19">Num.3 → immediate cursor sample → server ground retrace → damage / cue → end</text>
<text x="55" y="208" font-size="16" fill="#ffca8a">No aim/confirm phase; no caster-to-point LOS test; cast replication and push need proof.</text>
<text x="40" y="270" font-size="21" font-weight="700">PLANNED BEHAVIOR</text>
