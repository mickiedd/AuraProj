<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#1f3346"/>
    </linearGradient>
    <linearGradient id="good" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#124955"/>
      <stop offset="1" stop-color="#16726c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#73ddd2"/>
    </marker>
    <style>
      .title { font: 700 30px Segoe UI, Arial, sans-serif; fill: #f4f8fb; }
      .subtitle { font: 400 16px Segoe UI, Arial, sans-serif; fill: #b8c7d3; }
      .heading { font: 700 20px Segoe UI, Arial, sans-serif; fill: #f4f8fb; }
      .boxTitle { font: 700 17px Segoe UI, Arial, sans-serif; fill: #f4f8fb; }
      .body { font: 400 15px Segoe UI, Arial, sans-serif; fill: #e1edf2; }
      .small { font: 400 13px Segoe UI, Arial, sans-serif; fill: #bed0d9; }
      .before { fill: #303847; stroke: #718093; stroke-width: 2; }
      .good { fill: url(#good); stroke: #73ddd2; stroke-width: 2; }
      .panel { fill: #102333; stroke: #31566d; stroke-width: 2; }
      .line { stroke: #73ddd2; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .badge { font: 700 14px Segoe UI, Arial, sans-serif; fill: #062528; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#background)"/>
  <text x="64" y="62" class="title">Game Server Manager editor runtime and readiness fix</text>
  <text x="64" y="92" class="subtitle">Preserve the client target variant, load deployment settings, and complete the server-ready handshake</text>

  <text x="72" y="145" class="heading">Observed failure</text>
  <rect x="64" y="172" width="590" height="204" rx="14" class="before"/>
  <text x="90" y="210" class="boxTitle">DebugGame client request</text>
  <text x="90" y="239" class="small">clientExecutable = UnrealEditor-Win64-DebugGame.exe</text>
  <text x="90" y="268" class="small">GSM selected generic UnrealEditor.exe</text>
  <text x="90" y="297" class="small">Development receipt/module pair was loaded</text>
  <text x="90" y="326" class="small">Unreal reported: Aura game module could not be found</text>
  <text x="90" y="355" class="small">Clean exit → GSM error → client fallback to port 7784</text>

  <text x="752" y="145" class="heading">Corrected runtime path</text>
  <rect x="744" y="172" width="632" height="204" rx="14" class="good"/>
  <text x="770" y="210" class="boxTitle">Client metadata is authoritative for editor variant</text>
  <text x="770" y="239" class="small">Resolve the reported engine root plus DebugGame executable</text>
  <text x="770" y="268" class="small">Pass Aura.uproject to every UnrealEditor runtime variant</text>
  <text x="770" y="297" class="small">Classify DebugGame/Cmd/Development as editor launches</text>
  <text x="770" y="326" class="small">Matching module loads and the server binds its game port</text>
  <text x="770" y="355" class="small">No generic-target substitution for a known editor client</text>

  <path d="M 260 448 H 1190" class="line"/>
  <rect x="72" y="414" width="250" height="78" rx="12" class="good"/>
  <text x="197" y="445" text-anchor="middle" class="boxTitle">Client request</text>
  <text x="197" y="470" text-anchor="middle" class="small">DebugGame + engine root</text>
  <rect x="408" y="414" width="250" height="78" rx="12" class="good"/>
  <text x="533" y="445" text-anchor="middle" class="boxTitle">GSM resolver</text>
  <text x="533" y="470" text-anchor="middle" class="small">matching editor binary</text>
  <rect x="744" y="414" width="250" height="78" rx="12" class="good"/>
  <text x="869" y="445" text-anchor="middle" class="boxTitle">Unreal startup</text>
  <text x="869" y="470" text-anchor="middle" class="small">project + map + server args</text>
  <rect x="1080" y="414" width="280" height="78" rx="12" class="good"/>
  <text x="1220" y="445" text-anchor="middle" class="boxTitle">Ready handshake</text>
  <text x="1220" y="470" text-anchor="middle" class="small">host:port returned</text>

  <text x="72" y="558" class="heading">Readiness guard repaired</text>
  <rect x="64" y="584" width="1312" height="126" rx="14" class="panel"/>
  <text x="90" y="620" class="body">Before: AuraPersistenceSubsystem queried GGameIni while the deployment section lived in Config/DefaultEngine.ini.</text>
  <text x="90" y="650" class="small">WorldPersistenceId was empty → WorldReadiness became Unhealthy → server_ready could not complete.</text>
  <text x="90" y="682" class="body">After: both persistence settings are read from GEngineIni → AuraCampaignMain is configured → readiness can proceed.</text>

  <text x="72" y="770" class="heading">Validation evidence</text>
  <rect x="64" y="792" width="300" height="42" rx="21" fill="#8fe3a4"/><text x="214" y="818" text-anchor="middle" class="badge">Python contracts PASS</text>
  <rect x="388" y="792" width="300" height="42" rx="21" fill="#8fe3a4"/><text x="538" y="818" text-anchor="middle" class="badge">AuraEditor 90/90 PASS</text>
  <rect x="712" y="792" width="300" height="42" rx="21" fill="#8fe3a4"/><text x="862" y="818" text-anchor="middle" class="badge">live port bind PASS</text>
  <rect x="1036" y="792" width="340" height="42" rx="21" fill="#f5cf77"/><text x="1206" y="818" text-anchor="middle" class="badge">restart active DebugGame editor</text>
</svg>
