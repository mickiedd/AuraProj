<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120">
<defs>
  <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f7f5ef"/><stop offset="1" stop-color="#e8e5dc"/></linearGradient>
  <marker id="dim" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
    <path d="M0 4 L8 1 L8 7 Z" fill="#397253"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1d2931" flood-opacity=".14"/></filter>
  <pattern id="fineBrick" width="26" height="16" patternUnits="userSpaceOnUse">
    <rect width="26" height="16" fill="#a49a86"/>
    <rect x="0" y="0" width="12" height="7" fill="#b3a992"/>
    <rect x="13" y="0" width="13" height="7" fill="#9d9380"/>
    <rect x="0" y="8" width="5" height="7" fill="#ada28c"/>
    <rect x="6" y="8" width="13" height="7" fill="#b6ac96"/>
    <rect x="20" y="8" width="6" height="7" fill="#9a907c"/>
  </pattern>
  <pattern id="ashlar" width="106" height="58" patternUnits="userSpaceOnUse">
    <rect width="106" height="58" fill="#7d7466"/>
    <rect x="1" y="1" width="103" height="26" fill="#a99e88"/>
    <rect x="1" y="30" width="62" height="26" fill="#9c927e"/>
    <rect x="64" y="30" width="40" height="26" fill="#b3a992"/>
  </pattern>
  <pattern id="hatch" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <rect width="9" height="9" fill="#f4d9d2"/><line x1="0" y1="0" x2="0" y2="9" stroke="#b35638" stroke-width="4"/>
  </pattern>
</defs>
<rect width="1440" height="1120" fill="url(#bg)"/>
<text x="64" y="70" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#9a5c32">AURA PROJECT · GUANGZHOU LANDMARKS</text>
<text x="64" y="124" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#17252d">Xiaobeimen AAA V3 · wall stone, plaque height, arch-fitted door</text>
<text x="64" y="159" font-family="Arial,sans-serif" font-size="19" fill="#52616a">No procedural source existed: every dimension below was measured out of the asset's own geometry, not read off the board.</text>

<!-- ======================= 1. WALL ======================= -->
<rect x="64" y="196" width="1312" height="268" rx="18" fill="#fffdfa" filter="url(#shadow)"/>
<text x="94" y="240" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#9a5c32">1 · WALL STONE</text>
<rect x="94" y="262" width="300" height="150" fill="url(#fineBrick)" stroke="#4a4238" stroke-width="2"/>
<text x="244" y="432" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#617078">before · units 18 × 15 cm</text>
<text x="244" y="454" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#8a949a">one 4K map per 80 cm of wall</text>
<path d="M418 337 h60" stroke="#397253" stroke-width="2.5" marker-end="url(#dim)"/>
<text x="448" y="322" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#397253">×2.8</text>
<rect x="502" y="262" width="300" height="150" fill="url(#ashlar)" stroke="#4a4238" stroke-width="2"/>
<text x="652" y="432" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#617078">after · blocks 53 × 29 cm</text>
<text x="652" y="454" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#397253">TexCoord × 0.25 → one map per 320 cm</text>
<text x="850" y="292" font-family="Arial,sans-serif" font-size="16" fill="#617078">11 courses × 6 blocks, per-course phase, per-block tone.</text>
<text x="850" y="318" font-family="Arial,sans-serif" font-size="16" fill="#617078">Mortar 2 cm, joints recessed in the height map so the normal</text>
<text x="850" y="344" font-family="Arial,sans-serif" font-size="16" fill="#617078">carries real relief. Seamless by construction: courses span the</text>
<text x="850" y="370" font-family="Arial,sans-serif" font-size="16" fill="#617078">full height, block edges the full width.</text>
<text x="850" y="400" font-family="Arial,sans-serif" font-size="15" fill="#8a949a">M_StoneWall is five TextureSample nodes wired straight to</text>
<text x="850" y="422" font-family="Arial,sans-serif" font-size="15" fill="#8a949a">their properties — no parameters, no TexCoord node — so the</text>
<text x="850" y="444" font-family="Arial,sans-serif" font-size="15" fill="#8a949a">scale had to go into the graph, not a material instance.</text>

<!-- ======================= 2. PLAQUE ======================= -->
<rect x="64" y="492" width="640" height="300" rx="18" fill="#fffdfa" filter="url(#shadow)"/>
<text x="94" y="536" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#9a5c32">2 · PLAQUE HEIGHT</text>
<!-- arch profile in both: intrados r=265 centred at z=370, crown 635; scale 0.28 px/cm -->
<g>
  <!-- before -->
  <path d="M150 700 v-78 a74 74 0 0 1 148 0 v78" fill="none" stroke="#26343c" stroke-width="2.5"/>
  <rect x="184" y="600" width="80" height="32" fill="#d9cfae" stroke="#8a7d5c" stroke-width="1.6"/>
  <text x="224" y="730" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#b0413a">in the arch's mouth</text>
  <!-- after -->
  <path d="M400 700 v-78 a74 74 0 0 1 148 0 v78" fill="none" stroke="#26343c" stroke-width="2.5"/>
  <rect x="434" y="536" width="80" height="32" fill="#d9cfae" stroke="#8a7d5c" stroke-width="1.6"/>
  <text x="474" y="730" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#397253">on the wall, above the crown</text>
</g>
<text x="94" y="762" font-family="Arial,sans-serif" font-size="16" fill="#617078">Body z 497.5..612.5 and face z 513..597 — both inside the opening, whose</text>
<text x="94" y="784" font-family="Arial,sans-serif" font-size="16" fill="#617078">intrados at z 497.5 is still ±232 cm wide. Raised <tspan font-weight="700" fill="#26343c">+156 cm</tspan> to z 653.5..768.5 — 18.5 cm of wall clear below, 19 above.</text>

<!-- ======================= 3. DOOR ======================= -->
<rect x="736" y="492" width="640" height="300" rx="18" fill="#fffdfa" filter="url(#shadow)"/>
<text x="766" y="536" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#9a5c32">3 · DOOR FITTED TO THE ARCH</text>
<g>
  <!-- before: flat-topped blocks below the springing -->
  <path d="M826 700 v-78 a74 74 0 0 1 148 0 v78" fill="none" stroke="#26343c" stroke-width="2.5"/>
  <path d="M826 700 v-78 a74 74 0 0 1 148 0 v78 Z" fill="#efe6d4"/>
  <rect x="836" y="660" width="34" height="40" fill="#8e3b30"/>
  <rect x="930" y="660" width="34" height="40" fill="#8e3b30"/>
  <rect x="862" y="622" width="76" height="78" fill="url(#hatch)" opacity=".85"/>
  <text x="900" y="730" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#b0413a">flat tops at z 344.5, below the springing</text>
  <!-- after: leaves following the intrados -->
  <path d="M1076 700 v-78 a74 74 0 0 1 148 0 v78" fill="none" stroke="#26343c" stroke-width="2.5"/>
  <path d="M1076 700 v-78 a74 74 0 0 1 74 -74 v152 Z" fill="#8e3b30" stroke="#5c2620" stroke-width="1.4"/>
  <path d="M1150 548 a74 74 0 0 1 74 74 v78 h-74 Z" fill="#8e3b30" stroke="#5c2620" stroke-width="1.4"/>
  <text x="1150" y="730" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#397253">top edge is the intrados</text>
</g>
<text x="766" y="762" font-family="Arial,sans-serif" font-size="16" fill="#617078">Leaves were 146.6 cm wide with flat tops at z 344.5 — and two 216 cm</text>
<text x="766" y="784" font-family="Arial,sans-serif" font-size="16" fill="#617078">leaves cannot close a 530 cm opening. Rebuilt with the intrados as their top edge.</text>

<!-- ======================= NUMBERS ======================= -->
<rect x="64" y="816" width="1312" height="176" rx="18" fill="#fffdfa" filter="url(#shadow)"/>
<text x="94" y="856" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#9a5c32">MEASURED</text>
<text x="94" y="894" font-family="Arial,sans-serif" font-size="16" fill="#617078">Arch · springing z 370 · intrados r 265 · crown z 635 · extrados 315</text>
<text x="94" y="922" font-family="Arial,sans-serif" font-size="16" fill="#617078">Wall UVs · 80 cm per unit on all twelve faces (<tspan font-family="monospace">du/dx = dv/dz = 0.0125</tspan>)</text>
<text x="94" y="950" font-family="Arial,sans-serif" font-size="16" fill="#617078">Door · 24 tris → 2,128 · studs 2,526 → 1,120 (70 per leaf)</text>
<text x="760" y="894" font-family="Arial,sans-serif" font-size="16" fill="#617078">Fix re-run: <tspan font-weight="700" fill="#397253">passed, no problems</tspan></text>
<text x="760" y="922" font-family="Arial,sans-serif" font-size="16" fill="#617078">Plaque second run <tspan font-family="monospace">changed: false</tspan> — the idempotence check</text>
<text x="760" y="950" font-family="Arial,sans-serif" font-size="16" fill="#617078">Six native captures before and after · cleanup 0 → 0</text>

<text x="64" y="1032" font-family="Arial,sans-serif" font-size="14" fill="#66737a">Door source: ContentSource/GuangzhouLandmarks/Xiaobeimen/source/build_xiaobeimen_door.py · Wall maps: Scripts/MakeXiaobeimenStoneTextures.py · Fix: Scripts/FixXiaobeimenAAA.py</text>
<text x="64" y="1058" font-family="Arial,sans-serif" font-size="14" fill="#8a949a">Two import conventions had to be measured: glTF positions are metres, so centimetre data needs a 0.01 offset scale; and at roll 0 Interchange maps the file's (X, Y, Z) to mesh-local (X, Z, Y).</text>
<text x="64" y="1084" font-family="Arial,sans-serif" font-size="14" fill="#8a949a">The board shows this gate open; closed leaves are what the same phrasing asked for on Zhengximen, so the open pose is superseded rather than restored.</text>
</svg>
