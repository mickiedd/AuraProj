<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <rect width="1200" height="820" fill="#f5f1e8"/>
  <text x="60" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#2b2118">Zhengnanmen / Great South Gate — reference tuning</text>
  <text x="60" y="88" font-family="Arial, sans-serif" font-size="16" fill="#675b4d">Facade infill pass based on the supplied reference sheet</text>

  <rect x="55" y="120" width="330" height="285" rx="12" fill="#e5ded0" stroke="#968a78" stroke-width="2"/>
  <text x="75" y="150" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#432d22">Before</text>
  <text x="75" y="177" font-family="Arial, sans-serif" font-size="15" fill="#5c5045">Open red lattice bays showed the</text>
  <text x="75" y="198" font-family="Arial, sans-serif" font-size="15" fill="#5c5045">preview background through all floors.</text>
  <g transform="translate(100 222)">
    <rect x="0" y="90" width="230" height="70" fill="#b4afa5" stroke="#716a60"/>
    <path d="M15 90 L20 55 L210 55 L215 90" fill="#2e6656" stroke="#173f34" stroke-width="5"/>
    <path d="M25 52 L35 20 L200 20 L210 52" fill="#34765e" stroke="#173f34" stroke-width="5"/>
    <path d="M40 18 L55 0 L180 0 L195 18" fill="#3c8267" stroke="#173f34" stroke-width="5"/>
    <g stroke="#8c2f23" stroke-width="5" fill="none">
      <path d="M18 58 V88 M45 58 V88 M72 58 V88 M99 58 V88 M126 58 V88 M153 58 V88 M180 58 V88 M207 58 V88"/>
      <path d="M24 26 V52 M54 26 V52 M84 26 V52 M114 26 V52 M144 26 V52 M174 26 V52 M204 26 V52"/>
    </g>
    <g stroke="#fbf9f4" stroke-width="3"><path d="M18 72 H208"/><path d="M25 39 H205"/></g>
    <path d="M95 160 V132 Q115 108 135 132 V160" fill="#2a211b"/>
  </g>
  <text x="75" y="380" font-family="Arial, sans-serif" font-size="14" fill="#765e4f">Confirmed visual gap in the V3 preview and showcase actor.</text>

  <path d="M410 260 H520" stroke="#a16d2d" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="420" y="240" font-family="Arial, sans-serif" font-size="16" fill="#775122">Blueprint repair</text>

  <rect x="535" y="120" width="310" height="285" rx="12" fill="#e1eadf" stroke="#718b6b" stroke-width="2"/>
  <text x="555" y="150" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#25492d">After</text>
  <text x="555" y="177" font-family="Arial, sans-serif" font-size="15" fill="#425844">Twelve shallow M_DoorWood panels sit</text>
  <text x="555" y="198" font-family="Arial, sans-serif" font-size="15" fill="#425844">behind the lattice: four sides × three levels.</text>
  <g transform="translate(580 222)">
    <rect x="0" y="90" width="230" height="70" fill="#b4afa5" stroke="#716a60"/>
    <path d="M15 90 L20 55 L210 55 L215 90" fill="#2e6656" stroke="#173f34" stroke-width="5"/>
    <path d="M25 52 L35 20 L200 20 L210 52" fill="#34765e" stroke="#173f34" stroke-width="5"/>
    <path d="M40 18 L55 0 L180 0 L195 18" fill="#3c8267" stroke="#173f34" stroke-width="5"/>
    <g fill="#3b211b" stroke="#8c2f23" stroke-width="5">
      <rect x="18" y="58" width="190" height="28"/><rect x="25" y="26" width="180" height="24"/>
    </g>
    <g stroke="#8c2f23" stroke-width="5" fill="none">
      <path d="M18 58 V88 M45 58 V88 M72 58 V88 M99 58 V88 M126 58 V88 M153 58 V88 M180 58 V88 M207 58 V88"/>
      <path d="M25 26 V52 M54 26 V52 M84 26 V52 M114 26 V52 M144 26 V52 M174 26 V52 M204 26 V52"/>
    </g>
    <path d="M95 160 V132 Q115 108 135 132 V160" fill="#2a211b"/>
    <text x="102" y="118" font-family="Arial, sans-serif" font-size="12" fill="#d5a33d">正南门</text>
  </g>
  <text x="555" y="380" font-family="Arial, sans-serif" font-size="14" fill="#416044">Signboard, door, roof, moss, and collision components remain intact.</text>

  <rect x="55" y="455" width="1090" height="285" rx="12" fill="#fffdf8" stroke="#b7aa96" stroke-width="2"/>
  <text x="75" y="490" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#432d22">Implementation and validation contract</text>
  <g font-family="Arial, sans-serif" font-size="15" fill="#3b342c">
    <text x="85" y="530">1. Load BP_Zhengnanmen_AAA_V3 and add 12 static cube components named ReferenceInfill_L{0..2}_{F,B,L,R}.</text>
    <text x="85" y="558">2. Use package-local M_DoorWood, NoCollision, Static mobility, and dimensions kept inside the authored 25.6 m × 15.8 m footprint.</text>
    <text x="85" y="586">3. Compile/save the Blueprint; reload the preview and showcase maps; preserve the six hidden BlockAll collision components.</text>
    <text x="85" y="626" fill="#2c633d">PASS  AuditV3BuildingDetails.py — 25 total components, 19 visible, 6 collision.</text>
    <text x="85" y="652" fill="#2c633d">PASS  ValidateAllV3Details.py, ValidateV3BuildingPlacement.py, ValidateV3Buildings.py.</text>
    <text x="85" y="678" fill="#2c633d">PASS  Front and rear rendered captures — panels sit behind the lattice and leave the signboard and arched door clear.</text>
    <text x="85" y="710" fill="#775122">Scope guard: no other V3 building Blueprint or source geometry was changed.</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a16d2d"/>
    </marker>
  </defs>
</svg>
