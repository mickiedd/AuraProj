<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <title>Guidemen high-poly GLB import into AuraProj</title>
  <desc>Flow from the supplied GLB through Unreal Interchange to a Nanite static mesh with PBR materials and validation evidence.</desc>
  <defs>
    <style>
      .bg{fill:#f7f4ed}.panel{fill:#fffdf8;stroke:#d8cdbb;stroke-width:2}.source{fill:#e8f0ff;stroke:#6d8ec4;stroke-width:2}.process{fill:#fff0d8;stroke:#c58b3b;stroke-width:2}.result{fill:#e6f5ec;stroke:#5f9b76;stroke-width:2}.guard{fill:#fff2f2;stroke:#bf6f6f;stroke-width:2}.h{font:700 25px Arial,sans-serif;fill:#243247}.title{font:700 32px Arial,sans-serif;fill:#1e2938}.body{font:17px Arial,sans-serif;fill:#334155}.small{font:15px Arial,sans-serif;fill:#475569}.label{font:700 18px Arial,sans-serif;fill:#243247}.arrow{stroke:#7c8798;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c8798"/></marker>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="60" y="62">Guidemen high-poly asset import</text>
  <text class="small" x="60" y="92">AuraProj change archive | 2026-09-10</text>

  <rect class="panel" x="50" y="125" width="1100" height="175" rx="18"/>
  <text class="h" x="78" y="165">Before</text>
  <rect class="source" x="78" y="190" width="390" height="78" rx="12"/>
  <text class="label" x="100" y="222">Guidemen_HighPoly_UE5_4K.glb</text>
  <text class="small" x="100" y="249">3,163,318 vertices | 5,401,426 triangles | embedded PBR</text>
  <path class="arrow" d="M 490 229 L 690 229"/>
  <rect class="process" x="716" y="170" width="390" height="118" rx="12"/>
  <text class="label" x="740" y="205">No AuraProj asset</text>
  <text class="body" x="740" y="235">Source existed outside the project.</text>
  <text class="body" x="740" y="261">Requested nested path resolved to</text>
  <text class="body" x="740" y="282">the flat Raw3DModels copy.</text>

  <rect class="panel" x="50" y="330" width="1100" height="205" rx="18"/>
  <text class="h" x="78" y="370">After</text>
  <rect class="process" x="78" y="396" width="280" height="104" rx="12"/>
  <text class="label" x="100" y="430">Interchange GLB import</text>
  <text class="body" x="100" y="458">Static mesh + materials</text>
  <text class="body" x="100" y="483">Nanite build enabled</text>
  <path class="arrow" d="M 378 448 L 490 448"/>
  <rect class="result" x="516" y="382" width="310" height="132" rx="12"/>
  <text class="label" x="540" y="416">/Game/.../Guidemen</text>
  <text class="body" x="540" y="445">SM_Guidemen</text>
  <text class="body" x="540" y="471">8 assigned PBR materials</text>
  <text class="body" x="540" y="497">9 imported texture assets</text>
  <path class="arrow" d="M 846 448 L 958 448"/>
  <rect class="result" x="984" y="382" width="140" height="132" rx="12"/>
  <text class="label" x="1005" y="416">Validated</text>
  <text class="small" x="1005" y="445">30.6 m W</text>
  <text class="small" x="1005" y="469">13.94 m D</text>
  <text class="small" x="1005" y="493">18.97 m H</text>

  <rect class="guard" x="50" y="570" width="530" height="135" rx="18"/>
  <text class="h" x="78" y="610">Important guard</text>
  <text class="body" x="78" y="640">Collision import is disabled intentionally.</text>
  <text class="body" x="78" y="666">Author simple gameplay collision separately</text>
  <text class="body" x="78" y="692">so the high-poly render mesh stays independent.</text>
  <rect class="panel" x="620" y="570" width="530" height="135" rx="18"/>
  <text class="h" x="648" y="610">Validation evidence</text>
  <text class="body" x="648" y="640">ImportGuidemen.py: IMPORT_VALIDATED</text>
  <text class="body" x="648" y="666">ValidateGuidemenImport.py: VALIDATION_PASSED</text>
  <text class="small" x="648" y="692">Nanite on | BaseColor sRGB | Normal/ORM linear</text>
</svg>
