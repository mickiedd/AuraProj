<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Role Battle Day 17 replay-safe merchant transaction flow</title>
  <desc id="desc">An owner request reaches the authority commerce subsystem, which validates a bound Civilian merchant and atomically commits stock, wallet, and inventory before returning a private result. Replay, contention, and merchant death are tested.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081426"/><stop offset="1" stop-color="#17263e"/></linearGradient>
    <linearGradient id="authority" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1d8bb5"/><stop offset="1" stop-color="#4e6ee8"/></linearGradient>
    <linearGradient id="commit" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#16b89a"/><stop offset="1" stop-color="#57d38e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8edfff"/></marker>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <text x="60" y="62" fill="#f4f8ff" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="700">Role/Battle Day 17</text>
  <text x="60" y="98" fill="#a7bfd2" font-family="Segoe UI,Arial,sans-serif" font-size="20">Merchant transactions: bound, replay-safe, atomic, owner-private</text>

  <rect x="55" y="145" width="260" height="210" rx="18" fill="#19354b" stroke="#397e9e" stroke-width="2" filter="url(#shadow)"/>
  <text x="82" y="184" fill="#8edfff" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">OWNER REQUEST</text>
  <text x="82" y="226" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Player interaction</text>
  <text x="82" y="262" fill="#d2e6f2" font-family="Segoe UI,Arial,sans-serif" font-size="17">nonce + request ID</text>
  <text x="82" y="291" fill="#d2e6f2" font-family="Segoe UI,Arial,sans-serif" font-size="17">merchant ref + offer ID</text>
  <text x="82" y="326" fill="#8de6bd" font-family="Segoe UI,Arial,sans-serif" font-size="16">server RPC endpoint</text>

  <path d="M315 248 L390 248" stroke="#8edfff" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="390" y="145" width="320" height="210" rx="18" fill="url(#authority)" stroke="#a2e9ff" stroke-width="2" filter="url(#shadow)"/>
  <text x="420" y="184" fill="#062238" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">AUTHORITY SUBSYSTEM</text>
  <text x="420" y="226" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Resolve + validate</text>
  <text x="420" y="262" fill="#e9faff" font-family="Segoe UI,Arial,sans-serif" font-size="17">bound Civilian + immutable offer</text>
  <text x="420" y="291" fill="#e9faff" font-family="Segoe UI,Arial,sans-serif" font-size="17">range / LOS / life / eligibility</text>
  <text x="420" y="326" fill="#062238" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">256-entry replay cache</text>

  <path d="M710 248 L785 248" stroke="#8edfff" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="785" y="145" width="360" height="210" rx="18" fill="url(#commit)" stroke="#b4f5d2" stroke-width="2" filter="url(#shadow)"/>
  <text x="815" y="184" fill="#063026" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">ATOMIC COMMIT</text>
  <text x="815" y="226" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">One transaction</text>
  <text x="815" y="262" fill="#edfff5" font-family="Segoe UI,Arial,sans-serif" font-size="17">stock − 1 • wallet − price</text>
  <text x="815" y="291" fill="#edfff5" font-family="Segoe UI,Arial,sans-serif" font-size="17">inventory + configured quantity</text>
  <text x="815" y="326" fill="#063026" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">rollback before publication</text>

  <rect x="55" y="415" width="1090" height="220" rx="18" fill="#102333" stroke="#31566d" stroke-width="2"/>
  <text x="82" y="458" fill="#8edfff" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">GATED OUTCOMES</text>
  <g fill="#dceaf3" font-family="Segoe UI,Arial,sans-serif" font-size="18">
    <text x="82" y="501">✓ owner-only typed result and presentation</text>
    <text x="82" y="540">✓ exact replay returns cached result without mutation</text>
    <text x="82" y="579">✓ one success + one SoldOut under last-stock contention</text>
    <text x="630" y="501">✓ dead merchant closes interaction state</text>
    <text x="630" y="540">✓ 13/13 focused native tests</text>
    <text x="630" y="579">✓ 183/183 full Aura tests</text>
  </g>
  <text x="60" y="705" fill="#7a9bb0" font-family="Segoe UI,Arial,sans-serif" font-size="15">2026-08-28 • AuraProj • Day 17 completion evidence • Listen + Dedicated smoke passed</text>
</svg>
