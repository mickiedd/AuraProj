<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Guidemen building placement in Scifi Desert</title>
  <desc id="desc">Before and after diagram showing the imported Guidemen mesh placed as a grounded, non-overlapping building in L_showcase_level.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101b2d"/>
      <stop offset="1" stop-color="#182338"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7b978"/>
      <stop offset="1" stop-color="#9d744b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#07101c" flood-opacity="0.55"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#68d5ff"/>
    </marker>
    <style>
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #f1f6ff; }
      .subtitle { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #a9bad1; }
      .panel { fill: #20304a; stroke: #405979; stroke-width: 2; }
      .panel-title { font: 700 21px 'Segoe UI', Arial, sans-serif; fill: #f1f6ff; }
      .body { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #d5e1ef; }
      .small { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #b5c7dc; }
      .mono { font: 400 14px Consolas, monospace; fill: #d5e1ef; }
      .good { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #7ce3a3; }
      .warn { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #ffd17c; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <text x="56" y="58" class="title">Guidemen building — Scifi Desert placement</text>
  <text x="56" y="88" class="subtitle">Level: /Game/Scifi_desert_city/Level/L_showcase_level</text>

  <rect x="56" y="126" width="500" height="500" rx="16" class="panel"/>
  <text x="84" y="170" class="panel-title">Before</text>
  <text x="84" y="199" class="body">Imported asset existed in the Content Browser,</text>
  <text x="84" y="223" class="body">but no Guidemen actor was in the level.</text>
  <rect x="96" y="268" width="420" height="210" rx="10" fill="url(#sand)" stroke="#e6cb94" stroke-width="2"/>
  <path d="M120 430 Q180 360 244 414 T366 397 T492 418" fill="none" stroke="#c2925d" stroke-width="8" opacity="0.65"/>
  <path d="M120 452 Q188 402 260 445 T389 432 T492 451" fill="none" stroke="#8b623e" stroke-width="5" opacity="0.6"/>
  <rect x="256" y="300" width="104" height="104" rx="8" fill="#41526a" stroke="#7186a4" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="308" y="349" text-anchor="middle" class="small">asset</text>
  <text x="308" y="371" text-anchor="middle" class="small">only</text>
  <text x="96" y="526" class="warn">No level actor</text>
  <text x="96" y="558" class="mono">SM_Guidemen.uasset</text>
  <text x="96" y="588" class="small">Nanite mesh + repaired embedded-PBR materials</text>

  <line x1="575" y1="376" x2="625" y2="376" stroke="#68d5ff" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="600" y="350" text-anchor="middle" class="small">place + save</text>

  <rect x="654" y="126" width="490" height="500" rx="16" class="panel"/>
  <text x="682" y="170" class="panel-title">After</text>
  <text x="682" y="199" class="body">One grounded StaticMeshActor occupies the</text>
  <text x="682" y="223" class="body">western-edge slot between existing gates.</text>
  <rect x="694" y="268" width="410" height="210" rx="10" fill="url(#sand)" stroke="#e6cb94" stroke-width="2"/>
  <path d="M720 430 Q780 360 844 414 T966 397 T1080 418" fill="none" stroke="#c2925d" stroke-width="8" opacity="0.65"/>
  <path d="M720 452 Q788 402 860 445 T989 432 T1080 451" fill="none" stroke="#8b623e" stroke-width="5" opacity="0.6"/>
  <g filter="url(#shadow)">
    <path d="M842 410 L842 335 L866 312 L866 287 L920 287 L945 312 L945 410 Z" fill="#7e8fa2" stroke="#d3e1ed" stroke-width="2"/>
    <path d="M866 287 L920 287 L945 312 L891 312 Z" fill="#b8c6d2" stroke="#d3e1ed" stroke-width="2"/>
    <path d="M891 312 L945 312 L945 410 L891 410 Z" fill="#596c82" stroke="#b5c6d5" stroke-width="2"/>
    <path d="M857 349 L875 333 L875 389 L857 399 Z" fill="#27394d"/>
    <path d="M902 333 L922 345 L922 399 L902 389 Z" fill="#26384b"/>
    <path d="M882 318 L894 318 L894 389 L882 389 Z" fill="#d3ad66" opacity="0.9"/>
  </g>
  <line x1="842" y1="423" x2="945" y2="423" stroke="#7ce3a3" stroke-width="3"/>
  <text x="895" y="452" text-anchor="middle" class="small">terrain contact</text>
  <text x="682" y="526" class="good">Saved and reloaded</text>
  <text x="682" y="554" class="mono">Location: (-140400, 110295, 100) cm</text>
  <text x="682" y="580" class="mono">Bounds: 3060 × 1394 × 1897 cm</text>
  <text x="682" y="606" class="small">Tag: ImportedGuidemenBuilding · no XY overlap</text>

  <rect x="56" y="658" width="1088" height="60" rx="12" fill="#14273a" stroke="#365a70"/>
  <text x="80" y="694" class="good">Validation gate passed:</text>
  <text x="265" y="694" class="body">one tagged actor · correct mesh reference · grounded · overlap-free · map save succeeded</text>
</svg>
