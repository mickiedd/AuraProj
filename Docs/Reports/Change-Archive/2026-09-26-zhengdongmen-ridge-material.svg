<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080">
<defs>
  <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f7f5ef"/><stop offset="1" stop-color="#e8e5dc"/></linearGradient>
  <linearGradient id="tile" x2="0" y2="1"><stop stop-color="#9aa0a0"/><stop offset="1" stop-color="#5d6465"/></linearGradient>
  <linearGradient id="cap" x2="0" y2="1"><stop stop-color="#7e827e"/><stop offset="1" stop-color="#3f4444"/></linearGradient>
  <linearGradient id="capsec" x2="0" y2="1"><stop stop-color="#8b8f8a"/><stop offset="1" stop-color="#4a4f4f"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1d2931" flood-opacity=".14"/></filter>
  <pattern id="smear" width="14" height="14" patternTransform="rotate(0)" patternUnits="userSpaceOnUse">
    <rect width="14" height="14" fill="#4a5254"/>
    <line x1="7" y1="0" x2="7" y2="14" stroke="#8e9490" stroke-width="2.6"/>
  </pattern>
  <marker id="dim" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
    <path d="M0 4 L8 1 L8 7 Z" fill="#9a5c32"/>
  </marker>
</defs>
<rect width="1440" height="1080" fill="url(#bg)"/>
<text x="64" y="70" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#9a5c32">AURA PROJECT · GUANGZHOU LANDMARKS</text>
<text x="64" y="124" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#17252d">Zhengdongmen · the roof ridges get their own material</text>
<text x="64" y="159" font-family="Arial,sans-serif" font-size="19" fill="#52616a">The 屋脊 — main ridge, four hip ridges and eight upturned eave corners — no longer share the roof-tile field.</text>

<!-- ============================ BEFORE ============================ -->
<rect x="64" y="196" width="620" height="392" rx="18" fill="#fffdfa" filter="url(#shadow)"/>
<text x="94" y="240" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#a64e40">BEFORE · RIDGE SHARED THE ROOF-TILE MATERIAL</text>
<!-- the hip as a square tube, with a world-XZ projection of the tile field crossing it -->
<g transform="translate(0,0)">
  <path d="M170 320 L330 300 L520 470 L360 490 Z" fill="#3d4547" stroke="#26343c" stroke-width="2.4"/>
  <path d="M170 320 L330 300 L520 470 L360 490 Z" fill="url(#smear)" opacity=".85"/>
  <path d="M206 328 L366 476 M242 336 L402 483 M278 344 L438 491 M314 352 L474 498" stroke="#cfd3cd" stroke-width="2.4" opacity=".55"/>
</g>
<text x="94" y="530" font-family="Arial,sans-serif" font-size="17" fill="#617078">A 0.34 m <tspan font-weight="700" fill="#26343c">square</tspan> tube, so the hip has flat sides and a square silhouette.</text>
<text x="94" y="558" font-family="Arial,sans-serif" font-size="17" fill="#617078">Its UVs come from a <tspan font-weight="700" fill="#26343c">world-space XZ projection</tspan>, so the tile field's</text>
<text x="94" y="586" font-family="Arial,sans-serif" font-size="17" fill="#617078">ribs and courses smear along a diagonal hip instead of running down it.</text>

<!-- ============================ AFTER ============================ -->
<rect x="716" y="196" width="660" height="392" rx="18" fill="#fffdfa" filter="url(#shadow)"/>
<text x="746" y="240" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#397253">AFTER · HALF-ROUND CAP ON ITS OWN Ridge MATERIAL</text>
<g>
  <!-- the hip drawn as one run of ridge tiles: a rounded cap with joints across it -->
  <g transform="translate(782,300) rotate(30)">
    <rect x="0" y="0" width="310" height="54" rx="27" fill="url(#cap)" stroke="#252d30" stroke-width="2"/>
    <g stroke="#b9beb8" stroke-width="1.8" opacity=".55">
      <path d="M78 3 v48 M156 3 v48 M234 3 v48"/>
    </g>
    <g stroke="#e2e6e0" stroke-width="1.1" opacity=".28">
      <path d="M10 16 h290 M10 38 h290"/>
    </g>
  </g>
  <text x="1096" y="336" font-family="Arial,sans-serif" font-size="13" fill="#617078">joints cross</text>
  <text x="1096" y="356" font-family="Arial,sans-serif" font-size="13" fill="#617078">the cap</text>
  <text x="900" y="512" font-family="Arial,sans-serif" font-size="13" fill="#617078">weathering runs with it</text>
</g>
<text x="746" y="530" font-family="Arial,sans-serif" font-size="17" fill="#617078">A half-round 脊瓦 cap that <tspan font-weight="700" fill="#26343c">fills the same 0.34 m box</tspan>, so the building's</text>
<text x="746" y="558" font-family="Arial,sans-serif" font-size="17" fill="#617078">measured envelope does not move. UVs run <tspan font-weight="700" fill="#26343c">along the ridge on u</tspan> and</text>
<text x="746" y="586" font-family="Arial,sans-serif" font-size="17" fill="#617078">once <tspan font-weight="700" fill="#26343c">around the section on v</tspan>, so the joints cross the cap and the</text>
<text x="746" y="614" font-family="Arial,sans-serif" font-size="17" fill="#617078">weathering runs with it.</text>

<!-- ============================ SECTION + UV + NUMBERS ============================ -->
<rect x="64" y="620" width="1312" height="368" rx="18" fill="#fffdfa" filter="url(#shadow)"/>
<text x="94" y="664" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#9a5c32">SECTION · SAME BOX, DIFFERENT SILHOUETTE</text>

<!-- square section -->
<rect x="150" y="700" width="120" height="120" fill="#5d6465" stroke="#26343c" stroke-width="2.4"/>
<text x="210" y="844" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#617078">before · square tube</text>
<!-- cap section -->
<path d="M400 820 L400 760 A60 60 0 0 1 520 760 L520 820 Z" fill="url(#capsec)" stroke="#26343c" stroke-width="2.4"/>
<text x="460" y="844" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#617078">after · 脊瓦 cap</text>
<g stroke="#b35638" stroke-width="1.6" stroke-dasharray="5 4" fill="none">
  <rect x="150" y="700" width="120" height="120"/>
  <rect x="400" y="700" width="120" height="120"/>
</g>
<text x="330" y="884" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#b35638">identical extents</text>
<path d="M276 764 L394 764" stroke="#9a5c32" stroke-width="1.6" marker-end="url(#dim)" marker-start="url(#dim)"/>
<text x="335" y="748" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#9a5c32">0.34 m both ways</text>

<!-- UV registration bar -->
<text x="600" y="672" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#26343c">TEXTURE REGISTRATION · 1024 × 512</text>
<rect x="600" y="700" width="150" height="240" fill="#4a4f4f"/>
<rect x="600" y="700" width="150" height="78" fill="#3a3f3f"/>
<rect x="600" y="778" width="150" height="39" fill="#5a6060"/>
<rect x="600" y="817" width="150" height="84" fill="#7e827e"/>
<rect x="600" y="901" width="150" height="39" fill="#4a4f4f"/>
<path d="M600 859 h150" stroke="#e8e2cf" stroke-width="1.6" stroke-dasharray="4 4"/>
<text x="762" y="746" font-family="Arial,sans-serif" font-size="14" fill="#8a5145">v 0–0.33 · flat base (under the roof)</text>
<text x="762" y="798" font-family="Arial,sans-serif" font-size="14" fill="#8a5145">v 0.33–0.49 · flank</text>
<text x="762" y="862" font-family="Arial,sans-serif" font-size="14" fill="#397253">v 0.49–0.84 · cap arc, crest at 0.66</text>
<text x="762" y="918" font-family="Arial,sans-serif" font-size="14" fill="#8a5145">v 0.84–1.00 · flank</text>
<text x="762" y="960" font-family="Arial,sans-serif" font-size="14" fill="#617078">u runs along the ridge at 1.5 m per repeat, with four</text>
<text x="762" y="982" font-family="Arial,sans-serif" font-size="14" fill="#617078">joints per repeat — a ridge-tile joint every 0.375 m.</text>

<!-- numbers -->
<rect x="1120" y="700" width="226" height="240" rx="12" fill="#f4f1e9"/>
<text x="1140" y="730" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#9a5c32">MEASURED</text>
<text x="1140" y="762" font-family="Arial,sans-serif" font-size="15" fill="#26343c">Ridge part <tspan font-weight="700">680 tris</tspan></text>
<text x="1140" y="786" font-family="Arial,sans-serif" font-size="15" fill="#26343c">17 ridge beams</text>
<text x="1140" y="810" font-family="Arial,sans-serif" font-size="15" fill="#26343c">RoofTile 289,852<tspan fill="#617078">→</tspan></text>
<text x="1140" y="830" font-family="Arial,sans-serif" font-size="15" fill="#26343c">      289,648</text>
<text x="1140" y="854" font-family="Arial,sans-serif" font-size="15" fill="#26343c">Gate 337,154<tspan fill="#617078">→</tspan><tspan font-weight="700">337,630</tspan></text>
<text x="1140" y="882" font-family="Arial,sans-serif" font-size="15" fill="#26343c">Ridge box 2697 ×</text>
<text x="1140" y="902" font-family="Arial,sans-serif" font-size="15" fill="#26343c">1409 × 722 cm —</text>
<text x="1140" y="922" font-family="Arial,sans-serif" font-size="15" fill="#397253">the old RoofTile box</text>

<text x="64" y="1032" font-family="Arial,sans-serif" font-size="14" fill="#66737a">Generator: ContentSource/GuangzhouLandmarks/Zhengdongmen/source/build_zhengdongmen.py · Textures: Scripts/MakeZhengdongmenRidgeTextures.py</text>
<text x="64" y="1056" font-family="Arial,sans-serif" font-size="14" fill="#8a949a">The supplied package has no artwork for this group, so its maps are authored here. Envelope, facing and every other part unchanged; landmark validation 0 errors / 0 warnings.</text>
</svg>
