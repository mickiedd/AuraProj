<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">A Little Princess retelling expansion and review</title>
  <desc id="desc">A visual summary of the expansion from a short nineteen-chapter manuscript to a 58,741-word retelling with every chapter above 3,000 words, plus duplicate, continuity, and readability checks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ed"/>
      <stop offset="1" stop-color="#f1f6ff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6c85f"/>
      <stop offset="1" stop-color="#e59a32"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#26354a" flood-opacity=".16"/>
    </filter>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #18273b; }
      .subtitle { font: 400 17px 'Segoe UI', Arial, sans-serif; fill: #506176; }
      .label { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #18273b; }
      .body { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #33465e; }
      .small { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #53657b; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #18273b; }
      .metricSmall { font: 700 17px 'Segoe UI', Arial, sans-serif; fill: #18273b; }
      .white { fill: #ffffff; }
      .line { stroke: #b8c8d9; stroke-width: 3; fill: none; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>
  <rect x="34" y="28" width="1332" height="844" rx="24" fill="#ffffff" opacity=".72" stroke="#d8e2ec" stroke-width="2"/>

  <text x="72" y="84" class="title">A Little Princess · 3,000-word chapter expansion</text>
  <text x="72" y="116" class="subtitle">Easy-English retelling review · 19 chapters · 2026-09-16</text>

  <rect x="72" y="150" width="296" height="270" rx="18" fill="#fff3df" stroke="#edc786" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="112" cy="194" r="22" fill="#e59a32"/>
  <text x="112" y="201" text-anchor="middle" font-family="Segoe UI, Arial" font-size="22" font-weight="700" fill="#fff">1</text>
  <text x="150" y="201" class="label">Before · short draft</text>
  <text x="98" y="245" class="metric">6,205 words</text>
  <text x="98" y="273" class="body">19 chapters, 290–361 words each</text>
  <text x="98" y="312" class="body">Plot abstract expanded once,</text>
  <text x="98" y="336" class="body">but below the requested depth.</text>
  <path d="M98 367 H338" class="line"/>
  <text x="98" y="394" class="small">Revision target: every chapter ≥ 3,000</text>

  <path d="M382 285 H452" class="line"/>
  <path d="M438 273 L458 285 L438 297" fill="none" stroke="#b8c8d9" stroke-width="3"/>

  <rect x="468" y="150" width="452" height="270" rx="18" fill="#edf6ff" stroke="#9fc5e8" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="508" cy="194" r="22" fill="#3b82b7"/>
  <text x="508" y="201" text-anchor="middle" font-family="Segoe UI, Arial" font-size="22" font-weight="700" fill="#fff">2</text>
  <text x="546" y="201" class="label">After · complete retelling</text>
  <text x="494" y="245" class="metric">58,741 words</text>
  <text x="494" y="273" class="body">19 chapters · 3,004–3,344 words each</text>
  <text x="494" y="312" class="body">Scene-level action, frequent dialogue,</text>
  <text x="494" y="336" class="body">gentle humor, and clear emotional cause/effect.</text>
  <path d="M494 367 H894" class="line"/>
  <text x="494" y="394" class="small">New material stays original and child-friendly.</text>

  <rect x="948" y="150" width="338" height="270" rx="18" fill="#effaf1" stroke="#a9d7b0" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="988" cy="194" r="22" fill="#4e9b62"/>
  <text x="988" y="201" text-anchor="middle" font-family="Segoe UI, Arial" font-size="22" font-weight="700" fill="#fff">3</text>
  <text x="1026" y="201" class="label">Review gates</text>
  <text x="974" y="244" class="metricSmall">19/19 headings in order</text>
  <text x="974" y="272" class="metricSmall">0 repeated long paragraphs</text>
  <text x="974" y="300" class="metricSmall">0 repeated 8+ word sentences</text>
  <text x="974" y="328" class="metricSmall">3,499 / 3,499 quotes</text>
  <text x="974" y="356" class="metricSmall">0 TODO/FIXME/TBD/BUG markers</text>
  <text x="974" y="392" class="small">Recurring short dialogue is intentional.</text>

  <text x="72" y="478" class="label">Story flow preserved and strengthened</text>
  <path d="M116 583 H1272" class="line"/>
  <path d="M1238 571 L1276 583 L1238 595" fill="none" stroke="#b8c8d9" stroke-width="3"/>

  <g filter="url(#shadow)">
    <circle cx="150" cy="583" r="46" fill="url(#gold)"/>
    <text x="150" y="578" text-anchor="middle" class="label">1–4</text>
    <text x="150" y="600" text-anchor="middle" class="small">arrival</text>
    <circle cx="355" cy="583" r="46" fill="#8fc6e8"/>
    <text x="355" y="578" text-anchor="middle" class="label">5–7</text>
    <text x="355" y="600" text-anchor="middle" class="small">friendship</text>
    <circle cx="560" cy="583" r="46" fill="#a7d6a8"/>
    <text x="560" y="578" text-anchor="middle" class="label">8–9</text>
    <text x="560" y="600" text-anchor="middle" class="small">attic courage</text>
    <circle cx="765" cy="583" r="46" fill="#c8b5e8"/>
    <text x="765" y="578" text-anchor="middle" class="label">10–14</text>
    <text x="765" y="600" text-anchor="middle" class="small">help crosses wall</text>
    <circle cx="970" cy="583" r="46" fill="#f2b4b4"/>
    <text x="970" y="578" text-anchor="middle" class="label">15–18</text>
    <text x="970" y="600" text-anchor="middle" class="small">truth &amp; repair</text>
    <circle cx="1175" cy="583" r="46" fill="#f4d77f"/>
    <text x="1175" y="578" text-anchor="middle" class="label">19</text>
    <text x="1175" y="600" text-anchor="middle" class="small">Anne helped</text>
  </g>

  <rect x="72" y="676" width="1214" height="148" rx="18" fill="#18273b" filter="url(#shadow)"/>
  <text x="104" y="718" font-family="Segoe UI, Arial" font-size="18" font-weight="700" fill="#f6c85f">Behavior and style guard</text>
  <text x="104" y="753" font-family="Segoe UI, Arial" font-size="16" fill="#f6f9fc">Sara’s imagination makes hard moments bearable; it never erases hunger, grief, or unfairness.</text>
  <text x="104" y="780" font-family="Segoe UI, Arial" font-size="16" fill="#f6f9fc">Kindness and friendship resolve the story. Wealth becomes a tool for shared warmth, food, books, and safe choices.</text>
  <text x="104" y="807" font-family="Segoe UI, Arial" font-size="14" fill="#b9c8d8">Readability pass: short-to-medium sentences, repeated concrete nouns, frequent dialogue, playful images, and age-appropriate stakes.</text>
</svg>
