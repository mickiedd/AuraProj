<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Aura gameplay HUD refactored to WebUI only</title>
  <desc id="desc">Before and after flow showing the WBP overlay removed from AAuraHUD runtime presentation and replaced by a full-screen transparent hud.html connected to GAS widget controllers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#081421"/><stop offset="1" stop-color="#13283d"/></linearGradient>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#f4f8ff}.sub{font:400 16px Arial,sans-serif;fill:#a8bfd3}.head{font:700 18px Arial,sans-serif;fill:#071421}.body{font:400 15px Arial,sans-serif;fill:#d4e3ef}.small{font:400 13px Arial,sans-serif;fill:#9fb7cb}.code{font:600 14px ui-monospace,monospace;fill:#bdeeff}.good{font:700 15px Arial,sans-serif;fill:#92f0c2}.warn{font:700 15px Arial,sans-serif;fill:#ffd977}
    </style>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <text x="56" y="58" class="title">Gameplay HUD → AuraWebUI only</text>
  <text x="56" y="86" class="sub">UE5.5 • AAuraHUD • complete presentation migration from native WBP/Canvas paths</text>

  <rect x="56" y="125" width="360" height="430" rx="18" fill="#f4f7fa" stroke="#d36e78" stroke-width="2"/>
  <rect x="56" y="125" width="360" height="48" rx="18" fill="#c45162"/>
  <text x="82" y="156" class="head">BEFORE · mixed presentation</text>
  <text x="82" y="214" class="body" fill="#23384d">AAuraHUD::InitOverlay</text>
  <text x="82" y="252" class="body" fill="#23384d">CreateWidget(WBP_Overlay)</text>
  <text x="82" y="286" class="body" fill="#23384d">Native health/mana + spell globes</text>
  <text x="82" y="320" class="body" fill="#23384d">Native menu button delegates</text>
  <text x="82" y="354" class="body" fill="#23384d">Canvas interaction/location text</text>
  <text x="82" y="404" class="warn">Browser readiness hid pieces of WBP</text>
  <text x="82" y="430" class="warn">Disconnect restored native fallback</text>
  <text x="82" y="490" class="small" fill="#41576a">State and actions were split across</text>
  <text x="82" y="512" class="small" fill="#41576a">native widgets and a partial skill page.</text>

  <path d="M430 340 C475 340 485 340 530 340" fill="none" stroke="#65dcff" stroke-width="4" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#65dcff"/></marker></defs>

  <rect x="530" y="125" width="614" height="430" rx="18" fill="#e9fbf3" stroke="#59c58f" stroke-width="2"/>
  <rect x="530" y="125" width="614" height="48" rx="18" fill="#329967"/>
  <text x="556" y="156" class="head">AFTER · one WebUI presentation surface</text>
  <rect x="556" y="200" width="250" height="120" rx="12" fill="#122b40" stroke="#65dcff"/>
  <text x="576" y="232" class="code">hud.html</text>
  <text x="576" y="260" class="body">transparent full viewport</text>
  <text x="576" y="284" class="body">vitals • progress • skill bar</text>
  <text x="576" y="308" class="body">attributes • spells • quit</text>
  <rect x="834" y="200" width="276" height="120" rx="12" fill="#122b40" stroke="#65dcff"/>
  <text x="854" y="232" class="code">WebSocket bridge</text>
  <text x="854" y="260" class="body">hud_ready → state replay</text>
  <text x="854" y="284" class="body">explicit JSON commands</text>
  <text x="854" y="308" class="body">no native fallback path</text>
  <path d="M806 260 L834 260" stroke="#65dcff" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="556" y="355" width="554" height="155" rx="12" fill="#d8f5e6" stroke="#59c58f"/>
  <text x="578" y="387" class="head">Native controllers remain the gameplay boundary</text>
  <text x="578" y="419" class="body" fill="#183b2b">Overlay controller → vitals, progress, equipped abilities, messages</text>
  <text x="578" y="445" class="body" fill="#183b2b">Attribute/Spell controllers → catalogs, upgrades, spend/equip actions</text>
  <text x="578" y="471" class="body" fill="#183b2b">Target controller → interaction preview and activation</text>
  <text x="578" y="497" class="body" fill="#183b2b">Player controller → validated ability and interaction input</text>

  <rect x="56" y="600" width="1088" height="105" rx="16" fill="#0e2234" stroke="#436981"/>
  <text x="82" y="634" class="good">Validation</text>
  <text x="190" y="634" class="body">AuraEditor build passed • Web HUD 2/2 • AuraWebUI 4/4 • Aura.Abilities 9/9</text>
  <text x="82" y="664" class="small">Static sweep: no WBP overlay construction, native HUD visibility toggles, Canvas DrawText, or native button forwarding in AAuraHUD.</text>
  <text x="82" y="688" class="small">Runtime mount: WebUIWidget loads WebUI/hud.html at z-order 200 with full-viewport transparent geometry.</text>
</svg>
