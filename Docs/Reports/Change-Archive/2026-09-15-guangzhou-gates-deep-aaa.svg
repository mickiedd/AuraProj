<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#101a2d"/>
      <stop offset="1" stop-color="#24364a"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" x2="1">
      <stop offset="0" stop-color="#b9c3c2"/>
      <stop offset="1" stop-color="#78898e"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" x2="1">
