      .body { font: 400 16px Arial, sans-serif; fill: #dce7f3; }
      .small { font: 400 14px Arial, sans-serif; fill: #c4d2e0; }
      .label { font: 700 15px Arial, sans-serif; fill: #10202b; }
      .panel { fill: #18273a; stroke: #52708b; stroke-width: 2; rx: 18; }
      .card { fill: #21364b; stroke: #6085a0; stroke-width: 2; rx: 14; }
      .chip { fill: #31536b; stroke: #83b4c4; stroke-width: 1.5; rx: 9; }
      .guard { fill: #183e45; stroke: #68cbb9; stroke-width: 2; rx: 12; }
      .line { stroke: #80d7c2; stroke-width: 3; fill: none; marker-end: url(#arrow); }
