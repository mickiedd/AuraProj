<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1000" width="1240" height="1000" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1240" height="1000" fill="#f7f8fa"/>

  <text x="40" y="46" font-size="25" font-weight="700" fill="#1a1d21">V4 landmark reference-conformance review</text>
  <text x="40" y="73" font-size="13.5" fill="#5a6270">Structure is faithful; tone is inverted. Root cause: a mid-grey constant multiplied into every base-colour texture.</text>

  <!-- Root cause -->
  <g>
    <text x="40" y="114" font-size="15" font-weight="700" fill="#1a1d21">Root cause — the tint multiply</text>
    <rect x="40" y="128" width="1160" height="96" rx="8" fill="#ffffff" stroke="#e2e5ea"/>

    <rect x="66" y="150" width="120" height="52" rx="6" fill="#eef1f5" stroke="#c8cdd6"/>
    <text x="126" y="172" font-size="12" text-anchor="middle" fill="#33383f">authored</text>
    <text x="126" y="189" font-size="12" text-anchor="middle" fill="#33383f">base colour tex</text>

    <text x="204" y="182" font-size="20" fill="#8a8f98">×</text>

    <rect x="228" y="150" width="120" height="52" rx="6" fill="#fdf0e4" stroke="#e0a86a"/>
    <text x="288" y="172" font-size="12" text-anchor="middle" fill="#8a4b06">tint constant</text>
    <text x="288" y="189" font-size="12" text-anchor="middle" fill="#8a4b06">0.28 – 0.78 grey</text>

    <text x="366" y="182" font-size="20" fill="#8a8f98">=</text>

    <rect x="390" y="150" width="140" height="52" rx="6" fill="#f3d9d5" stroke="#c0392b"/>
    <text x="460" y="172" font-size="12" text-anchor="middle" fill="#8e2a1f">≈ half brightness</text>
    <text x="460" y="189" font-size="12" text-anchor="middle" fill="#8e2a1f">contrast crushed</text>

    <line x1="560" y1="138" x2="560" y2="214" stroke="#e2e5ea"/>

    <text x="584" y="162" font-size="12.5" font-weight="600" fill="#33383f">Consequence</text>
    <text x="584" y="182" font-size="12" fill="#4b5563">Mortar joints, tile courses and plank grain collapse into a narrow luminance band.</text>
    <text x="584" y="201" font-size="12" fill="#4b5563">Roofs go black. Walls read as flat olive/tan slabs instead of weathered stone.</text>
  </g>

  <!-- Conformance matrix -->
  <g>
    <text x="40" y="264" font-size="15" font-weight="700" fill="#1a1d21">Conformance vs reference sheet</text>

    <!-- header -->
    <rect x="40" y="278" width="1160" height="30" rx="5" fill="#eceff3"/>
    <text x="56" y="298" font-size="12" font-weight="600" fill="#33383f">Building</text>
    <text x="250" y="298" font-size="12" font-weight="600" fill="#33383f">Roof tone</text>
    <text x="400" y="298" font-size="12" font-weight="600" fill="#33383f">Wall masonry</text>
    <text x="580" y="298" font-size="12" font-weight="600" fill="#33383f">Floating / stray geometry</text>
    <text x="820" y="298" font-size="12" font-weight="600" fill="#33383f">Heritage detail</text>
    <text x="1010" y="298" font-size="12" font-weight="600" fill="#33383f">Other</text>

    <!-- Dadongmen -->
    <rect x="40" y="314" width="1160" height="66" rx="5" fill="#ffffff" stroke="#eceff3"/>
    <text x="56" y="352" font-size="12.5" font-weight="600" fill="#1a1d21">Dadongmen</text>
    <g font-size="11.5">
      <rect x="250" y="327" width="70" height="20" rx="4" fill="#fdecea" stroke="#c0392b"/><text x="285" y="341" text-anchor="middle" fill="#8e2a1f">dark</text>
      <rect x="400" y="327" width="90" height="20" rx="4" fill="#fdecea" stroke="#c0392b"/><text x="445" y="341" text-anchor="middle" fill="#8e2a1f">joints washed</text>
      <rect x="580" y="327" width="120" height="20" rx="4" fill="#fdecea" stroke="#c0392b"/><text x="640" y="341" text-anchor="middle" fill="#8e2a1f">green shards ×9</text>
      <rect x="820" y="327" width="100" height="20" rx="4" fill="#fff7ed" stroke="#d97706"/><text x="870" y="341" text-anchor="middle" fill="#8a4b06">arch plaque</text>
    </g>
    <text x="56" y="370" font-size="11.5" fill="#5a6270">F1–F5</text>
    <text x="1010" y="341" font-size="11.5" fill="#4b5563">door detail flat black; ground blanked</text>

    <!-- Guidemen -->
    <rect x="40" y="386" width="1160" height="66" rx="5" fill="#ffffff" stroke="#eceff3"/>
    <text x="56" y="424" font-size="12.5" font-weight="600" fill="#1a1d21">Guidemen</text>
    <g font-size="11.5">
      <rect x="250" y="399" width="70" height="20" rx="4" fill="#fdecea" stroke="#c0392b"/><text x="285" y="413" text-anchor="middle" fill="#8e2a1f">black</text>
      <rect x="400" y="399" width="90" height="20" rx="4" fill="#fdecea" stroke="#c0392b"/><text x="445" y="413" text-anchor="middle" fill="#8e2a1f">flat olive</text>
      <rect x="580" y="399" width="120" height="20" rx="4" fill="#eef7ee" stroke="#86c98f"/><text x="640" y="413" text-anchor="middle" fill="#1f6b2e">none seen</text>
      <rect x="820" y="399" width="100" height="20" rx="4" fill="#fdecea" stroke="#c0392b"/><text x="870" y="413" text-anchor="middle" fill="#8e2a1f">歸德 illegible</text>
    </g>
    <text x="56" y="442" font-size="11.5" fill="#5a6270">F6–F9</text>
    <text x="1010" y="413" font-size="11.5" fill="#4b5563">pavilion proportionally small</text>

    <!-- Wuxianmen -->
    <rect x="40" y="458" width="1160" height="66" rx="5" fill="#ffffff" stroke="#eceff3"/>
    <text x="56" y="496" font-size="12.5" font-weight="600" fill="#1a1d21">Wuxianmen</text>
    <g font-size="11.5">
      <rect x="250" y="471" width="70" height="20" rx="4" fill="#fdecea" stroke="#c0392b"/><text x="285" y="485" text-anchor="middle" fill="#8e2a1f">black</text>
      <rect x="400" y="471" width="90" height="20" rx="4" fill="#fdecea" stroke="#c0392b"/><text x="445" y="485" text-anchor="middle" fill="#8e2a1f">tiling visible</text>
      <rect x="580" y="471" width="120" height="20" rx="4" fill="#fdecea" stroke="#c0392b"/><text x="640" y="485" text-anchor="middle" fill="#8e2a1f">2 in sky</text>
      <rect x="820" y="471" width="100" height="20" rx="4" fill="#fff7ed" stroke="#d97706"/><text x="870" y="485" text-anchor="middle" fill="#8a4b06">五仙門 small</text>
    </g>
    <text x="56" y="514" font-size="11.5" fill="#5a6270">F10–F13</text>
    <text x="1010" y="485" font-size="11.5" fill="#4b5563">hall far smaller than reference</text>

    <!-- Zhengximen -->
    <rect x="40" y="530" width="1160" height="66" rx="5" fill="#ffffff" stroke="#eceff3"/>
    <text x="56" y="568" font-size="12.5" font-weight="600" fill="#1a1d21">Zhengximen</text>
    <g font-size="11.5">
      <rect x="250" y="543" width="70" height="20" rx="4" fill="#fdecea" stroke="#c0392b"/><text x="285" y="557" text-anchor="middle" fill="#8e2a1f">black</text>
      <rect x="400" y="543" width="90" height="20" rx="4" fill="#fdecea" stroke="#c0392b"/><text x="445" y="557" text-anchor="middle" fill="#8e2a1f">stripe banding</text>
      <rect x="580" y="543" width="120" height="20" rx="4" fill="#eef7ee" stroke="#86c98f"/><text x="640" y="557" text-anchor="middle" fill="#1f6b2e">none seen</text>
      <rect x="820" y="543" width="100" height="20" rx="4" fill="#fff7ed" stroke="#d97706"/><text x="870" y="557" text-anchor="middle" fill="#8a4b06">正西門 ok</text>
    </g>
    <text x="56" y="586" font-size="11.5" fill="#5a6270">F14–F16</text>
    <text x="1010" y="557" font-size="11.5" fill="#4b5563">flank walls untextured</text>
  </g>

  <!-- Cross-cutting -->
  <g>
    <text x="40" y="632" font-size="15" font-weight="700" fill="#1a1d21">Cross-cutting</text>
    <rect x="40" y="646" width="565" height="92" rx="8" fill="#ffffff" stroke="#e2e5ea"/>
    <text x="58" y="670" font-size="12.5" font-weight="600" fill="#33383f">F17 · LOD1–LOD3 still bind untuned materials</text>
    <text x="58" y="690" font-size="11.5" fill="#4b5563">The rebind covered only LOD0; the validator assertion was narrowed to</text>
    <text x="58" y="708" font-size="11.5" fill="#4b5563">the primary mesh to make it pass, so nothing tests the other LODs.</text>
    <text x="58" y="727" font-size="11.5" fill="#4b5563">F18 · duplicate textures · F19 · %TEMP% references · F20 · heights differ</text>

    <rect x="635" y="646" width="565" height="92" rx="8" fill="#fff7ed" stroke="#e0a86a"/>
    <text x="653" y="670" font-size="12.5" font-weight="600" fill="#8a4b06">Capture harness is not deterministic</text>
    <text x="653" y="690" font-size="11.5" fill="#4b5563">Over an hour and ~20 iterations of trial-and-error camera scripts</text>
    <text x="653" y="708" font-size="11.5" fill="#4b5563">(CaptureDadongmen*) without settling a usable render. Needs a fixed</text>
    <text x="653" y="727" font-size="11.5" fill="#4b5563">transform + fixed FOV, one screenshot per process.</text>
  </g>

  <!-- Requirements -->
  <g>
    <text x="40" y="774" font-size="15" font-weight="700" fill="#1a1d21">Next-pass requirements</text>

    <rect x="40" y="788" width="380" height="180" rx="8" fill="#eef3fe" stroke="#c7d7f7"/>
    <text x="58" y="812" font-size="13" font-weight="700" fill="#1b3f9e">Tone &amp; readability</text>
    <text x="58" y="836" font-size="11.5" fill="#33383f">R1  luminance-preserving tint (mean ±15%)</text>
    <text x="58" y="858" font-size="11.5" fill="#33383f">R2  roof luminance ≥ 0.35, courses readable</text>
    <text x="58" y="880" font-size="11.5" fill="#33383f">R3  ≥ 6 countable mortar courses, sd ≥ 0.06</text>
    <text x="58" y="902" font-size="11.5" fill="#33383f">R6  kill Zhengximen stripe banding</text>
    <text x="58" y="924" font-size="11.5" fill="#33383f">R7  Wuxianmen wall repeat &lt; 4</text>
    <text x="58" y="946" font-size="11.5" fill="#33383f">R9  Dadongmen door luminance ≥ 0.15</text>

    <rect x="440" y="788" width="360" height="180" rx="8" fill="#fdecea" stroke="#e6c3bd"/>
    <text x="458" y="812" font-size="13" font-weight="700" fill="#8e2a1f">Defect removal</text>
    <text x="458" y="836" font-size="11.5" fill="#33383f">R4  no geometry &gt; 5 cm off its surface</text>
    <text x="458" y="858" font-size="11.5" fill="#33383f">R5  vegetation textured, or removed</text>
    <text x="458" y="880" font-size="11.5" fill="#33383f">R8  hide ground components, not materials</text>
    <text x="458" y="902" font-size="11.5" fill="#33383f">R11 legible 歸德 inscription</text>

    <rect x="820" y="788" width="380" height="180" rx="8" fill="#f0fdf4" stroke="#86c98f"/>
    <text x="838" y="812" font-size="13" font-weight="700" fill="#1f6b2e">Integrity</text>
    <text x="838" y="836" font-size="11.5" fill="#33383f">R10 rebind all LODs, restore assertion</text>
    <text x="838" y="858" font-size="11.5" fill="#33383f">R12 accurate geometry_changed; copy ref in</text>
    <text x="838" y="880" font-size="11.5" fill="#33383f">R13 share byte-identical textures</text>
    <text x="838" y="902" font-size="11.5" fill="#33383f">R14 editor/commandlet heights agree ±1 cm</text>
    <text x="838" y="924" font-size="11.5" fill="#33383f">+ deterministic capture camera</text>
  </g>
</svg>
