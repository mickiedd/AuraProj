<text x="94" y="632" font-family="Arial,sans-serif" font-size="16" fill="#617078">Each row is a rectangle sized to its <tspan font-weight="700" fill="#26343c">narrowest</tspan> edge, and the odd rows are</text>
<text x="94" y="656" font-family="Arial,sans-serif" font-size="16" fill="#617078">offset half a tile, so courses never line up down the slope.</text>

