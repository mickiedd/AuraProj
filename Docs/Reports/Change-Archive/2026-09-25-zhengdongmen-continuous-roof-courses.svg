<text x="658" y="632" font-family="Arial,sans-serif" font-size="16" fill="#617078">One run per pitch, ridge to eave, with a split wherever the hip starts to trim it,</text>
<text x="658" y="656" font-family="Arial,sans-serif" font-size="16" fill="#617078">so every course edge lies on the straight hip line and nothing is left bare.</text>

<!-- ============================ PLAQUE ============================ -->
<rect x="64" y="700" width="620" height="336" rx="18" fill="#fffdfa" filter="url(#shadow)"/>
<text x="94" y="744" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#9a5c32">PLAQUE · TEXT AND PROPORTION</text>
<rect x="94" y="772" width="290" height="66" rx="4" fill="#3a2018" stroke="#b08b4a" stroke-width="2"/>
<rect x="103" y="781" width="272" height="48" rx="2" fill="none" stroke="#c9a35c" stroke-width="2"/>
<text x="239" y="821" font-family="Songti TC,Songti SC,serif" font-size="34" font-weight="700" text-anchor="middle" fill="#d9b45f" textLength="212" lengthAdjust="spacingAndGlyphs">正东门</text>
<text x="94" y="862" font-family="Arial,sans-serif" font-size="14" fill="#8a5145">BEFORE · simplified glyphs, square canvas stretched 4.34:1</text>
<rect x="94" y="884" width="290" height="66" rx="4" fill="#3a2018" stroke="#b08b4a" stroke-width="2"/>
<rect x="103" y="893" width="272" height="48" rx="2" fill="none" stroke="#c9a35c" stroke-width="2"/>
<text x="239" y="933" font-family="Songti TC,Songti SC,serif" font-size="34" font-weight="700" text-anchor="middle" fill="#d9b45f">正東門</text>
<text x="94" y="974" font-family="Arial,sans-serif" font-size="14" fill="#507259">AFTER · traditional glyphs, Songti TC Bold, 2048 × 512 at the board's own aspect</text>
<text x="94" y="1008" font-family="Arial,sans-serif" font-size="15" fill="#617078">All six Sign maps are regenerated together — a BaseColor swapped without its</text>
<text x="94" y="1030" font-family="Arial,sans-serif" font-size="15" fill="#617078">Height / Normal / Roughness / Metallic / AO partners would smear the old relief.</text>

<!-- ============================ NUMBERS ============================ -->
<rect x="708" y="700" width="668" height="336" rx="18" fill="#fffdfa" filter="url(#shadow)"/>
<text x="738" y="744" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#9a5c32">MEASURED COVERAGE PER SLOPE</text>
<text x="738" y="782" font-family="Arial,sans-serif" font-size="17" fill="#617078">Widest strip of slope left uncovered by any course:</text>
<rect x="738" y="800" width="608" height="42" rx="8" fill="#fbeee9"/>
<text x="754" y="828" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#b0413a">before · 0.420 m</text>
<text x="1000" y="828" font-family="Arial,sans-serif" font-size="16" fill="#8a5145">wider than the 0.34 m hip ridge that would hide it — FAILED</text>
<rect x="738" y="850" width="608" height="42" rx="8" fill="#eef5ef"/>
<text x="754" y="878" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#397253">after · 0.0122–0.0131 m</text>
<text x="1000" y="878" font-family="Arial,sans-serif" font-size="16" fill="#507259">the run-entry margin, and covered by the hip ridge</text>
<text x="738" y="924" font-family="Arial,sans-serif" font-size="16" fill="#617078">tiles <tspan font-weight="700" fill="#26343c">2,998 → 3,448</tspan> · per tile <tspan font-weight="700" fill="#26343c">36 v / 68 t → 44 v / 84 t</tspan> · runs trimmed at a hip <tspan font-weight="700" fill="#26343c">300</tspan></text>
<text x="738" y="952" font-family="Arial,sans-serif" font-size="16" fill="#617078">roof tiles <tspan font-weight="700" fill="#26343c">203,864 → 289,632</tspan> triangles · gate <tspan font-weight="700" fill="#26343c">251,386 → 337,154</tspan></text>
<text x="738" y="980" font-family="Arial,sans-serif" font-size="16" fill="#617078">profile · rib <tspan font-weight="700" fill="#26343c">0.066 m</tspan> over <tspan font-weight="700" fill="#26343c">46%</tspan> of the pitch, pan <tspan font-weight="700" fill="#26343c">0.020 m</tspan>, shell <tspan font-weight="700" fill="#26343c">0.030 m</tspan></text>
<text x="738" y="1008" font-family="Arial,sans-serif" font-size="16" fill="#617078">envelope <tspan font-weight="700" fill="#26343c">2870 × 1639 × 1933.12 cm</tspan> — the hip ridge is seated on the hip line,</text>
<text x="738" y="1030" font-family="Arial,sans-serif" font-size="16" fill="#617078">not lifted, so the building keeps the package's declared 1933 cm height.</text>

<text x="64" y="1084" font-family="Arial,sans-serif" font-size="14" fill="#66737a">Generator: ContentSource/GuangzhouLandmarks/Zhengdongmen/source/build_zhengdongmen.py · Checks: Scripts/ValidateZhengdongmenRoofTiling.py · Plaque: Scripts/MakeZhengdongmenPlaque.py</text>
<text x="64" y="1108" font-family="Arial,sans-serif" font-size="14" fill="#8a949a">The reference board is interpretive guidance, not a measured survey; the coverage figures above are measured, the tile drawings are schematic.</text>
