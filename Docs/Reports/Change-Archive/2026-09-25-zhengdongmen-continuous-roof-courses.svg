<text x="64" y="70" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#9a5c32">AURA PROJECT · GUANGZHOU LANDMARKS</text>
<text x="64" y="124" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#17252d">Zhengdongmen · continuous roof courses &amp; plaque</text>
<text x="64" y="159" font-family="Arial,sans-serif" font-size="19" fill="#52616a">Tile courses now run unbroken from ridge to eave on all eight slopes, and the plaque reads 正東門 in the traditional forms.</text>

