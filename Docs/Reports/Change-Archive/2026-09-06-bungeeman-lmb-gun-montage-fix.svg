<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">BungeeMan LMB gun montage fix</title>
  <desc id="desc">Before and after flow showing FireGun using an Aura montage with the wrong skeleton and ABP_Bungee without a montage slot, followed by the BungeeMan montage and DefaultSlot graph path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#172235"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#f87171"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#4ade80"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #cbd5e1; }
      .section { font: 700 20px Arial, sans-serif; fill: #f8fafc; }
      .label { font: 700 14px Arial, sans-serif; fill: #e2e8f0; }
      .body { font: 400 14px Arial, sans-serif; fill: #dbeafe; }
      .small { font: 400 12px Arial, sans-serif; fill: #cbd5e1; }
      .mono { font: 400 12px Consolas, monospace; fill: #e0f2fe; }
      .box { rx: 12; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <text x="48" y="52" class="title">BungeeMan LMB gun montage playback</text>
  <text x="48" y="80" class="subtitle">Visual change archive — missing gun-holding montage path repaired for FireGun</text>

  <rect x="40" y="112" width="540" height="305" class="box" fill="#3a1f2a" stroke="#f87171" stroke-width="2"/>
  <text x="66" y="148" class="section">Before — LMB montage could not drive BungeeMan</text>
  <rect x="66" y="174" width="190" height="78" class="box" fill="#263449"/>
  <text x="84" y="201" class="label">FireGun.xml</text>
  <text x="84" y="223" class="small">PlayMontage reference</text>
  <path d="M256 213 H316" stroke="#f87171" stroke-width="3" marker-end="url(#arrowRed)"/>
  <rect x="322" y="174" width="226" height="78" class="box" fill="#4b2630"/>
  <text x="340" y="199" class="label">Aura AM_FireGun</text>
  <text x="340" y="219" class="mono">/Game/Assets/Characters/Aura/...</text>
  <text x="340" y="239" class="small">Aura skeleton — wrong role asset</text>
  <rect x="66" y="278" width="482" height="105" class="box" fill="#263449"/>
  <text x="84" y="305" class="label">ABP_Bungee AnimGraph</text>
  <text x="84" y="331" class="mono">StateMachine ───────────────&gt; Output</text>
  <text x="84" y="358" class="small">No montage slot: PlayMontage had no evaluation path</text>

  <rect x="620" y="112" width="540" height="305" class="box" fill="#163b32" stroke="#4ade80" stroke-width="2"/>
  <text x="646" y="148" class="section">After — role-correct LMB montage path</text>
  <rect x="646" y="174" width="190" height="78" class="box" fill="#21485a"/>
  <text x="664" y="201" class="label">FireGun.xml</text>
  <text x="664" y="223" class="small">PlayMontage reference</text>
  <path d="M836 213 H896" stroke="#4ade80" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <rect x="902" y="174" width="226" height="78" class="box" fill="#1f5844"/>
  <text x="920" y="199" class="label">BungeeMan FireGun</text>
  <text x="920" y="219" class="mono">/Game/BungeeMan/Animations/...</text>
  <text x="920" y="239" class="small">Bungee skeleton; source Fire_Rifle_Hip</text>
  <rect x="646" y="278" width="482" height="105" class="box" fill="#21485a"/>
  <text x="664" y="305" class="label">ABP_Bungee AnimGraph</text>
  <text x="664" y="331" class="mono">StateMachine ─&gt; DefaultSlot ─&gt; Output</text>
  <text x="664" y="358" class="small">Montage slot now evaluates FireGun on the BungeeMan pose</text>

  <rect x="40" y="455" width="1120" height="285" class="box" fill="#202d42" stroke="#64748b" stroke-width="1.5"/>
  <text x="66" y="492" class="section">Validation evidence</text>
  <rect x="66" y="518" width="248" height="82" class="box" fill="#14532d"/>
  <text x="84" y="548" class="label">Commandlet PASS</text>
  <text x="84" y="572" class="small">StateMachine → Slot → Output</text>
  <rect x="332" y="518" width="248" height="82" class="box" fill="#14532d"/>
  <text x="350" y="548" class="label">Automation PASS</text>
  <text x="350" y="572" class="small">BungeeMan LMB presentation test</text>
  <rect x="598" y="518" width="248" height="82" class="box" fill="#14532d"/>
  <text x="616" y="548" class="label">AuraEditor build PASS</text>
  <text x="616" y="572" class="small">Commandlet and regression compiled</text>
  <rect x="864" y="518" width="248" height="82" class="box" fill="#365314"/>
  <text x="882" y="548" class="label">Editor preview captured</text>
  <text x="882" y="572" class="small">Body + attached rifle visible</text>
  <text x="66" y="648" class="body">Scope: LMB montage asset, FireGun definition, and BungeeMan AnimGraph slot.</text>
  <text x="66" y="674" class="body">The preview validates the authored presentation setup; a full live gameplay frame-by-frame capture was not available.</text>
  <text x="66" y="706" class="small">Saved asset: AM_BungeeMan_FireGun.uasset · Slot name: DefaultSlot · Skeleton: SK_BungeeMan</text>
</svg>
