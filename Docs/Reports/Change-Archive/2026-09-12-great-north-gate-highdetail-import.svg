<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">GreatNorthGate HighDetail import, actor wrap and placement</title>
  <desc id="desc">Diagram of importing the 156 MB Z-up GreatNorthGate GLB through Interchange with the bake_meshes orientation guard, collapsing nine roof-tile instances into one merged mesh, and wrapping the six resulting Nanite meshes under one grounded level actor in the landmark row.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101b2d"/>
      <stop offset="1" stop-color="#182338"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#07101c" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#68d5ff"/>
    </marker>
    <style>
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #f1f6ff; }
      .subtitle { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #a9bad1; }
      .panel { fill: #20304a; stroke: #405979; stroke-width: 2; }
      .panel-title { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #f1f6ff; }
      .body { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #d5e1ef; }
      .small { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #b5c7dc; }
      .mono { font: 400 13px Consolas, monospace; fill: #d5e1ef; }
      .good { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #7ce3a3; }
      .warn { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #ffd17c; }
      .guard { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #ffd17c; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <text x="56" y="56" class="title">GreatNorthGate HighDetail — import, wrap, place</text>
  <text x="56" y="86" class="subtitle">156 MB Z-up GLB becomes six Nanite meshes under one grounded level actor</text>

  <!-- Source -->
  <rect x="56" y="122" width="308" height="452" rx="16" class="panel" filter="url(#shadow)"/>
  <text x="82" y="162" class="panel-title">1 · Source GLB</text>
  <text x="82" y="190" class="body">GreatNorthGate_UE5_HighDetail</text>
  <rect x="80" y="210" width="260" height="196" rx="10" fill="#142235" stroke="#49627f"/>
  <g class="mono">
    <text x="98" y="240">6 meshes · 5 PBR materials</text>
    <text x="98" y="266">15 embedded PNG textures</text>
    <text x="98" y="292">6,040,704 triangles</text>
    <text x="98" y="318">size 24.6 × 8.0 × 18.1 m</text>
    <text x="98" y="352" fill="#ffd17c">roof tile 6,000,000 tris</text>
    <text x="98" y="376" fill="#ffd17c">placed by 9 nodes</text>
    <text x="98" y="398" fill="#ffd17c">→ 54M rendered tris</text>
  </g>
  <text x="82" y="440" class="warn">Authored Z-up, not Y-up</text>
  <text x="82" y="466" class="small">Stone base spans Z 0–9.7 m and the</text>
  <text x="82" y="486" class="small">roof trim Z 13.2–17.9 m, so Z is up.</text>
  <text x="82" y="512" class="small">Interchange assumes Y-up instead.</text>
  <text x="82" y="548" class="mono">root node "world": identity</text>

  <line x1="372" y1="348" x2="418" y2="348" stroke="#68d5ff" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="395" y="322" text-anchor="middle" class="small">import</text>

  <!-- Import -->
  <rect x="426" y="122" width="348" height="452" rx="16" class="panel" filter="url(#shadow)"/>
  <text x="452" y="162" class="panel-title">2 · Interchange import</text>
  <g class="mono">
    <text x="452" y="192">combine_static_meshes = False</text>
    <text x="452" y="216">build_nanite = True</text>
    <text x="452" y="240" fill="#ffd17c">bake_meshes = True</text>
    <text x="452" y="264">import_offset_rotation = roll −90°</text>
    <text x="452" y="288">collision = False</text>
  </g>
  <rect x="450" y="308" width="300" height="118" rx="10" fill="#2d3a26" stroke="#8a7a3a"/>
  <text x="466" y="334" class="guard">GUARD — orientation</text>
  <text x="466" y="358" class="small">With bake_meshes = False the offset</text>
  <text x="466" y="378" class="small">rotation is silently ignored and the</text>
  <text x="466" y="398" class="small">gate imports lying on its side. The</text>
  <text x="466" y="416" class="small">script asserts height &gt; depth.</text>
  <rect x="450" y="440" width="300" height="106" rx="10" fill="#2d3a26" stroke="#8a7a3a"/>
  <text x="466" y="466" class="guard">GUARD — roof merge</text>
  <text x="466" y="490" class="small">Interchange collapses the 9 roof</text>
  <text x="466" y="510" class="small">nodes into one mesh, bounds</text>
  <text x="466" y="530" class="small">1943.4 × 1006.3 × 716.0 cm = the</text>
  <text x="466" y="548" class="small">union of all 9 transforms.</text>

  <line x1="790" y1="348" x2="836" y2="348" stroke="#68d5ff" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="813" y="322" text-anchor="middle" class="small">wrap</text>

  <!-- Result -->
  <rect x="844" y="122" width="300" height="452" rx="16" class="panel" filter="url(#shadow)"/>
  <text x="870" y="162" class="panel-title">3 · Level actor</text>
  <rect x="868" y="184" width="252" height="268" rx="10" fill="#142235" stroke="#49627f"/>
  <text x="884" y="212" class="mono">▾ GuangzhouLandmark_</text>
  <text x="884" y="230" class="mono">   GreatNorthGate_HighDetail</text>
  <rect x="884" y="244" width="220" height="34" rx="7" fill="#2d5368" stroke="#6bc9df"/>
  <text x="898" y="266" class="mono">root · roll/pitch/yaw 0° · grounded</text>
  <g class="mono" font-size="12">
    <text x="900" y="302">└─ Stone_Node (33.1K tris)</text>
    <text x="900" y="324">└─ Plaster_Node</text>
    <text x="900" y="346">└─ Woodwork_Node (7.4K)</text>
    <text x="900" y="368">└─ Sign_Node</text>
    <text x="900" y="390">└─ RoofTrim_Node</text>
    <text x="900" y="412">└─ Roof_Upper_Front</text>
    <text x="900" y="430" fill="#7ce3a3">   (9 sections merged)</text>
  </g>
  <text x="870" y="482" class="good">6 parts · all at identity</text>
  <text x="870" y="508" class="mono">2460 × 1006 × 1812 cm</text>
  <text x="870" y="532" class="mono">(-140400, 110442.5, 120)</text>
  <text x="870" y="556" class="small">248 MB roof asset · 5 materials</text>

  <!-- Footer -->
  <rect x="56" y="600" width="1088" height="172" rx="14" fill="#14273a" stroke="#365a70"/>
  <text x="80" y="632" class="panel-title">Verification</text>
  <text x="80" y="662" class="good">Passed:</text>
  <text x="152" y="662" class="body">6 parts parented · root yaw 0° · grounded at z = 99.999 · size 2460 × 1006.3 × 1812 cm · every mesh has materials</text>
  <text x="80" y="690" class="good">Untouched:</text>
  <text x="178" y="690" class="body">GreatNorthGate, GreatSouthGate, Xiaobeimen and ZhenhaiTower re-measured in place; footprint overlap asserted clear by 3767 cm</text>
  <text x="80" y="718" class="body">Scripts</text>
  <text x="150" y="718" class="mono">Import / PlaceAndWrap / Validate / CaptureGreatNorthGateHighDetail*.py</text>
  <text x="80" y="746" class="body">Captures</text>
  <text x="152" y="746" class="mono">Saved/RawModelImport/great_north_gate_highdetail_visual_after.png · _row_overview.png</text>
</svg>
