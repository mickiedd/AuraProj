<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820">
  <defs>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#e8eef8}
      .title{font-size:30px;font-weight:700}.subtitle{font-size:17px;fill:#aabbd4}
      .head{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#b8c7dc}
      .box{fill:#16263d;stroke:#4a6385;stroke-width:2}.good{fill:#123c3d;stroke:#56d4bf;stroke-width:2}
      .warn{fill:#3b2e1d;stroke:#f0b45d;stroke-width:2}.arrow{stroke:#a6b9d3;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a6b9d3"/></marker>
  </defs>
  <rect width="1280" height="820" fill="#0b1628"/>
  <text x="42" y="52" class="title">Validation Changes: Login to Dedicated Server</text>
  <text x="42" y="82" class="subtitle">2026-09-07 · verified findings, applied fixes, and rendered client evidence</text>

  <text x="42" y="126" class="head" fill="#f0b45d">Review findings confirmed</text>
  <rect x="42" y="145" width="570" height="128" rx="12" class="warn"/>
  <text x="64" y="178" class="body">Manifest publication had no crash or torn-write proof.</text>
  <text x="64" y="205" class="body">A/B inactive-slot publication already preserved the active slot;</text>
  <text x="64" y="232" class="body">the missing evidence was a fault-injected recovery test.</text>
  <rect x="646" y="145" width="592" height="128" rx="12" class="warn"/>
  <text x="668" y="178" class="body">GSM transport failure had no end-to-end fallback run.</text>
  <text x="668" y="205" class="body">Manager responses and transport failures needed separate</text>
  <text x="668" y="232" class="body">classification so a malformed response cannot redirect a client.</text>

  <text x="42" y="320" class="head" fill="#56d4bf">Applied behavior</text>
  <rect x="42" y="340" width="360" height="132" rx="12" class="good"/>
  <text x="64" y="374" class="body">WriteManifest</text>
  <text x="64" y="401" class="body">publishes to inactive A/B slot</text>
  <text x="64" y="428" class="small">active valid manifest remains available</text>
  <text x="64" y="451" class="small">during an interrupted write</text>
  <path d="M402 406H448" class="arrow"/>
  <rect x="458" y="340" width="360" height="132" rx="12" class="good"/>
  <text x="480" y="374" class="body">Fault-injection automation</text>
  <text x="480" y="401" class="body">truncates inactive manifest bytes</text>
  <text x="480" y="428" class="small">restart selects surviving checkpoint</text>
  <text x="480" y="451" class="small">and checksum</text>
  <path d="M818 406H864" class="arrow"/>
  <rect x="874" y="340" width="364" height="132" rx="12" class="good"/>
  <text x="896" y="374" class="body">Response classification</text>
  <text x="896" y="401" class="body">complete line = manager answered</text>
  <text x="896" y="428" class="small">malformed JSON stays on Login;</text>
  <text x="896" y="451" class="small">fallback remains transport-only</text>

  <text x="42" y="520" class="head" fill="#56d4bf">Observed client flow</text>
  <rect x="42" y="542" width="240" height="110" rx="12" class="box"/>
  <text x="64" y="577" class="body">Login UI</text>
  <text x="64" y="604" class="small">role + server selectors</text>
  <text x="64" y="628" class="small">native bridge connected</text>
  <path d="M282 597H332" class="arrow"/>
  <rect x="342" y="542" width="240" height="110" rx="12" class="box"/>
  <text x="364" y="577" class="body">Loading UI</text>
  <text x="364" y="604" class="small">resolving game server</text>
  <text x="364" y="628" class="small">30% progress rendered</text>
  <path d="M582 597H632" class="arrow"/>
  <rect x="642" y="542" width="240" height="110" rx="12" class="good"/>
  <text x="664" y="577" class="body">Server welcome</text>
  <text x="664" y="604" class="small">GSM success: 127.0.0.1:7790</text>
  <text x="664" y="628" class="small">fallback success: 127.0.0.1:17891</text>
  <path d="M882 597H932" class="arrow"/>
  <rect x="942" y="542" width="296" height="110" rx="12" class="good"/>
  <text x="964" y="577" class="body">Gameplay possession</text>
  <text x="964" y="604" class="small">Aura pawn visible in StartupMap</text>
  <text x="964" y="628" class="small">no connection loop</text>

  <text x="42" y="705" class="head">Validation record</text>
  <text x="42" y="735" class="body">Build: DebugGame passed · Automation: 2 focused tests passed · GSM + fallback probes passed</text>
  <text x="42" y="764" class="body">Rendered captures: Login, Loading, and Gameplay · production campaign saves left untouched</text>
</svg>
