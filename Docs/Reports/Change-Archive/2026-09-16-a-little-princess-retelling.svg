<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">A Little Princess easy-English retelling flow</title>
  <desc id="desc">A visual summary showing the supplied nineteen-chapter abstract becoming a complete simple-English manuscript, with the story arc and validation results.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#edf3f9"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#64748b" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .card-title { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .small { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .white-title { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: white; }
      .white-body { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #e0e7ff; }
      .metric { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .metric-label { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #64748b; }
      .arc-title { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .arc-body { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="url(#paper)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#2563eb"/>
  <text x="56" y="58" class="title">A Little Princess · easy-English retelling</text>
  <text x="56" y="86" class="subtitle">Change archive · 2026-09-16 · abstract-to-manuscript transformation</text>

  <rect x="56" y="122" width="310" height="220" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="56" y="122" width="310" height="52" rx="16" fill="#e2e8f0"/>
  <rect x="56" y="158" width="310" height="16" fill="#e2e8f0"/>
  <text x="80" y="155" class="card-title">Before · supplied abstract</text>
  <text x="80" y="204" class="body">19 chapter summaries</text>
  <text x="80" y="232" class="body">Plot beats and main ideas</text>
  <text x="80" y="260" class="body">Sara’s emotional journey</text>
  <text x="80" y="288" class="body">No scene-level prose or dialogue</text>
  <text x="80" y="318" class="small">Input: pasted-text.txt</text>

  <line x1="386" y1="232" x2="474" y2="232" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="394" y="178" width="82" height="34" rx="17" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="435" y="201" text-anchor="middle" class="small" fill="#1d4ed8">RETELL</text>

  <rect x="494" y="122" width="310" height="220" rx="16" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="520" y="155" class="white-title">Guardrails applied</text>
  <text x="520" y="204" class="white-body">A1–A2 words and clear sentences</text>
  <text x="520" y="232" class="white-body">Original prose based only on input</text>
  <text x="520" y="260" class="white-body">Dialogue, action, humor, and choices</text>
  <text x="520" y="288" class="white-body">Kindness remains the emotional center</text>
  <text x="520" y="318" class="white-body">Complete scene flow, not a synopsis</text>

  <line x1="824" y1="232" x2="912" y2="232" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="932" y="122" width="212" height="220" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2" filter="url(#shadow)"/>
  <rect x="932" y="122" width="212" height="52" rx="16" fill="#ede9fe"/>
  <rect x="932" y="158" width="212" height="16" fill="#ede9fe"/>
  <text x="954" y="155" class="card-title">After · manuscript</text>
  <text x="954" y="204" class="body">19 complete chapters</text>
  <text x="954" y="232" class="body">6,205 words</text>
  <text x="954" y="260" class="body">1,085 distinct words</text>
  <text x="954" y="288" class="body">Markdown source</text>
  <text x="954" y="318" class="small">Docs/Books/</text>

  <text x="56" y="388" class="card-title">Story flow preserved and expanded</text>
  <line x1="88" y1="482" x2="1110" y2="482" stroke="#cbd5e1" stroke-width="4"/>

  <g transform="translate(56,416)">
    <circle cx="56" cy="66" r="26" fill="#2563eb"/>
    <text x="56" y="73" text-anchor="middle" font-size="20" fill="white">1</text>
    <text x="56" y="116" text-anchor="middle" class="arc-title">Arrival</text>
    <text x="56" y="137" text-anchor="middle" class="arc-body">Sara enters school</text>
  </g>
  <g transform="translate(222,416)">
    <circle cx="56" cy="66" r="26" fill="#3b82f6"/>
    <text x="56" y="73" text-anchor="middle" font-size="20" fill="white">2</text>
    <text x="56" y="116" text-anchor="middle" class="arc-title">Friendship</text>
    <text x="56" y="137" text-anchor="middle" class="arc-body">Ermengarde, Lottie, Becky</text>
  </g>
  <g transform="translate(388,416)">
    <circle cx="56" cy="66" r="26" fill="#6366f1"/>
    <text x="56" y="73" text-anchor="middle" font-size="20" fill="white">3</text>
    <text x="56" y="116" text-anchor="middle" class="arc-title">Loss</text>
    <text x="56" y="137" text-anchor="middle" class="arc-body">Father and fortune vanish</text>
  </g>
  <g transform="translate(554,416)">
    <circle cx="56" cy="66" r="26" fill="#7c3aed"/>
    <text x="56" y="73" text-anchor="middle" font-size="20" fill="white">4</text>
    <text x="56" y="116" text-anchor="middle" class="arc-title">Endurance</text>
    <text x="56" y="137" text-anchor="middle" class="arc-body">Attic, imagination, Magic</text>
  </g>
  <g transform="translate(720,416)">
    <circle cx="56" cy="66" r="26" fill="#8b5cf6"/>
    <text x="56" y="73" text-anchor="middle" font-size="20" fill="white">5</text>
    <text x="56" y="116" text-anchor="middle" class="arc-title">Discovery</text>
    <text x="56" y="137" text-anchor="middle" class="arc-body">Carrisford finds Sara</text>
  </g>
  <g transform="translate(886,416)">
    <circle cx="56" cy="66" r="26" fill="#a855f7"/>
    <text x="56" y="73" text-anchor="middle" font-size="20" fill="white">6</text>
    <text x="56" y="116" text-anchor="middle" class="arc-title">Giving</text>
    <text x="56" y="137" text-anchor="middle" class="arc-body">Sara helps Anne and others</text>
  </g>

  <rect x="56" y="592" width="1088" height="112" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="80" y="624" class="card-title">Validation evidence</text>
  <g transform="translate(80,644)">
    <text x="0" y="24" class="metric">19/19</text>
    <text x="0" y="46" class="metric-label">chapter headings</text>
    <text x="180" y="24" class="metric">290–361</text>
    <text x="180" y="46" class="metric-label">words per chapter</text>
    <text x="390" y="24" class="metric">196/196</text>
    <text x="390" y="46" class="metric-label">balanced quotes</text>
    <text x="600" y="24" class="metric">0</text>
    <text x="600" y="46" class="metric-label">duplicate paragraph groups</text>
    <text x="850" y="24" class="metric">PASS</text>
    <text x="850" y="46" class="metric-label">git diff --check</text>
  </g>
</svg>
