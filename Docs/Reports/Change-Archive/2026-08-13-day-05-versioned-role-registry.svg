<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980" role="img" aria-labelledby="title desc">
  <title id="title">Day 05 versioned role registry change</title>
  <desc id="desc">Before and after technical flow showing unsafe flat role JSON replaced by aggregate validation, atomic publication, stable login role IDs, and verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#edf8f3"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#20364a" flood-opacity="0.16"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#39779d"/></marker>
    <style>.title{font:700 31px Segoe UI,Arial,sans-serif;fill:#18364d}.subtitle{font:400 16px Segoe UI,Arial,sans-serif;fill:#587083}.head{font:700 20px Segoe UI,Arial,sans-serif;fill:#fff}.cardtitle{font:700 18px Segoe UI,Arial,sans-serif;fill:#18364d}.body{font:400 15px Segoe UI,Arial,sans-serif;fill:#365469}.small{font:400 13px Segoe UI,Arial,sans-serif;fill:#60788a}.badge{font:700 12px Segoe UI,Arial,sans-serif;fill:#fff;letter-spacing:1px}.flow{stroke:#39779d;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1700" height="980" fill="url(#bg)"/>
  <text x="65" y="58" class="title">Day 05 - role definitions become an atomic server boundary</text><text x="65" y="88" class="subtitle">Before: permissive flat JSON and global ownership assumptions | After: versioned candidate, aggregate validation, stable per-connection role</text>
  <rect x="65" y="130" width="440" height="690" rx="22" fill="#fff8ed" stroke="#d7a450" stroke-width="2" filter="url(#shadow)"/><rect x="65" y="130" width="440" height="54" rx="22" fill="#a97424"/><text x="92" y="164" class="head">BEFORE</text>
  <text x="92" y="228" class="cardtitle">Flat, partially described roles</text><text x="92" y="260" class="body">No schema version or complete identity fields</text><text x="92" y="286" class="body">Unsafe getters and skip-on-error behavior</text><text x="92" y="312" class="body">Duplicate role IDs silently overwrote map entries</text><rect x="92" y="350" width="386" height="1" fill="#dcc59b"/>
  <text x="92" y="394" class="cardtitle">Reload and login risks</text><text x="92" y="426" class="body">Bad reload could clear authoritative RoleInfo</text><text x="92" y="452" class="body">Role source mixed with process-global save slot</text><text x="92" y="478" class="body">No validated ambient Civilian contract</text><rect x="92" y="516" width="386" height="1" fill="#dcc59b"/>
  <text x="92" y="560" class="cardtitle">Failure consequence</text><text x="92" y="592" class="body">Partial or missing role reaches later runtime work</text><text x="92" y="618" class="body">Server accepts no explicit stable role request</text><text x="92" y="644" class="body">UI can preserve an invalid saved role silently</text><rect x="92" y="700" width="275" height="38" rx="19" fill="#b98330"/><text x="116" y="724" class="badge">AMBIGUOUS / NON-ATOMIC</text>
  <path d="M525 475 L635 475" class="flow"/>
  <rect x="650" y="292" width="400" height="365" rx="24" fill="#285f84" filter="url(#shadow)"/><text x="690" y="340" class="head">SAFE CANDIDATE PIPELINE</text>
  <rect x="690" y="375" width="320" height="56" rx="14" fill="#39779d"/><text x="720" y="408" class="head">1. Detect / migrate version</text><path d="M850 431 L850 459" class="flow"/><rect x="690" y="463" width="320" height="56" rx="14" fill="#39779d"/><text x="720" y="496" class="head">2. Aggregate every issue</text><path d="M850 519 L850 547" class="flow"/><rect x="690" y="551" width="320" height="56" rx="14" fill="#39805b"/><text x="720" y="584" class="head">3. Publish all or retain good</text><text x="690" y="632" class="small" fill="#dcebf3">InitGame runs before PreLogin.</text>
  <path d="M1065 475 L1175 475" class="flow"/>
  <rect x="1190" y="130" width="445" height="690" rx="22" fill="#eff9f4" stroke="#67a986" stroke-width="2" filter="url(#shadow)"/><rect x="1190" y="130" width="445" height="54" rx="22" fill="#39805b"/><text x="1217" y="164" class="head">AFTER</text>
  <text x="1217" y="228" class="cardtitle">Complete version-2 catalog</text><text x="1217" y="260" class="body">Aura, BungeeMan, and ambient Civilian</text><text x="1217" y="286" class="body">Full tags, flags, assets, grants, equipment</text><text x="1217" y="312" class="body">Legacy v1 normalized deterministically</text><rect x="1217" y="350" width="391" height="1" fill="#a8cfba"/>
  <text x="1217" y="394" class="cardtitle">One stable login request</text><text x="1217" y="426" class="body">Travel sends Role=&lt;StableRoleId&gt; only</text><text x="1217" y="452" class="body">PreLogin rejects invalid/non-player roles</text><text x="1217" y="478" class="body">PlayerState retains connection-scoped acceptance</text><rect x="1217" y="516" width="391" height="1" fill="#a8cfba"/>
  <text x="1217" y="560" class="cardtitle">Verified safety</text><text x="1217" y="592" class="body">13/13 focused automation tests</text><text x="1217" y="618" class="body">Day 05 Listen + Dedicated smoke</text><text x="1217" y="644" class="body">Day 04 Listen + Dedicated regression</text><text x="1217" y="670" class="body">Config and sentinel restored in finally</text><rect x="1217" y="700" width="275" height="38" rx="19" fill="#39805b"/><text x="1241" y="724" class="badge">VALIDATED / ATOMIC</text>
  <rect x="65" y="860" width="1570" height="78" rx="18" fill="#18364d"/><text x="96" y="893" class="head">Guardrail:</text><text x="210" y="893" class="head">invalid data never becomes partial authority; invalid clients never choose role internals.</text><text x="96" y="920" class="small" fill="#dcebf3">Day 06 receives a trustworthy registry plus one accepted pending role per connection, and remains the sole milestone that applies it to actors.</text>
</svg>
