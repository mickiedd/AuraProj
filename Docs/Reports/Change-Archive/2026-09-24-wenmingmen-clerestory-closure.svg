<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760" role="img" aria-labelledby="title desc">
  <title id="title">Wenmingmen clerestory closure</title>
  <desc id="desc">The screenshot exposed a large hollow clerestory between the upper roof and lower canopy. The fix adds a continuous four-sided timber wall band with rails and studs, leaving only the lower balcony intentionally open. Blender side-angle renders and native Unreal validation passed.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #233246; }
      .title { font-size: 30px; font-weight: 700; }
      .sub { font-size: 16px; fill: #5c6c80; }
      .head { font-size: 21px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; fill: #526277; }
      .card { fill: #fff; stroke: #cbd5df; stroke-width: 2; }
      .roof { fill: #505c63; stroke: #303b41; stroke-width: 2; }
      .beam { fill: #4a2f22; stroke: #2e211a; stroke-width: 2; }
      .hole { fill: #20242a; stroke: #6d7a82; stroke-width: 2; }
      .wall { fill: #6c4631; stroke: #2f2019; stroke-width: 2; }
      .stud { stroke: #b18059; stroke-width: 3; }
      .arrow { fill: none; stroke: #62738a; stroke-width: 3; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#62738a" stroke-width="2"/></marker>
  </defs>
  <rect width="1300" height="760" fill="#f4f7fb"/>
  <text x="48" y="54" class="title">Wenmingmen: close the floating roof void</text>
  <text x="48" y="82" class="sub">24 Sep 2026 · screenshot-driven clerestory repair · upper pavilion made structurally continuous</text>

  <rect x="48" y="116" width="560" height="344" rx="18" class="card"/>
  <rect x="48" y="116" width="560" height="12" rx="6" fill="#bb8469"/>
  <text x="72" y="158" class="head">Before · roof tiers float</text>
  <text x="72" y="182" class="small">The screenshot showed an unbuilt band between the roofs.</text>
  <path d="M136 242 Q320 204 520 242 L500 273 Q320 242 156 273 Z" class="roof"/>
  <path d="M158 330 Q320 302 500 330 L480 356 Q320 336 178 356 Z" class="roof"/>
  <path d="M180 274 L480 274 L480 330 L180 330 Z" class="hole"/>
  <path d="M220 274 V330 M320 274 V330 M420 274 V330" stroke="#76503a" stroke-width="8"/>
  <text x="72" y="402" class="body">Open voids read as missing upper walls and expose the background behind isolated beams.</text>

  <path d="M630 282 H681" class="arrow"/>

  <rect x="692" y="116" width="560" height="344" rx="18" class="card"/>
  <rect x="692" y="116" width="560" height="12" rx="6" fill="#4f9b78"/>
  <text x="716" y="158" class="head">After · continuous upper room</text>
  <text x="716" y="182" class="small">A four-sided timber clerestory carries the main roof.</text>
  <path d="M780 242 Q960 204 1160 242 L1140 273 Q960 242 800 273 Z" class="roof"/>
  <rect x="802" y="266" width="336" height="67" class="wall"/>
  <path d="M802 266 H1138 M802 333 H1138" stroke="#2e211a" stroke-width="8"/>
  <path d="M842 266 V333 M902 266 V333 M962 266 V333 M1022 266 V333 M1082 266 V333" class="stud"/>
  <path d="M822 350 Q960 330 1118 350 L1100 375 Q960 358 840 375 Z" class="roof"/>
  <rect x="814" y="375" width="324" height="28" class="beam"/>
  <text x="716" y="426" class="body">Only the lower balcony remains open; the hollow clerestory is closed by framed timber walling.</text>

  <text x="48" y="512" class="head">Screenshot → source → Unreal</text>
  <rect x="48" y="540" width="280" height="104" rx="14" class="card"/>
  <text x="68" y="574" class="label">User screenshot</text>
  <text x="68" y="600" class="body">Large roof-support void identified</text>
  <text x="68" y="622" class="body">between the two roof tiers</text>
  <path d="M334 592 H360" class="arrow"/>
  <rect x="370" y="540" width="280" height="104" rx="14" class="card"/>
  <text x="390" y="574" class="label">Procedural source</text>
  <text x="390" y="600" class="body">Four-sided clerestory wall</text>
  <text x="390" y="622" class="body">380,586 base triangles</text>
  <path d="M656 592 H682" class="arrow"/>
  <rect x="692" y="540" width="280" height="104" rx="14" class="card"/>
  <text x="712" y="574" class="label">High-detail GLB</text>
  <text x="712" y="600" class="body">2,140,582 triangles</text>
  <text x="712" y="622" class="body">roof tiers visually carried</text>
  <path d="M978 592 H1004" class="arrow"/>
  <rect x="1014" y="540" width="238" height="104" rx="14" class="card"/>
  <text x="1034" y="574" class="label">Native BP</text>
  <text x="1034" y="600" class="body">UE 5.5 update passed</text>
  <text x="1034" y="622" class="body">8 components reloaded</text>

  <rect x="48" y="680" width="1204" height="44" rx="12" fill="#e9f2ee" stroke="#b8d5c5" stroke-width="2"/>
  <text x="68" y="708" class="label">Validated: side-angle Blender render · Update commandlet exit 0 · Fresh Blueprint validation exit 0</text>
</svg>
