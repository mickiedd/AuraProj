<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Scifi Desert civilian population: stale empty snapshot reconciliation</title>
  <desc id="desc">Before and after flow showing how persisted Empty population slots incorrectly suppressed initial civilians and how the fix respawns those missing startup members while preserving intentional dormant states.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #cbd5e1; }
      .laneTitle { font: 700 21px Arial, sans-serif; fill: #f8fafc; }
      .boxTitle { font: 700 16px Arial, sans-serif; fill: #f8fafc; }
      .boxText { font: 400 15px Arial, sans-serif; fill: #e2e8f0; }
      .small { font: 400 13px Arial, sans-serif; fill: #cbd5e1; }
      .metric { font: 700 20px Arial, sans-serif; fill: #f8fafc; }
      .label { font: 700 14px Arial, sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1400" height="820" fill="url(#bg)"/>
  <text x="70" y="58" class="title">Scifi Desert villages: stale empty persistence snapshot</text>
  <text x="70" y="88" class="subtitle">The server had the civilian definitions and 32 volumes; persistence finalization erased the startup population by treating default Empty slots as restored state.</text>

  <rect x="55" y="120" width="625" height="535" rx="18" fill="#3f1725" stroke="#fb7185" stroke-width="2" filter="url(#shadow)"/>
  <rect x="720" y="120" width="625" height="535" rx="18" fill="#123524" stroke="#4ade80" stroke-width="2" filter="url(#shadow)"/>
  <text x="82" y="160" class="laneTitle">Before — stale snapshot suppresses everyone</text>
  <text x="747" y="160" class="laneTitle">After — Empty means missing startup member</text>

  <rect x="85" y="185" width="565" height="75" rx="12" fill="#7f1d1d"/>
  <text x="110" y="212" class="boxTitle">1. Persistence restore</text>
  <text x="110" y="238" class="boxText">32 DesertVillageCivilians slots load with state=Empty</text>
  <line x1="367" y1="260" x2="367" y2="290" stroke="#fb7185" stroke-width="3" marker-end="url(#arrowRed)"/>

  <rect x="85" y="300" width="565" height="82" rx="12" fill="#991b1b"/>
  <text x="110" y="328" class="boxTitle">2. Old reconciliation gate</text>
  <text x="110" y="353" class="boxText">Any saved slot set bHasRestoredSlot=true</text>
  <text x="110" y="373" class="small">Empty slots were no longer candidates for initial spawning.</text>
  <line x1="367" y1="382" x2="367" y2="412" stroke="#fb7185" stroke-width="3" marker-end="url(#arrowRed)"/>

  <rect x="85" y="422" width="565" height="82" rx="12" fill="#be123c"/>
  <text x="110" y="450" class="boxTitle">3. Dormant restore</text>
  <text x="110" y="475" class="boxText">RestoreDormantSlot(Empty) leaves every slot empty</text>
  <text x="110" y="495" class="small">No initial spawn loop runs because a restore was “found”.</text>
  <line x1="367" y1="504" x2="367" y2="534" stroke="#fb7185" stroke-width="3" marker-end="url(#arrowRed)"/>

  <rect x="85" y="544" width="565" height="95" rx="12" fill="#881337" stroke="#fda4af" stroke-width="1"/>
  <text x="110" y="574" class="boxTitle">Observed server result</text>
  <text x="110" y="602" class="metric">liveMembers=0, success=1</text>
  <text x="110" y="625" class="small">WorldReadiness became Ready while the villages were empty.</text>

  <rect x="750" y="185" width="565" height="75" rx="12" fill="#166534"/>
  <text x="775" y="212" class="boxTitle">1. Persistence restore</text>
  <text x="775" y="238" class="boxText">32 slots load with state=Empty</text>
  <line x1="1032" y1="260" x2="1032" y2="290" stroke="#4ade80" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <rect x="750" y="300" width="565" height="82" rx="12" fill="#15803d"/>
  <text x="775" y="328" class="boxTitle">2. Fixed reconciliation gate</text>
  <text x="775" y="353" class="boxText">Empty saved slots join MissingSlotIndices</text>
  <text x="775" y="373" class="small">They are counted and logged as missing initial members.</text>
  <line x1="1032" y1="382" x2="1032" y2="412" stroke="#4ade80" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <rect x="750" y="422" width="565" height="82" rx="12" fill="#16a34a"/>
  <text x="775" y="450" class="boxTitle">3. Initial population fill</text>
  <text x="775" y="475" class="boxText">SpawnInitialMember runs until initialCount=32</text>
  <text x="775" y="495" class="small">Deterministic slots map back to the 32 village volumes.</text>
  <line x1="1032" y1="504" x2="1032" y2="534" stroke="#4ade80" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <rect x="750" y="544" width="565" height="95" rx="12" fill="#166534" stroke="#86efac" stroke-width="1"/>
  <text x="775" y="574" class="boxTitle">Expected fixed result</text>
  <text x="775" y="602" class="metric">liveMembers=32, success=1</text>
  <text x="775" y="625" class="small">Intentional Suppressed/Corpse/RefillPending states remain authoritative.</text>

  <rect x="55" y="690" width="1290" height="85" rx="14" fill="#0b1220" stroke="#64748b" stroke-width="1"/>
  <text x="80" y="721" class="boxTitle">Validation trail</text>
  <text x="80" y="748" class="boxText">Static desert population gate: PASS   •   AuraEditor build: PASS   •   Aura.RoleBattle.Day: 213/213 success   •   dedicated server rebuild: required before deployment</text>
  <text x="80" y="768" class="small">Evidence: failing backup log reported liveMembers=0; later healthy server log reported liveMembers=32.</text>
</svg>
