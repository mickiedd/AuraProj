<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Canton M05 independent audit</title>
  <desc id="desc">A read-only reviewer pass re-derives the M05 handoff numbers instead of trusting them. The package is internally consistent, but the gate route is shown to be a footprint conflict — the navigation path rounds the 65 m gate's own outer wall — and the freeze, evidence and threshold layers each have a defect.</desc>
  <rect width="1200" height="800" fill="#f5f7f8"/>
  <text x="52" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#142b39">Canton M05 · independent audit</text>
  <text x="52" y="92" font-family="Arial,sans-serif" font-size="17" fill="#51636d">2026-09-28 · read-only reviewer pass over the provisional district hand-off · no Unreal process opened</text>

  <rect x="52" y="118" width="340" height="170" rx="14" fill="#ffffff" stroke="#cbd6dc" stroke-width="2"/>
  <text x="76" y="152" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#28414c">Package states</text>
  <text x="76" y="186" font-family="Arial,sans-serif" font-size="15" fill="#3e5560">605/605 manifest hashes match</text>
  <text x="76" y="212" font-family="Arial,sans-serif" font-size="15" fill="#3e5560">freeze base commit = live HEAD</text>
  <text x="76" y="238" font-family="Arial,sans-serif" font-size="15" fill="#3e5560">DefaultGame.ini byte-identical to HEAD</text>
  <text x="76" y="264" font-family="Arial,sans-serif" font-size="15" fill="#3e5560">cook exclusion = exactly four dirs</text>

  <path d="M400 203 H432" stroke="#16768d" stroke-width="5" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto"><path d="M0 0 L13 6.5 L0 13 Z" fill="#16768d"/></marker></defs>

  <rect x="440" y="118" width="340" height="170" rx="14" fill="#eef3f6" stroke="#b9c8d1" stroke-width="2"/>
  <text x="464" y="152" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#28414c">Audit re-derives</text>
  <text x="464" y="186" font-family="Arial,sans-serif" font-size="15" fill="#3e5560">no UE, nothing in the freeze rewritten</text>
  <text x="464" y="212" font-family="Arial,sans-serif" font-size="15" fill="#3e5560">route arithmetic recomputed</text>
  <text x="464" y="238" font-family="Arial,sans-serif" font-size="15" fill="#3e5560">R16 decode and row order checked</text>
  <text x="464" y="264" font-family="Arial,sans-serif" font-size="15" fill="#3e5560">grades, drainage, capture pair</text>

  <path d="M788 203 H820" stroke="#16768d" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="828" y="118" width="320" height="170" rx="14" fill="#eaf5f4" stroke="#8db9b1" stroke-width="2"/>
  <text x="852" y="152" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#165249">Findings</text>
  <text x="852" y="204" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#165249">0 · 8 · 4</text>
  <text x="852" y="232" font-family="Arial,sans-serif" font-size="15" fill="#264a49">blocker · major · minor</text>
  <text x="852" y="262" font-family="Arial,sans-serif" font-size="15" fill="#264a49">no headline number falsified</text>

  <rect x="52" y="312" width="1096" height="268" rx="15" fill="#ffffff" stroke="#cbd6dc" stroke-width="2"/>
  <text x="76" y="348" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#28414c">Why the gate route detours — a footprint conflict, not a collision bug</text>

  <rect x="196" y="425" width="208" height="90" rx="8" fill="#fdeceb" stroke="#d98a86" stroke-width="2"/>
  <rect x="290" y="380" width="20" height="180" rx="4" fill="#b9c4cc"/>
  <circle cx="300" cy="450" r="5" fill="#c0392b"/>
  <path d="M300 450 H405 V380 H300" fill="none" stroke="#16768d" stroke-width="3.5" marker-end="url(#arrow)"/>
  <circle cx="405" cy="450" r="5" fill="#16768d"/>
  <path d="M405 450 H560" stroke="#16768d" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="196" y="541" font-family="Arial,sans-serif" font-size="14" fill="#3e5560">plan view · road 6 m wide · gate 65 × 35 m</text>
  <text x="76" y="450" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#c0392b">start</text>
  <text x="76" y="472" font-family="Arial,sans-serif" font-size="13" fill="#3e5560">inside the</text>
  <text x="76" y="490" font-family="Arial,sans-serif" font-size="13" fill="#3e5560">gate footprint</text>
  <text x="415" y="372" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#16768d">apex 3293 cm</text>

  <text x="620" y="392" font-family="Arial,sans-serif" font-size="15" fill="#3e5560">• BP_Wenmingmen spawned at (180000, 121500) — across the corridor</text>
  <text x="620" y="420" font-family="Arial,sans-serif" font-size="15" fill="#3e5560">• footprint 65 × 35 m; placed Blueprint 6500 × 2806.9 × 2199 cm</text>
  <text x="620" y="448" font-family="Arial,sans-serif" font-size="15" fill="#3e5560">• doors modelled closed; complex collision on structural meshes</text>
  <rect x="610" y="464" width="524" height="34" rx="8" fill="#eaf5f4" stroke="#8db9b1"/>
  <text x="624" y="487" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#165249">3293 ≈ half-width 3250 + agent radius 35 = 3285 — the path rounds the gate</text>
  <text x="620" y="524" font-family="Arial,sans-serif" font-size="15" fill="#3e5560">• route start (180000,120500) is inside that footprint</text>
  <text x="620" y="556" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#9a3e1d">→ while the doors are shut the query cannot be satisfied</text>

  <rect x="52" y="596" width="1096" height="196" rx="15" fill="#183746"/>
  <text x="76" y="632" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">Also found — 12 findings in total, full table in the report</text>
  <text x="76" y="668" font-family="Arial,sans-serif" font-size="15" fill="#d8e9ec">The freeze hashes the append-only change-archive index, so any job that records itself breaks it — this audit did.</text>
  <text x="76" y="696" font-family="Arial,sans-serif" font-size="15" fill="#d8e9ec">Freeze covers the district only — the second cooked level, L_Canton_WalledCity_PROVISIONAL, is not hashed.</text>
  <text x="76" y="724" font-family="Arial,sans-serif" font-size="15" fill="#d8e9ec">Seam_Probe / PreNav_Validation / Reload_Validation are one byte-identical file, cited as three checks.</text>
  <text x="76" y="752" font-family="Arial,sans-serif" font-size="15" fill="#d8e9ec">gate_approach.png: two different renders under one view name; the handoff links the older one.</text>
  <text x="76" y="780" font-family="Arial,sans-serif" font-size="15" fill="#d8e9ec">Build_Result.json reports 96 lane pieces / 16 parcel pads; the map has 76 / 0. Nav sits 18.4–34.6 cm over the R16 against a constant 14 / 19 cm road top. Detour ≤ 1.5 and grade &lt; 8 % are enforced in code but declared in no versioned budget.</text>
</svg>
