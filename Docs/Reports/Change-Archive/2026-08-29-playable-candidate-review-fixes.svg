<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Playable Candidate review fixes</title>
  <desc id="desc">Before and after flow for Game Server Manager binding and authentication, readiness validation, and candidate evidence finalization.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#14253d" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#45627f"/>
    </marker>
    <style>
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #14253d; }
      .subtitle { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #536b84; }
      .section { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #14253d; }
      .label { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #14253d; }
      .body { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #29425c; }
      .small { font: 400 12px 'Segoe UI', Arial, sans-serif; fill: #536b84; }
      .old { fill: #fff3f0; stroke: #d56a5b; stroke-width: 2; }
      .new { fill: #effaf4; stroke: #3e9b6b; stroke-width: 2; }
      .guard { fill: #eaf2ff; stroke: #4e78ad; stroke-width: 2; }
      .evidence { fill: #fff9e8; stroke: #c79531; stroke-width: 2; }
      .line { stroke: #45627f; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #879bb0; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>
  <text x="60" y="58" class="title">Playable Candidate review fixes</text>
  <text x="60" y="88" class="subtitle">Endpoint consistency, authenticated GSM control-plane readiness, and deterministic candidate evidence binding</text>

  <rect x="45" y="120" width="630" height="485" rx="18" class="old" filter="url(#shadow)"/>
  <text x="75" y="160" class="section">Before — review risks</text>
  <text x="75" y="190" class="small">Commit 0a85dc4c… behavior and contract gaps</text>

  <rect x="75" y="220" width="250" height="78" rx="10" fill="#fff" stroke="#d56a5b"/>
  <text x="95" y="247" class="label">ServerConnection.json</text>
  <text x="95" y="271" class="body">serverAddress = 192.168.1.6</text>
  <text x="95" y="289" class="body">no separate GSM address</text>

  <rect x="395" y="220" width="245" height="78" rx="10" fill="#fff" stroke="#d56a5b"/>
  <text x="415" y="247" class="label">Default GSM bind</text>
  <text x="415" y="271" class="body">127.0.0.1</text>
  <text x="415" y="289" class="body">client/readiness target diverges</text>
  <path d="M325 259 H390" class="line"/>

  <rect x="75" y="340" width="565" height="100" rx="10" fill="#fff" stroke="#d56a5b"/>
  <text x="95" y="368" class="label">Unauthenticated control plane</text>
  <text x="95" y="393" class="body">request_server could start a dedicated server</text>
  <text x="95" y="416" class="body">server_ready accepted arbitrary host/port and level-only state</text>
  <path d="M518 298 V335" class="line"/>

  <rect x="75" y="478" width="565" height="92" rx="10" fill="#fff" stroke="#d56a5b"/>
  <text x="95" y="506" class="label">Implicit finalization inputs</text>
  <text x="95" y="531" class="body">draft + soak selected by convention/latest artifact</text>
  <text x="95" y="554" class="body">source revision and package identity not mechanically bound</text>
  <path d="M357 440 V473" class="line"/>

  <rect x="700" y="120" width="655" height="485" rx="18" class="new" filter="url(#shadow)"/>
  <text x="730" y="160" class="section">After — enforced contracts</text>
  <text x="730" y="190" class="small">Implemented in runtime/config and made explicit in Days 33, 38, 40</text>

  <rect x="730" y="220" width="260" height="92" rx="10" fill="#fff" stroke="#3e9b6b"/>
  <text x="750" y="247" class="label">Separate endpoints</text>
  <text x="750" y="271" class="body">GSM control = 127.0.0.1</text>
  <text x="750" y="290" class="body">game server address stays distinct</text>
  <text x="750" y="307" class="small">AURA_GSM_ADDRESS overrides LAN target</text>

  <rect x="1020" y="220" width="300" height="92" rx="10" class="guard"/>
  <text x="1040" y="247" class="label">Startup policy</text>
  <text x="1040" y="271" class="body">non-loopback requires request token,</text>
  <text x="1040" y="290" class="body">server token, and IP/CIDR allowlist</text>
  <text x="1040" y="307" class="small">unsafe bind exits with code 2</text>
  <path d="M990 266 H1015" class="line"/>

  <rect x="730" y="350" width="590" height="104" rx="10" class="guard"/>
  <text x="750" y="378" class="label">Authenticated, nonce-bound readiness</text>
  <text x="750" y="403" class="body">request_server: authToken; server_ready: serverAuthToken + per-launch readyNonce</text>
  <text x="750" y="427" class="body">configured level + port required; endpoint comes from manager public-host</text>
  <text x="750" y="446" class="small">caller cannot redirect clients or satisfy a stale launch</text>
  <path d="M875 312 V345" class="line"/>

  <rect x="730" y="490" width="590" height="78" rx="10" class="evidence"/>
  <text x="750" y="518" class="label">Deterministic candidate finalization</text>
  <text x="750" y="542" class="body">explicit DraftPath + SoakPath; RunId, scope/source/package hashes must match</text>
  <text x="750" y="560" class="small">no latest-artifact lookup; changed evidence is regenerated</text>
  <path d="M1025 454 V485" class="line"/>

  <rect x="45" y="650" width="1310" height="185" rx="18" fill="#fff" stroke="#879bb0" stroke-width="2" filter="url(#shadow)"/>
  <text x="75" y="688" class="section">Validation evidence</text>
  <path d="M75 715 H1325" class="dash"/>
  <text x="85" y="746" class="body">✓ AuraEditor Win64 Development build — GameServerClient.cpp, LoginPlayerController.cpp, AuraGameModeBase.cpp</text>
  <text x="85" y="771" class="body">✓ 16/16 Python contract scripts, including authenticated/allowlisted/nonce/port regression checks</text>
  <text x="85" y="796" class="body">✓ git diff --check; JSON/config and SVG/XML validation; generated Python bytecode restored to its pre-run state</text>
  <text x="85" y="821" class="small">Runtime consequence: local boot uses loopback GSM by default; LAN/public operation must opt in with explicit endpoint, credentials, and client ranges.</text>
</svg>
