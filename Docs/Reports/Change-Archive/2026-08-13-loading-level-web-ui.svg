<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc">
  <title id="title">Loading level migrated from UMG to AuraWebUI</title>
  <desc id="desc">Before and after diagram showing LoadingPlayerController retaining travel logic while replacing WBP_LoadingUI with the AuraWebUI loading page and loading_progress WebSocket events.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#182943"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#79aaff"/><stop offset="1" stop-color="#536fd6"/></linearGradient>
    <linearGradient id="good" x1="0" x2="1"><stop offset="0" stop-color="#6be4a3"/><stop offset="1" stop-color="#279d6d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a5b9e8"/></marker>
  </defs>
  <rect width="1240" height="760" fill="url(#bg)"/>
  <text x="60" y="62" fill="#f2f6ff" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Loading level → AuraWebUI</text>
  <text x="60" y="94" fill="#aebddd" font-family="Segoe UI, Arial, sans-serif" font-size="16">Presentation changed; travel and progress ownership remain in ALoadingPlayerController</text>

  <rect x="60" y="135" width="1120" height="210" rx="18" fill="#111a2d" stroke="#384e73" stroke-width="2" filter="url(#shadow)"/>
  <text x="88" y="177" fill="#dce8ff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Before</text>
  <rect x="88" y="204" width="300" height="102" rx="12" fill="#2a2635" stroke="#715878"/>
  <text x="238" y="244" text-anchor="middle" fill="#f0dff1" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">WBP_LoadingUI</text>
  <text x="238" y="272" text-anchor="middle" fill="#cdbbd0" font-family="Segoe UI, Arial, sans-serif" font-size="14">TipsText UMG binding</text>
  <path d="M412 255 H490" stroke="#a5b9e8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="512" y="204" width="300" height="102" rx="12" fill="#263552" stroke="#5277b5"/>
  <text x="662" y="244" text-anchor="middle" fill="#dce8ff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">LoadingPlayerController</text>
  <text x="662" y="272" text-anchor="middle" fill="#b8c9e8" font-family="Segoe UI, Arial, sans-serif" font-size="14">travel + timer + progress</text>
  <path d="M836 255 H914" stroke="#a5b9e8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="936" y="204" width="205" height="102" rx="12" fill="#2a2635" stroke="#715878"/>
  <text x="1038" y="244" text-anchor="middle" fill="#f0dff1" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">TipsText</text>
  <text x="1038" y="272" text-anchor="middle" fill="#cdbbd0" font-family="Segoe UI, Arial, sans-serif" font-size="14">local UMG update</text>

  <rect x="60" y="385" width="1120" height="290" rx="18" fill="#111a2d" stroke="#384e73" stroke-width="2" filter="url(#shadow)"/>
  <text x="88" y="427" fill="#dce8ff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">After</text>
  <rect x="88" y="456" width="255" height="130" rx="12" fill="#263552" stroke="#5277b5"/>
  <text x="215" y="495" text-anchor="middle" fill="#dce8ff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">LoadingPlayerController</text>
  <text x="215" y="523" text-anchor="middle" fill="#b8c9e8" font-family="Segoe UI, Arial, sans-serif" font-size="14">travel + timer unchanged</text>
  <text x="215" y="549" text-anchor="middle" fill="#b8c9e8" font-family="Segoe UI, Arial, sans-serif" font-size="14">sends progress event</text>
  <path d="M367 521 H435" stroke="#a5b9e8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="455" y="456" width="245" height="130" rx="12" fill="url(#accent)"/>
  <text x="578" y="495" text-anchor="middle" fill="#08162d" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">AuraWebUI bridge</text>
  <text x="578" y="523" text-anchor="middle" fill="#102953" font-family="Segoe UI, Arial, sans-serif" font-size="14">loopback WebSocket</text>
  <text x="578" y="549" text-anchor="middle" fill="#102953" font-family="Segoe UI, Arial, sans-serif" font-size="14">loading_progress JSON</text>
  <path d="M724 521 H792" stroke="#a5b9e8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="812" y="456" width="330" height="130" rx="12" fill="#183a42" stroke="#4b9f9b"/>
  <text x="977" y="495" text-anchor="middle" fill="#d8fff5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">WebUI loading.html</text>
  <text x="977" y="523" text-anchor="middle" fill="#b6e4dc" font-family="Segoe UI, Arial, sans-serif" font-size="14">progress bar + status message</text>
  <text x="977" y="549" text-anchor="middle" fill="#b6e4dc" font-family="Segoe UI, Arial, sans-serif" font-size="14">ready handshake + reconnect</text>
  <rect x="88" y="615" width="1054" height="32" rx="16" fill="url(#good)"/>
  <text x="615" y="637" text-anchor="middle" fill="#071b16" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Validation: AuraServer build passed · AuraEditor live-coding build passed · 3 AuraWebUI automation tests passed</text>
</svg>
