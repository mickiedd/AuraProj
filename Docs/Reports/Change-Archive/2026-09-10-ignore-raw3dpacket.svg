<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430">
  <rect width="1100" height="430" fill="#101827"/>
  <g font-family="Arial, sans-serif" fill="#edf2f7">
    <text x="40" y="52" font-size="28">AuraProj · Raw3DPacket push repair</text>
    <rect x="40" y="85" width="470" height="160" rx="14" fill="#492932"/>
    <text x="65" y="122" font-size="23">Before</text>
    <text x="65" y="160" font-size="18">Raw3DPacket ZIPs tracked in Git</text>
    <text x="65" y="193" font-size="18">203.7 MB and 149.2 MB blobs</text>
    <text x="65" y="226" font-size="18">GitHub rejects the push</text>
    <rect x="590" y="85" width="470" height="160" rx="14" fill="#19463e"/>
    <text x="615" y="122" font-size="23">After</text>
    <text x="615" y="160" font-size="18">/Raw3DPacket/ ignored by Git</text>
    <text x="615" y="193" font-size="18">Local ZIPs stay on disk</text>
    <text x="615" y="226" font-size="18">Amended commit has no oversized blobs</text>
    <text x="40" y="300" font-size="22">Validation</text>
    <text x="40" y="337" font-size="18">Raw3DPacket absent from commit tree · outgoing Git blobs below 100 MiB</text>
    <text x="40" y="372" font-size="18">Existing staged user changes restored after the amendment</text>
  </g>
</svg>
