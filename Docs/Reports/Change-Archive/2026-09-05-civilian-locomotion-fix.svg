<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#52606d"/>
    </marker>
    <style>
      .title { font: 700 28px Segoe UI, sans-serif; fill: #17202a; }
      .subtitle { font: 16px Segoe UI, sans-serif; fill: #52606d; }
      .section { font: 700 19px Segoe UI, sans-serif; fill: #17202a; }
      .body { font: 15px Segoe UI, sans-serif; fill: #17202a; }
      .small { font: 13px Segoe UI, sans-serif; fill: #52606d; }
      .bad { fill: #fff0f0; stroke: #d64545; stroke-width: 2; }
      .good { fill: #edfaf3; stroke: #2e9d68; stroke-width: 2; }
      .neutral { fill: #f3f6f9; stroke: #94a3b8; stroke-width: 2; }
      .test { fill: #eef4ff; stroke: #4f7fc4; stroke-width: 2; }
      .line { stroke: #52606d; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="54" y="50" class="title">Civilian locomotion animation — before and after</text>
  <text x="54" y="78" class="subtitle">The role already moved; the Shaman child Anim Blueprint was not refreshing the inherited movement variable.</text>

  <rect x="40" y="112" width="535" height="390" rx="14" class="bad"/>
  <text x="68" y="150" class="section">Before: moving Civilian stayed visually idle</text>
  <rect x="68" y="188" width="190" height="70" rx="10" class="neutral"/>
  <text x="86" y="217" class="body">Civilian actor moves</text>
  <text x="86" y="241" class="small">AAuraCivilian / player shell</text>
  <path d="M258 223 L314 223" class="line"/>
  <rect x="314" y="188" width="215" height="70" rx="10" class="bad"/>
  <text x="332" y="217" class="body">ABP_Shaman</text>
  <text x="332" y="241" class="small">Update event disabled</text>
  <path d="M421 258 L421 306" class="line"/>
  <rect x="314" y="306" width="215" height="70" rx="10" class="bad"/>
  <text x="332" y="335" class="body">GroundSpeed = 0</text>
  <text x="332" y="359" class="small">parent update never called</text>
  <path d="M421 376 L421 424" class="line"/>
  <rect x="314" y="424" width="215" height="48" rx="10" class="bad"/>
  <text x="350" y="454" class="body">BS_IdleWalk → Idle</text>
  <text x="68" y="474" class="small">Walk asset existed, but its blend input never received movement speed.</text>

  <rect x="625" y="112" width="535" height="390" rx="14" class="good"/>
  <text x="653" y="150" class="section">After: movement reaches the authored walk sample</text>
  <rect x="653" y="188" width="190" height="70" rx="10" class="neutral"/>
  <text x="671" y="217" class="body">Civilian actor moves</text>
  <text x="671" y="241" class="small">velocity is non-zero</text>
  <path d="M843 223 L899 223" class="line"/>
  <rect x="899" y="188" width="215" height="70" rx="10" class="good"/>
  <text x="917" y="217" class="body">ABP_Shaman</text>
  <text x="917" y="241" class="small">event + parent call enabled</text>
  <path d="M1006 258 L1006 306" class="line"/>
  <rect x="899" y="306" width="215" height="70" rx="10" class="good"/>
  <text x="917" y="335" class="body">ABP_Enemy</text>
  <text x="917" y="359" class="small">GetVelocity → GroundSpeed</text>
  <path d="M1006 376 L1006 424" class="line"/>
  <rect x="899" y="424" width="215" height="48" rx="10" class="good"/>
  <text x="926" y="454" class="body">BS_IdleWalk → Walk</text>
  <text x="653" y="474" class="small">Ability montage slots remain inherited and unaffected by this locomotion fix.</text>

  <rect x="40" y="540" width="1120" height="170" rx="14" class="test"/>
  <text x="68" y="578" class="section">Validation evidence</text>
  <text x="68" y="610" class="body">✓ Editor commandlet: ABP_Shaman saved with updateEventEnabled=true and parentCallEnabled=true</text>
  <text x="68" y="637" class="body">✓ Native test: Aura.RoleBattle.Civilian.Presentation.LocomotionGraph — Success</text>
  <text x="68" y="664" class="body">✓ Win64 BuildCookRun: packaged client boots Login; runtime log reports roles=4 and WebUI/login.html loaded</text>
  <text x="68" y="691" class="small">Visual-capture note: no targetable native game window was exposed by the computer-use surface, so no screenshot claim is made.</text>
</svg>
