<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">AuraProj daily change reference for 2026-07-11</title><desc id="desc">BehaviorU rename and travel endpoint caching.</desc><defs><linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eaf2f9"/></linearGradient><style>.t{font:700 26px Segoe UI,Arial;fill:#17324d}.s{font:400 15px Segoe UI,Arial;fill:#47657e}.h{font:700 18px Segoe UI,Arial;fill:#17324d}.b{font:400 15px Segoe UI,Arial;fill:#25475f}.l{font:700 12px Segoe UI,Arial;fill:white;letter-spacing:1px}</style></defs><rect width="1200" height="700" fill="url(#bg)"/><text x="50" y="52" class="t">2026-07-11 - BehaviorU rename and travel caching</text><text x="50" y="80" class="s">main | 2 commits: a25ad15, 82adbc8 | daily before/after map</text><rect x="50" y="110" width="1100" height="70" rx="14" fill="white" stroke="#7aa5c2"/><text x="75" y="140" class="h">Daily job</text><text x="190" y="140" class="b">Stabilize the plugin name and avoid resolving the same cross-server endpoint repeatedly.</text><text x="75" y="164" class="s">Rename surface: modules, files, launcher, components, dependencies, XML, editor JavaScript, and icons.</text><rect x="50" y="215" width="335" height="245" rx="16" fill="white" stroke="#7aa5c2"/><rect x="50" y="215" width="335" height="38" rx="16" fill="#2d668f"/><text x="72" y="240" class="l">BEFORE</text><text x="72" y="290" class="h">Split identity and repeated work</text><text x="72" y="322" class="b">Behaviac names remained in code</text><text x="72" y="348" class="b">and editor/build paths.</text><text x="72" y="384" class="b">Travel endpoint resolution repeated</text><text x="72" y="410" class="b">inside one login flow.</text><text x="72" y="444" class="s">Stale launcher artifacts added noise.</text><path d="M385 337 L430 337" stroke="#2d668f" stroke-width="3"/><rect x="430" y="215" width="720" height="245" rx="16" fill="#f5fbf7" stroke="#6ca887"/><rect x="430" y="215" width="720" height="38" rx="16" fill="#39845d"/><text x="452" y="240" class="l">AFTER</text><text x="452" y="290" class="h">BehaviorU is the single current name</text><text x="452" y="322" class="b">Aura modules, dependencies, XML/editor assets, launcher, and icons use BehaviorU.</text><text x="452" y="348" class="b">Stale launcher/build artifacts are removed.</text><text x="452" y="384" class="b">GameInstance caches the resolved cross-server travel endpoint.</text><text x="452" y="410" class="b">Affected flow: login request -> cached endpoint -> travel.</text><text x="452" y="444" class="s">Guard: a remaining Behaviac path usually indicates an incomplete rename.</text><rect x="50" y="500" width="520" height="130" rx="16" fill="#fffdf7" stroke="#d3a44f"/><text x="75" y="535" class="h">Important guard</text><text x="75" y="565" class="b">Treat naming and travel-state fixes separately.</text><text x="75" y="590" class="b">Do not resolve a new endpoint when the GameInstance</text><text x="75" y="615" class="b">already owns the value for the current flow.</text><rect x="600" y="500" width="550" height="130" rx="16" fill="#f2f8ff" stroke="#7aa5c2"/><text x="625" y="535" class="h">Validation / newcomer path</text><text x="625" y="565" class="b">Read the rename diff with the GameInstance travel code.</text><text x="625" y="590" class="b">BehaviorU is the current plugin identity; cached travel</text><text x="625" y="615" class="b">state belongs to GameInstance.</text></svg>
