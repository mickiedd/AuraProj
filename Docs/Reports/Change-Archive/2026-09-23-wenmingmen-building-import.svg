<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Wenmingmen building import and Blueprint flow</title>
  <desc id="desc">Before, the project had no Wenmingmen assets. After, the high-detail GLB and texture sources are staged, native Unreal assets are imported, and an eight-component Actor Blueprint is placeable. Validation checks source coverage, settings, and spawned bounds.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5a6c8c" stroke-width="2"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172640}
      .title{font-size:31px;font-weight:700}
      .subtitle{font-size:17px;fill:#4c5b72}
      .label{font-size:17px;font-weight:700}
      .body{font-size:15px}
      .small{font-size:14px;fill:#52617a}
      .card{fill:#fff;stroke:#c6d1e2;stroke-width:2}
      .arrow{fill:none;stroke:#5a6c8c;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="760" fill="#f5f8fd"/>
  <text x="64" y="67" class="title">Wenmingmen: source package → placeable building</text>
  <text x="64" y="96" class="subtitle">23 Sep 2026 · Guangzhou landmark library · UE 5.5</text>

  <rect x="64" y="130" width="1272" height="91" rx="16" fill="#e9eef7" stroke="#c6d1e2"/>
  <text x="91" y="165" class="label">Before</text>
  <text x="91" y="193" class="body">Wenmingmen existed only in the external Raw3dModels ZIP. The project had no native meshes, materials, or placeable Blueprint for it.</text>

  <text x="64" y="267" class="label">After</text>
  <rect x="64" y="291" width="272" height="189" rx="16" class="card"/>
  <rect x="64" y="291" width="272" height="12" rx="6" fill="#6d82b8"/>
  <text x="86" y="332" class="label">Source package</text>
  <text x="86" y="365" class="body">Wenmingmen_HighDetail.glb</text>
  <text x="86" y="391" class="body">8 mesh nodes · 2.38M triangles</text>
  <text x="86" y="417" class="body">25 texture images</text>
  <text x="86" y="453" class="small">Staged in ContentSource</text>

  <path d="M343 385 H376" class="arrow"/>
  <rect x="384" y="291" width="280" height="189" rx="16" class="card"/>
  <rect x="384" y="291" width="280" height="12" rx="6" fill="#3797a4"/>
  <text x="406" y="332" class="label">Native UE resources</text>
  <text x="406" y="365" class="body">8 StaticMesh assets</text>
  <text x="406" y="391" class="body">8 PBR materials</text>
  <text x="406" y="417" class="body">25 Texture2D assets</text>
  <text x="406" y="453" class="small">GLB transforms preserved</text>

  <path d="M671 385 H704" class="arrow"/>
  <rect x="712" y="291" width="290" height="189" rx="16" class="card"/>
  <rect x="712" y="291" width="290" height="12" rx="6" fill="#58a978"/>
  <text x="734" y="332" class="label">BP_Wenmingmen</text>
  <text x="734" y="365" class="body">Actor Blueprint</text>
  <text x="734" y="391" class="body">8 StaticMesh components</text>
  <text x="734" y="417" class="body">Independent placeable asset</text>
  <text x="734" y="453" class="small">Not added to an existing map</text>

  <path d="M1009 385 H1042" class="arrow"/>
  <rect x="1050" y="291" width="286" height="189" rx="16" class="card"/>
  <rect x="1050" y="291" width="286" height="12" rx="6" fill="#e1a14d"/>
  <text x="1072" y="332" class="label">Behavior guards</text>
  <text x="1072" y="365" class="body">Nanite: solid architecture</text>
  <text x="1072" y="391" class="body">Collision: structural parts</text>
  <text x="1072" y="417" class="body">No collision: water / foliage</text>
  <text x="1072" y="453" class="small">Sign uses texture alpha</text>

  <rect x="64" y="521" width="1272" height="179" rx="16" fill="#eaf5ee" stroke="#add4b9" stroke-width="2"/>
  <text x="91" y="560" class="label">Validation in a fresh Unreal Python commandlet</text>
  <text x="91" y="594" class="body">✓ 25 textures, 8 materials, 8 meshes and 8 Blueprint components reload with expected references and settings</text>
  <text x="91" y="624" class="body">✓ Blueprint compiles and spawns; bounds = 65.0 × 28.1 × 22.0 m</text>
  <text x="91" y="654" class="body">✓ Material slots, normal/ORM color space, Nanite, collision and component assignment checked</text>
  <text x="91" y="681" class="small">Source package is an interpretive model; no authored UCX collision or lightmap UV2 was supplied.</text>
</svg>
