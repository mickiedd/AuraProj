  <!-- ===================== FOOTER ===================== -->
  <text x="60" y="562" font-family="Arial" font-size="18" font-weight="700" fill="#20252a">What was verified</text>
  <text x="60" y="592" font-family="Arial" font-size="16" fill="#3d444b">The ring shrank because the builder derives its radius from the landmarks' own geometry: dropping one entry takes it 10612.11 &#8594; 9541.1 cm</text>
  <text x="60" y="618" font-family="Arial" font-size="16" fill="#3d444b">Validation reloads the saved map from disk and re-derives each light from the manifest recipe: 31 actors, 8/8 landmarks, 8/8 lights, 0 errors, 0 warnings</text>
  <text x="60" y="644" font-family="Arial" font-size="16" fill="#3d444b">0 XY overlaps, 0.0 cm placement error, 0.0&#176; aim error, 0 isolation violations; every light still attached to its own building</text>
  <text x="60" y="670" font-family="Arial" font-size="16" fill="#3d444b">56 assets deleted only after the referencer list came back empty; the whole V5/Wuxianmen_4K_Core folder is gone from disk</text>
