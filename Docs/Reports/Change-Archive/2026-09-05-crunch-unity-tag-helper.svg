<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Crunch Unity gameplay-tag helper compilation fix</title>
  <desc id="desc">Before the fix, four anonymous namespace helpers collide in one Unreal Unity translation unit. After the fix, four abilities use one inline shared helper, and both clean and forced Unity builds pass.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.bad{fill:#fef2f2;stroke:#ef4444;stroke-width:2}.good{fill:#f0fdf4;stroke:#22c55e;stroke-width:2}.test{fill:#eff6ff;stroke:#3b82f6;stroke-width:2}.title{font:700 28px Arial;fill:#0f172a}.h{font:700 20px Arial;fill:#0f172a}.body{font:16px Arial;fill:#334155}.small{font:14px Arial;fill:#475569}.red{fill:#991b1b}.green{fill:#166534}.blue{fill:#1e40af}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="650"/>
  <text class="title" x="48" y="52">Crunch ability compilation — Unity-safe tag lookup</text>
  <text class="small" x="48" y="80">Affected abilities: Dash · GroundBlast · Tornado · Uppercut</text>

  <rect class="bad" x="48" y="118" width="330" height="262" rx="14"/>
  <text class="h" x="74" y="156">Before: duplicate local helpers</text>
  <text class="body" x="74" y="198">Dash.cpp → CrunchTag()</text>
  <text class="body" x="74" y="230">GroundBlast.cpp → CrunchTag()</text>
  <text class="body" x="74" y="262">Tornado.cpp → CrunchTag()</text>
  <text class="body" x="74" y="294">Uppercut.cpp → CrunchTag()</text>
  <text class="body red" x="74" y="338">Unity merge: C2084 duplicate body</text>
  <text class="small" x="74" y="362">Follow-on C2065 errors stop the build.</text>

  <path class="line" d="M378 248 H438"/>

  <rect class="good" x="438" y="118" width="330" height="262" rx="14"/>
  <text class="h" x="464" y="156">After: one inline helper</text>
  <text class="body" x="464" y="200">AuraCrunchTagUtils.h</text>
  <text class="body green" x="464" y="236">AuraCrunchTags::Request()</text>
  <text class="body" x="464" y="278">All four abilities call the same</text>
  <text class="body" x="464" y="304">non-throwing tag lookup.</text>
  <text class="small" x="464" y="344">No tag names or gameplay behavior change.</text>

  <path class="line" d="M768 248 H828"/>

  <rect class="test" x="828" y="118" width="324" height="262" rx="14"/>
  <text class="h" x="854" y="156">Validation</text>
  <text class="body blue" x="854" y="200">PASS — clean DebugGame build</text>
  <text class="body" x="854" y="232">150/150 build actions</text>
  <text class="body blue" x="854" y="276">PASS — forced Unity mode</text>
  <text class="body" x="854" y="308">Module.Aura.9.cpp compiled</text>
  <text class="body" x="854" y="334">and linked with exit code 0</text>

  <rect class="panel" x="48" y="432" width="1104" height="156" rx="14"/>
  <text class="h" x="74" y="472">Compilation contract</text>
  <text class="body" x="74" y="510">Separate translation units and generated Unity units now share the same legal definition.</text>
  <text class="body" x="74" y="542">The original C2084/C2065 error chain is removed; unrelated deprecation warnings remain visible for later cleanup.</text>
</svg>
