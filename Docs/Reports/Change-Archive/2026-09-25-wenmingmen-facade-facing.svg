<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="760" fill="#f7f8fa"/>
  <text x="32" y="42" font-size="22" font-weight="700" fill="#1f2933">Wenmingmen turned to face the plaza</text>
  <text x="32" y="66" font-size="13" fill="#52606d">L_GuangzhouLandmarkShowcase · ring rebuilt from Scripts/CreateGuangzhouLandmarkShowcase.py · facing_offset 0 &#8594; 180</text>

  <!-- ============ BEFORE ============ -->
  <g>
    <rect x="32" y="88" width="440" height="286" rx="8" fill="#ffffff" stroke="#9b1c1c"/>
    <text x="48" y="114" font-size="15" font-weight="700" fill="#9b1c1c">BEFORE — back to the plaza</text>
    <text x="48" y="134" font-size="11.5" fill="#52606d">facade 180.00&#176; off the plaza centre</text>

    <circle cx="252" cy="256" r="110" fill="none" stroke="#cbd2d9" stroke-dasharray="5 4"/>
    <circle cx="252" cy="256" r="6" fill="#52606d"/>
    <text x="228" y="280" font-size="11" fill="#52606d">plaza</text>

    <g fill="#9aa5b1">
      <circle cx="360.2" cy="236.4" r="11"/><circle cx="309.4" cy="162.2" r="11"/>
      <circle cx="208.7" cy="154.9" r="11"/><circle cx="146.4" cy="225.3" r="11"/>
      <circle cx="155.6" cy="308.9" r="11"/><circle cx="228.1" cy="363.4" r="11"/>
    </g>

    <!-- Wenmingmen, facade pointing AWAY -->
    <rect x="322.1" y="317.4" width="16" height="16" fill="#9b1c1c"/>
    <line x1="330.1" y1="325.4" x2="352" y2="346" stroke="#9b1c1c" stroke-width="2.5"/>
    <polygon points="352,346 344.5,341.5 347.5,336" fill="#9b1c1c"/>
    <text x="286" y="374" font-size="12" font-weight="700" fill="#9b1c1c">Wenmingmen</text>
    <text x="60" y="360" font-size="11" fill="#9b1c1c">door, couplets, vines and canal all face outward</text>
  </g>

  <!-- ============ AFTER ============ -->
  <g>
    <rect x="528" y="88" width="440" height="286" rx="8" fill="#ffffff" stroke="#1f7a4d"/>
    <text x="544" y="114" font-size="15" font-weight="700" fill="#0b6b3a">AFTER — facade to the plaza</text>
    <text x="544" y="134" font-size="11.5" fill="#52606d">facade 0.000&#176; off the plaza centre</text>

    <circle cx="748" cy="256" r="110" fill="none" stroke="#cbd2d9" stroke-dasharray="5 4"/>
    <circle cx="748" cy="256" r="6" fill="#52606d"/>
    <text x="724" y="280" font-size="11" fill="#52606d">plaza</text>

    <g fill="#9aa5b1">
      <circle cx="856.2" cy="236.4" r="11"/><circle cx="805.4" cy="162.2" r="11"/>
      <circle cx="704.7" cy="154.9" r="11"/><circle cx="642.4" cy="225.3" r="11"/>
      <circle cx="651.6" cy="308.9" r="11"/><circle cx="724.1" cy="363.4" r="11"/>
    </g>

    <!-- Wenmingmen, facade pointing INWARD -->
    <rect x="818.1" y="317.4" width="16" height="16" fill="#0b6b3a"/>
    <line x1="826.1" y1="325.4" x2="804.2" y2="304.8" stroke="#0b6b3a" stroke-width="2.5"/>
    <polygon points="804.2,304.8 811.7,309.3 808.7,314.8" fill="#0b6b3a"/>
    <text x="806" y="374" font-size="12" font-weight="700" fill="#0b6b3a">Wenmingmen</text>
    <text x="556" y="360" font-size="11" fill="#0b6b3a">door, couplets and vines face the viewer; its own light hits the facade</text>
  </g>

  <!-- ============ EVIDENCE ============ -->
  <g>
    <rect x="32" y="390" width="936" height="150" rx="8" fill="#ffffff" stroke="#cbd2d9"/>
    <text x="48" y="416" font-size="14" font-weight="700" fill="#1f2933">Why the facade is +Y, measured on the placed actor</text>
    <text x="48" y="438" font-size="11.5" fill="#1f2933">The previous placement assumed Wenmingmen shared the other gates' local &#8722;Y front. Four readings in the actor's own frame say otherwise:</text>
    <g font-size="11.5" fill="#1f2933">
      <text x="60" y="462" font-weight="700">SMC_water</text>
      <text x="150" y="462">canal the bridge crosses — local Y 710..1810. The front render puts the door on the canal side, and no rotation changes that.</text>
      <text x="60" y="482" font-weight="700">SMC_iron</text>
      <text x="150" y="482">the door's ironwork — a thin plate at local Y ~200.</text>
      <text x="60" y="502" font-weight="700">SMC_foliage</text>
      <text x="150" y="502">the climbing vines — a band at local Y ~200, on that same face.</text>
      <text x="60" y="522" font-weight="700">SMC_stone / SMC_limestone</text>
      <text x="252" y="522">the paved platform starts at local Y ~&#8722;230 and runs to +1867 / +2351, so the apron lies in +Y only.</text>
    </g>
  </g>

  <!-- ============ FLOW ============ -->
  <g>
    <text x="32" y="576" font-size="14" font-weight="700" fill="#1f2933">Flow</text>
    <g font-size="11.5" fill="#1f2933">
      <rect x="32" y="590" width="216" height="58" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
      <text x="44" y="612" font-weight="700">1 · Register the offset</text>
      <text x="44" y="630" fill="#52606d">Wenmingmen facing_offset 180</text>

      <rect x="268" y="590" width="216" height="58" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
      <text x="280" y="612" font-weight="700">2 · Rebuild the ring</text>
      <text x="280" y="630" fill="#52606d">28 actors cleared, 7 rebuilt</text>

      <rect x="504" y="590" width="216" height="58" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
      <text x="516" y="612" font-weight="700">3 · Validate</text>
      <text x="516" y="630" fill="#52606d">new facing check, 0 errors</text>

      <rect x="740" y="590" width="228" height="58" rx="6" fill="#ffffff" stroke="#1f7a4d"/>
      <text x="752" y="612" font-weight="700">4 · Archive</text>
      <text x="752" y="630" fill="#52606d">SVG + record + memory index</text>
    </g>
  </g>

  <text x="32" y="686" font-size="11.5" fill="#1f2933">The gap that let this through: the validator checked grounding, spacing, overlap, lights and labels — but never which way a landmark faced, so a correctly built gate could stand back to front.</text>
  <text x="32" y="706" font-size="11.5" fill="#1f2933">It now records each model's facade axis (Wenmingmen +Y, the other six &#8722;Y) and asserts the saved yaw turns that axis at the plaza. Re-run against the old level it reported exactly this one error at 180.00&#176;.</text>
  <text x="32" y="730" font-size="11.5" fill="#9b1c1c">Caveat: the running editor still holds a level copy loaded before the rebuild, so it shows the old state until the level is reloaded — and must not be saved over the rebuilt map.</text>
</svg>
