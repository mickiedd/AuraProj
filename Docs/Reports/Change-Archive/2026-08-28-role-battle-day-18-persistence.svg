<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Role Battle Day 18 player and world persistence</title>
  <desc id="desc">Authenticated identities select isolated player records while a server-owned world snapshot restores population and merchant state. Verified records update an alternating manifest and corrupt newest state falls back.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081426"/><stop offset="1" stop-color="#1b2945"/></linearGradient>
    <linearGradient id="player" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1b8ab5"/><stop offset="1" stop-color="#536ee8"/></linearGradient>
    <linearGradient id="world" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#137f76"/><stop offset="1" stop-color="#47c78a"/></linearGradient>
    <linearGradient id="manifest" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9b6bdb"/><stop offset="1" stop-color="#d38fca"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9fe6ff"/></marker>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <text x="60" y="62" fill="#f4f8ff" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="700">Role/Battle Day 18</text>
  <text x="60" y="98" fill="#a7bfd2" font-family="Segoe UI,Arial,sans-serif" font-size="20">Persistence: authenticated identity, isolated records, verified recovery</text>

  <rect x="55" y="145" width="250" height="230" rx="18" fill="#19354b" stroke="#397e9e" stroke-width="2" filter="url(#shadow)"/>
  <text x="82" y="184" fill="#9fe6ff" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">SERVER IDENTITY</text>
  <text x="82" y="226" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Provider + unique ID</text>
  <text x="82" y="263" fill="#d2e6f2" font-family="Segoe UI,Arial,sans-serif" font-size="17">canonical profile key</text>
  <text x="82" y="293" fill="#d2e6f2" font-family="Segoe UI,Arial,sans-serif" font-size="17">hashed slot name</text>
  <text x="82" y="335" fill="#8de6bd" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">fail closed on mismatch</text>

  <path d="M305 235 L375 235" stroke="#9fe6ff" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="375" y="145" width="330" height="230" rx="18" fill="url(#player)" stroke="#b0edff" stroke-width="2" filter="url(#shadow)"/>
  <text x="405" y="184" fill="#062238" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">PLAYER RECORD</text>
  <text x="405" y="226" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Load before pawn</text>
  <text x="405" y="263" fill="#e9faff" font-family="Segoe UI,Arial,sans-serif" font-size="17">role • XP • attributes • FireGun</text>
  <text x="405" y="293" fill="#e9faff" font-family="Segoe UI,Arial,sans-serif" font-size="17">int64 wallet • inventory</text>
  <text x="405" y="335" fill="#062238" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">new nonce on reconnect</text>

  <path d="M705 235 L775 235" stroke="#9fe6ff" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="775" y="145" width="370" height="230" rx="18" fill="url(#world)" stroke="#b8f5d7" stroke-width="2" filter="url(#shadow)"/>
  <text x="805" y="184" fill="#063026" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">WORLD SNAPSHOT</text>
  <text x="805" y="226" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Restore once</text>
  <text x="805" y="263" fill="#edfff5" font-family="Segoe UI,Arial,sans-serif" font-size="17">population member lifecycle</text>
  <text x="805" y="293" fill="#edfff5" font-family="Segoe UI,Arial,sans-serif" font-size="17">merchant stock + revisions</text>
  <text x="805" y="335" fill="#063026" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">WorldPersistenceId scoped</text>

  <rect x="55" y="430" width="1090" height="225" rx="18" fill="#102333" stroke="#31566d" stroke-width="2"/>
  <text x="82" y="472" fill="#9fe6ff" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">CHECKPOINT AND RECOVERY</text>
  <g fill="#dceaf3" font-family="Segoe UI,Arial,sans-serif" font-size="18">
    <text x="90" y="520">1. Commit purchase</text>
    <text x="90" y="557">2. Verify player + world records</text>
    <text x="90" y="594">3. Write inactive manifest A/B</text>
    <text x="610" y="520">4. Reload highest valid generation</text>
    <text x="610" y="557">5. Ignore corrupt newest record</text>
    <text x="610" y="594">6. Restore population and merchant state once</text>
  </g>
  <rect x="500" y="615" width="210" height="24" rx="12" fill="url(#manifest)"/>
  <text x="600" y="633" text-anchor="middle" fill="#27133d" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">A/B + checksum + generation</text>
</svg>
