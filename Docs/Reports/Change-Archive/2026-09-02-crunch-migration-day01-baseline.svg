<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Crunch migration Day 01 baseline</title>
  <desc id="desc">Day 01 freezes the five-skill scope and source asset hashes before gameplay implementation.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1728"/><stop offset="1" stop-color="#173b4d"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#78d6ff"/></marker><style>.title{font:700 30px Arial;fill:#fff}.h{font:700 20px Arial;fill:#fff}.t{font:16px Arial;fill:#dcecf5}.small{font:14px Arial;fill:#aac5d1}.box{fill:#193a50;stroke:#4aa1ca;stroke-width:2}.warn{fill:#49351e;stroke:#e1a643;stroke-width:2}.ok{fill:#24422d;stroke:#6dc886;stroke-width:2}.line{stroke:#78d6ff;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1400" height="800" fill="url(#bg)"/>
  <text x="52" y="58" class="title">Crunch migration · Day 01 baseline and scope freeze</text>
  <text x="52" y="91" class="small">No gameplay edits advance until source truth, authority boundaries, and evidence ownership are explicit.</text>
  <rect x="55" y="150" width="300" height="210" rx="16" class="warn"/><text x="80" y="190" class="h">Current risk</text><text x="80" y="228" class="t">Aura-shaped combo prototype</text><text x="80" y="256" class="t">Aura mesh / ABP adapter</text><text x="80" y="284" class="t">Five source skills not yet owned</text><text x="80" y="312" class="t">Stale package can look connected</text><text x="80" y="340" class="small">Hash and normal-flow gaps remain</text>
  <rect x="475" y="150" width="360" height="210" rx="16" class="box"/><text x="500" y="190" class="h">Frozen manifests</text><text x="500" y="228" class="t">Role + InputTag.LMB/1/2/3/4</text><text x="500" y="256" class="t">Server authority and fallback rule</text><text x="500" y="284" class="t">19 source asset anchors + SHA-256</text><text x="500" y="312" class="t">Editor CDO/notify export required</text><text x="500" y="340" class="small">RunId-bound evidence paths</text>
  <rect x="955" y="150" width="385" height="210" rx="16" class="ok"/><text x="980" y="190" class="h">Day 01 gate</text><text x="980" y="228" class="t">Contract preflight passes</text><text x="980" y="256" class="t">No implicit “latest” artifact</text><text x="980" y="284" class="t">Dedicated status stays BLOCKED</text><text x="980" y="312" class="t">Editor export is a visible dependency</text><text x="980" y="340" class="small">Ready for review before Day 02</text>
  <path d="M355 255 H465" class="line"/><path d="M835 255 H945" class="line"/>
  <rect x="55" y="450" width="1285" height="230" rx="18" fill="#101f30" stroke="#385f76" stroke-width="2"/><text x="82" y="490" class="h">Validation chain</text><text x="82" y="532" class="t">source checkout (read-only) → hashed anchors → frozen role/input contract → bounded runner → RunId result JSON</text><text x="82" y="580" class="t">Next gate: export dependency closure, Blueprint defaults, montage section/event times, cues, and source-reference scan in UE 5.5.</text><text x="82" y="628" class="t">Failure semantics: timeout or missing editor export blocks downstream implementation; no warning-only PASS.</text><text x="82" y="660" class="small">Evidence: crunch-migration-scope.json · crunch-source-asset-manifest.json · Saved/Reports/CrunchMigration/&lt;RunId&gt;/result.json</text>
</svg>
