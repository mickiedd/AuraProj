<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Origin pull conflict resolution</title>
  <desc id="desc">Before and after diagram for merging origin main into the local main branch, resolving the Crunch gameplay tag helper overlap and preserving archive history.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <linearGradient id="before" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff7ed"/><stop offset="1" stop-color="#ffedd5"/></linearGradient>
    <linearGradient id="after" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ecfdf5"/><stop offset="1" stop-color="#d1fae5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.13"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#4f46e5"/></marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .card-title { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .body { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .mono { font: 600 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #334155; }
      .small { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .pill { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #166534; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="64" y="64" class="title">Origin pull conflict resolution</text>
  <text x="64" y="94" class="subtitle">Integrate origin/main into local main while retaining the gameplay-expansion commit and both archive histories.</text>
  <g filter="url(#shadow)">
    <rect x="64" y="142" width="450" height="360" rx="20" fill="url(#before)" stroke="#fb923c" stroke-width="2"/>
    <text x="94" y="184" class="card-title">Before · unfinished merge</text>
    <text x="94" y="220" class="mono">main: b56f217  ↔  origin/main: 959b670</text>
    <text x="94" y="258" class="body">Five unmerged paths:</text>
    <text x="116" y="289" class="body">• Four Crunch ability .cpp files</text>
    <text x="116" y="318" class="body">• Visual-change archive index</text>
    <text x="94" y="362" class="body">Overlapping solutions:</text>
    <text x="116" y="393" class="body">Local: file-local CrunchTag helpers</text>
    <text x="116" y="422" class="body">Origin: shared AuraCrunchTags::Request()</text>
    <text x="94" y="470" class="small">MERGE_HEAD present · conflict markers active</text>
  </g>
  <path d="M540 322 C600 270, 680 270, 740 322" fill="none" stroke="#4f46e5" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="570" y="250" class="small">resolve by behavior, not by dropping either branch</text>
  <g filter="url(#shadow)">
    <rect x="766" y="142" width="450" height="360" rx="20" fill="url(#after)" stroke="#34d399" stroke-width="2"/>
    <text x="796" y="184" class="card-title">After · resolved merge</text>
    <text x="796" y="220" class="mono">main = local foundation + origin helper fix</text>
    <text x="796" y="258" class="body">Shared helper retained:</text>
    <text x="818" y="289" class="mono">AuraCrunchTagUtils.h</text>
    <text x="796" y="330" class="body">Dash · GroundBlast · Tornado · Uppercut</text>
    <text x="818" y="361" class="body">include and call AuraCrunchTags::Request()</text>
    <text x="796" y="405" class="body">Archive index contains both histories</text>
    <text x="796" y="447" class="body">No source or documentation markers remain</text>
    <text x="796" y="490" class="small">Ready for merge commit</text>
  </g>
  <rect x="64" y="558" width="1152" height="104" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="94" y="592" class="card-title">Validation receipts</text>
  <g transform="translate(94,612)"><rect width="242" height="30" rx="15" fill="#dcfce7"/><text x="18" y="20" class="pill">PASS · AuraEditor build</text></g>
  <g transform="translate(358,612)"><rect width="224" height="30" rx="15" fill="#dcfce7"/><text x="18" y="20" class="pill">PASS · diff --check</text></g>
  <g transform="translate(604,612)"><rect width="252" height="30" rx="15" fill="#dcfce7"/><text x="18" y="20" class="pill">PASS · marker scan = 0</text></g>
  <g transform="translate(878,612)"><rect width="308" height="30" rx="15" fill="#fef3c7"/><text x="18" y="20" style="font:700 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#92400e">LIMITED · headless runner hung</text></g>
</svg>
