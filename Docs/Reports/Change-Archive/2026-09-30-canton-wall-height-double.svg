<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Canton wall height doubled</title>
  <desc id="desc">The saved adaptive wall modules grow from 500 centimetres to 1000 centimetres while preserving their buried terrain contact line.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker>
    <style>
      .title{font:700 26px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#0f172a}
      .h{font:700 18px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#0f172a}
      .body{font:14px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#334155}
      .small{font:12px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#475569}
      .box{stroke:#94a3b8;stroke-width:2;rx:14}
      .before{fill:#fff7ed;stroke:#ea580c}
      .after{fill:#eff6ff;stroke:#2563eb}
      .pass{fill:#ecfdf5;stroke:#059669}
      .arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1100" height="620" fill="#ffffff"/>
  <text x="44" y="48" class="title">Canton provisional wall height doubled — 2026-09-30</text>
  <text x="44" y="76" class="body">All adaptive wall modules keep their terrain contact line and grow upward from 500 cm to 1,000 cm.</text>

  <rect x="44" y="112" width="315" height="210" class="box before"/>
  <text x="68" y="147" class="h">Before</text>
  <path d="M70 274 C120 238 165 282 212 250 S292 258 334 230" stroke="#cbd5e1" stroke-width="12" fill="none"/>
  <rect x="80" y="194" width="230" height="80" fill="#d99b2b" opacity=".9"/>
  <line x1="80" y1="274" x2="310" y2="274" stroke="#059669" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="68" y="302" class="body">5 m wall · green line is the preserved buried base</text>

  <path d="M360 215 C400 215 416 215 450 215" class="arrow"/>

  <rect x="452" y="112" width="315" height="210" class="box after"/>
  <text x="476" y="147" class="h">After</text>
  <path d="M478 274 C528 238 573 282 620 250 S700 258 742 230" stroke="#cbd5e1" stroke-width="12" fill="none"/>
  <rect x="488" y="114" width="230" height="160" fill="#d99b2b" opacity=".9"/>
  <line x1="488" y1="274" x2="718" y2="274" stroke="#059669" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="476" y="302" class="body">10 m wall · same terrain contact line</text>

  <path d="M768 215 C808 215 824 215 858 215" class="arrow"/>

  <rect x="860" y="112" width="198" height="210" class="box pass"/>
  <text x="882" y="147" class="h">Saved result</text>
  <text x="882" y="181" class="body">4,790 modules</text>
  <text x="882" y="204" class="body">1,000 cm each</text>
  <text x="882" y="227" class="body">base preserved</text>
  <text x="882" y="250" class="body">0 positive gaps</text>
  <text x="882" y="273" class="small">9 landmarks retained</text>

  <rect x="190" y="370" width="720" height="178" class="box pass"/>
  <text x="218" y="407" class="h">Verification</text>
  <text x="218" y="438" class="body">✓ Fresh editor reload: 4,790 adaptive modules, no coarse wall actors</text>
  <text x="218" y="463" class="body">✓ Terrain validator: max bottom gap −77.14 cm; zero positive endpoints</text>
  <text x="218" y="488" class="body">✓ Fresh disk save: 9 landmarks and 4,790 wall actors reloaded</text>
  <text x="218" y="513" class="body">✓ Scoped cook and standalone player camera pass at 1280×720</text>
</svg>
