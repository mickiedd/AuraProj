  <text x="450" y="335" class="small">3,482 × 2,676 × 2,532 cm</text>
  <path d="M750 260H800" stroke="#8fe1d0" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="800" y="125" width="360" height="270" rx="16" fill="#3d304d" stroke="#d9a5ff" stroke-width="3"/>
  <text x="830" y="170" class="h">Placed landmark</text>
  <text x="830" y="215" class="body">GuangzhouLandmark_Xiaobeimen</text>
  <text x="830" y="255" class="small">StaticMeshActor_451</text>
  <text x="830" y="280" class="small">center: X=-140400, Y=95400</text>
