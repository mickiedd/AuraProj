  <path d="M370 260H420" stroke="#8fe1d0" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="420" y="125" width="330" height="270" rx="16" fill="#173d43" stroke="#8fe1d0" stroke-width="3"/>
  <text x="450" y="170" class="h">Imported asset</text>
  <text x="450" y="215" class="body">SM_Xiaobeimen_</text>
