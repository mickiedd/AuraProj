  <text x="70" y="540" class="body">PASS: source repair statistics • imported bounds • Nanite • 12 material slots • saved map reference</text>
  <text x="70" y="570" class="body">PASS: placement center and ground contact • four tagged actors • pairwise and existing-mesh overlap checks</text>
  <text x="70" y="600" class="note">Old asset /Game/Assets/Environment/GuangzhouLandmarks/Xiaobeimen/SM_Xiaobeimen remains available for rollback.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8fe1d0"/>
