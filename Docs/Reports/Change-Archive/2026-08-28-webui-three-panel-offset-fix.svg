<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">WebUI three-panel HUD viewport offset fix</title>
  <desc id="desc">Before and after diagram showing negative fixed sizes hiding the right-top and bottom browsers, then positive UMG sizes making both panels visible while preserving bounded input regions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#75d9ff"/></marker>
    <style>
      .bg{fill:#08111f}.title{font:700 28px Arial,sans-serif;fill:#eef7ff}.subtitle{font:15px Arial,sans-serif;fill:#a9bfd6}.section{font:700 19px Arial,sans-serif;fill:#ffd66b}.label{font:700 14px Arial,sans-serif;fill:#eef7ff}.body{font:14px Arial,sans-serif;fill:#c5d6e8}.small{font:12px Arial,sans-serif;fill:#9eb1c8}.code{font:13px Consolas,monospace;fill:#b9eaff}.bad{fill:#2b1825;stroke:#d96b86;stroke-width:2}.good{fill:#112a36;stroke:#65dcff;stroke-width:2}.game{fill:#162337;stroke:#6e87a3;stroke-width:2}.hidden{fill:#3a2330;stroke:#d96b86;stroke-width:2;stroke-dasharray:7 5}.panel{fill:#173e51;stroke:#65dcff;stroke-width:2}.guard{fill:#142a22;stroke:#78d6a3;stroke-width:2}.warn{fill:#3b2f16;stroke:#ffd66b;stroke-width:2}.arrow{stroke:#75d9ff;stroke-width:3;fill:none;marker-end:url(#arrow)}.check{fill:#a7f3c4;font:700 14px Arial,sans-serif}.cross{fill:#ff9eaf;font:700 16px Arial,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text x="52" y="50" class="title">Three-panel WebUI HUD: viewport offset correction</text>
  <text x="52" y="78" class="subtitle">UMG uses Right/Bottom as fixed size on non-stretched axes; CSS-style negative margins produced invisible browser regions.</text>

  <text x="70" y="125" class="section">BEFORE: CREATED BUT CULLED</text>
  <rect x="52" y="145" width="500" height="300" rx="14" class="bad"/>
  <rect x="78" y="198" width="448" height="205" rx="10" class="game"/>
  <text x="230" y="226" class="body">level viewport</text>
  <rect x="92" y="212" width="110" height="52" rx="7" class="panel"/>
  <text x="103" y="235" class="small">left-top</text>
  <text x="103" y="253" class="code">visible</text>
  <rect x="402" y="212" width="104" height="52" rx="7" class="hidden"/>
  <text x="412" y="235" class="small">right-top</text>
  <text x="412" y="253" class="code">width -24</text>
  <rect x="180" y="355" width="240" height="28" rx="6" class="hidden"/>
  <text x="218" y="374" class="code">bottom height -24</text>
  <text x="78" y="430" class="cross">HTML/bridge succeeded; Slate had no drawable size.</text>

  <path d="M 568 294 L 632 294" class="arrow"/>
  <text x="573" y="272" class="small">use UMG size semantics</text>

  <text x="660" y="125" class="section">AFTER: VISIBLE BOUNDED PANELS</text>
  <rect x="648" y="145" width="500" height="300" rx="14" class="good"/>
  <rect x="674" y="198" width="448" height="205" rx="10" class="game"/>
  <text x="854" y="226" class="body">level viewport</text>
  <rect x="688" y="212" width="128" height="55" rx="7" class="panel"/>
  <text x="700" y="235" class="small">left-top</text>
  <text x="700" y="253" class="code">progress</text>
  <rect x="982" y="212" width="128" height="55" rx="7" class="panel"/>
  <text x="993" y="235" class="small">right-top</text>
  <text x="993" y="253" class="code">366 x 210</text>
  <rect x="720" y="350" width="356" height="42" rx="7" class="panel"/>
  <text x="789" y="376" class="small">bottom: 100px high band</text>
  <text x="674" y="430" class="check">All three WebViews now have positive drawable dimensions.</text>

  <text x="70" y="490" class="section">LAYOUT GUARDS AND VALIDATION</text>
  <rect x="52" y="515" width="1096" height="175" rx="14" fill="#0d1c2d" stroke="#304d69" stroke-width="2"/>
  <rect x="78" y="545" width="300" height="112" rx="9" class="warn"/>
  <text x="98" y="575" class="label">Corrected offsets</text>
  <text x="98" y="601" class="code">right: -390, 24, 366, 210</text>
  <text x="98" y="625" class="code">bottom: 24, -124, 24, 100</text>
  <text x="98" y="646" class="small">positive Right/Bottom sizes</text>
  <path d="M 392 601 L 452 601" class="arrow"/>
  <rect x="462" y="545" width="300" height="112" rx="9" class="guard"/>
  <text x="482" y="575" class="label">Runtime guard</text>
  <text x="482" y="601" class="body">HUD test checks bounded anchors</text>
  <text x="482" y="625" class="body">and positive panel dimensions</text>
  <text x="482" y="647" class="check">no negative-size regression</text>
  <path d="M 776 601 L 836 601" class="arrow"/>
  <rect x="846" y="545" width="276" height="112" rx="9" class="guard"/>
  <text x="866" y="575" class="label">Validation</text>
  <text x="866" y="600" class="check">Build passed</text>
  <text x="866" y="622" class="check">HUD tests 2/2</text>
  <text x="866" y="644" class="check">Plugin tests 4/4</text>
</svg>
