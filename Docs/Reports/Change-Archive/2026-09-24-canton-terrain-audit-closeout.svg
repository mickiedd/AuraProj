<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Canton terrain Days 01–05 audit closeout</title>
  <desc id="desc">The uncommitted provisional terrain evidence was checkpointed, Day 02 source acquisition verified, and Days 03–05 retained behind measured-control and historical-height gates.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#1b2838} .title{font-size:31px;font-weight:700} .sub{font-size:17px;fill:#45576c} .head{font-size:22px;font-weight:700} .body{font-size:17px} .small{font-size:15px} .white{fill:#fff} .amber{fill:#8a5400} .red{fill:#912a2a} .green{fill:#145c45}
  </style>
  <rect width="1200" height="760" fill="#f6f9fc"/>
  <text class="title" x="46" y="59">Canton terrain · Days 01–05 audit closeout</text>
