  <rect x="645" y="117" width="510" height="170" rx="14" fill="#e6f3ed" stroke="#80b49b" stroke-width="2"/>
  <text class="head" x="668" y="151">After follow-up</text>
  <text class="body" x="668" y="185">Checkpoint e087572 on codex branch</text>
  <text class="body" x="668" y="218">Day 02 acquisition verified with exceptions</text>
  <text class="body" x="668" y="251">Four acceptance gates remain open</text>
  <text class="head" x="47" y="337">Evidence flow and guards</text>
  <rect x="45" y="362" width="338" height="172" rx="13" fill="#e6f3ed" stroke="#80b49b" stroke-width="2"/>
  <text class="head green" x="67" y="399">Day 02 · source</text>
  <text class="body" x="67" y="432">1880 BL scan, ID and SHA</text>
  <text class="body" x="67" y="462">Scale graphic inspected</text>
  <text class="small amber" x="67" y="497">Survey date / numeric scale unknown</text>
  <path d="M385 447h32m-12-10 12 10-12 10" fill="none" stroke="#56758f" stroke-width="3"/>
