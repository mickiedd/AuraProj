  <text class="body" x="441" y="432">3 holdouts; NE missing</text>
  <text class="body" x="441" y="462">RMSE 93.24 m; worst 132.16 m</text>
  <text class="small red" x="441" y="497">Need surveyed points and pass ≤15/30 m</text>
  <path d="M759 447h32m-12-10 12 10-12 10" fill="none" stroke="#56758f" stroke-width="3"/>
  <rect x="793" y="362" width="362" height="172" rx="13" fill="#fff3e4" stroke="#d9a666" stroke-width="2"/>
