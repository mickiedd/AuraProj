<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img" aria-labelledby="title desc">
  <title id="title">Canton provisional walls fitted to gate buildings</title>
  <desc id="desc">The coarse wall marker run is cut outside each gate footprint and bridged to the gatehouse sides. Eight provisional gate joins are shown with a validation strip.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#efbd58"/></marker></defs>
  <rect width="1500" height="860" fill="#101b2b"/>
  <text x="54" y="62" fill="#f4f7fb" font-family="Arial,sans-serif" font-size="35" font-weight="700">Canton walled city · gate-to-wall fit</text>
  <text x="54" y="99" fill="#b9c9d8" font-family="Arial,sans-serif" font-size="19">Provisional visual engineering on the rejected MAP-001 affine</text>
  <rect x="45" y="133" width="415" height="540" rx="18" fill="#18283b" stroke="#38546a" stroke-width="2"/>
  <text x="72" y="176" fill="#edf4fa" font-family="Arial,sans-serif" font-size="25" font-weight="700">Before · trace-only slabs</text>
  <text x="72" y="208" fill="#bdcbd7" font-family="Arial,sans-serif" font-size="17">Coarse 4 m wall proxies cross the</text>
  <text x="72" y="234" fill="#bdcbd7" font-family="Arial,sans-serif" font-size="17">gate approaches and stop short.</text>
  <path d="M89 390 H389" stroke="#d39d32" stroke-width="30"/>
  <path d="M110 410 H210" stroke="#172338" stroke-width="38"/><path d="M270 410 H365" stroke="#172338" stroke-width="38"/>
  <rect x="210" y="327" width="60" height="165" rx="7" fill="#323e51" stroke="#c6d3dc" stroke-width="3"/>
  <path d="M222 440 Q240 406 258 440" fill="#101b2b" stroke="#efbd58" stroke-width="5"/>
  <path d="M380 370 L430 370" stroke="#efbd58" stroke-width="7" marker-end="url(#arrow)"/>
  <text x="72" y="589" fill="#bdcbd7" font-family="Arial,sans-serif" font-size="17">Measured trace offsets: up to 14.8 m</text>
  <text x="72" y="616" fill="#bdcbd7" font-family="Arial,sans-serif" font-size="17">from a saved gate center.</text>
  <text x="72" y="652" fill="#efbd58" font-family="Arial,sans-serif" font-size="16">8 gates · 35 slabs retired</text>
  <rect x="500" y="133" width="955" height="540" rx="18" fill="#182d3b" stroke="#38546a" stroke-width="2"/>
  <text x="530" y="176" fill="#edf4fa" font-family="Arial,sans-serif" font-size="25" font-weight="700">After · cut, bridge, and overlap</text>
  <text x="530" y="207" fill="#efbd58" font-family="Arial,sans-serif" font-size="16">Each opening ends outside the gate footprint; short bridge pieces meet the building sides.</text>
  <path d="M570 404 H768" stroke="#d39d32" stroke-width="30"/><path d="M1130 404 H1381" stroke="#d39d32" stroke-width="30"/>
  <path d="M768 404 L828 356" stroke="#e6b44f" stroke-width="26"/><path d="M1130 404 L1072 356" stroke="#e6b44f" stroke-width="26"/>
  <rect x="828" y="302" width="244" height="205" rx="12" fill="#313f50" stroke="#dce6ec" stroke-width="3"/>
  <path d="M876 488 Q950 365 1024 488" fill="#101b2b" stroke="#efbd58" stroke-width="6"/>
  <path d="M785 404 L835 404 M1065 404 L1115 404" stroke="#6fd1b5" stroke-width="9" stroke-linecap="round"/>
  <text x="850" y="278" fill="#edf4fa" font-family="Arial,sans-serif" font-size="18" font-weight="700">saved gate Blueprint</text>
  <text x="546" y="580" fill="#b9c9d8" font-family="Arial,sans-serif" font-size="17">99 generated fit pieces · 474 wall actors total</text>
  <text x="546" y="610" fill="#b9c9d8" font-family="Arial,sans-serif" font-size="17">4 m proxy width · 5 m above modern R16 · 1 m embedded</text>
  <g font-family="Arial,sans-serif" font-size="16"><text x="1190" y="580" fill="#6fd1b5">●</text><text x="1210" y="580" fill="#e4edf2">building contact</text><text x="1190" y="608" fill="#d39d32">●</text><text x="1210" y="608" fill="#e4edf2">retained wall</text></g>
  <rect x="45" y="705" width="1410" height="112" rx="14" fill="#273246" stroke="#ad7937" stroke-width="2"/>
  <text x="70" y="741" fill="#ffd58d" font-family="Arial,sans-serif" font-size="19" font-weight="700">Validation</text>
  <text x="245" y="741" fill="#e7eef4" font-family="Arial,sans-serif" font-size="17">Fresh reload: 8 joins, 474 wall actors, zero bridge gaps, gate contact error &lt;0.001 cm, minimum vertical overlap 604.688 cm.</text>
  <text x="70" y="779" fill="#ffd58d" font-family="Arial,sans-serif" font-size="19" font-weight="700">Scope guard</text>
  <text x="245" y="779" fill="#e7eef4" font-family="Arial,sans-serif" font-size="17">All positions remain provisional; the 132.155 m affine uncertainty and modern ground remain unresolved.</text>
</svg>
