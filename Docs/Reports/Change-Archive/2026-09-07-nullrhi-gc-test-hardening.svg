<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">NullRHI forced-GC regression test hardening</title>
  <desc id="desc">The editor keep-flag false-positive risk is checked explicitly and removed from the collection policy before verifying reflected asset lifetime.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1d2d45"/>
    </linearGradient>
    <style>
      .bg { fill: url(#bg); }
      .panel { stroke-width: 2; rx: 16; }
      .risk { fill: #3b2530; stroke: #e57e92; }
      .guard { fill: #173c3c; stroke: #67d5b5; }
      .gate { fill: #213252; stroke: #8db4ff; }
      .title { fill: #f4f7ff; font: 700 30px Arial, sans-serif; }
      .subtitle { fill: #b6c5df; font: 16px Arial, sans-serif; }
      .head { fill: #ffffff; font: 700 20px Arial, sans-serif; }
      .body { fill: #edf3ff; font: 16px Arial, sans-serif; }
      .small { fill: #c5d4ed; font: 14px Arial, sans-serif; }
      .pass { fill: #9af0cb; font: 700 15px Arial, sans-serif; }
      .arrow { stroke: #a9bad8; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a9bad8"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="820"/>
  <text class="title" x="48" y="56">NullRHI forced-GC regression test hardening</text>
  <text class="subtitle" x="48" y="84">2026-09-07 · conditional review finding verified and narrowed to test validity</text>

  <rect class="panel risk" x="48" y="130" width="390" height="390"/>
  <text class="head" x="76" y="172">Review risk confirmed</text>
  <text class="body" x="76" y="218">Old collection policy</text>
  <text class="small" x="96" y="246">CollectGarbage(GARBAGE_COLLECTION_KEEPFLAGS)</text>
  <text class="small" x="96" y="270">maps to RF_Standalone in editor commandlets.</text>
  <text class="body" x="76" y="326">Possible false positive</text>
  <text class="small" x="96" y="354">Unreflected icon/material could survive</text>
  <text class="small" x="96" y="378">without AbilityInfoMap keeping it reachable.</text>
  <text class="small" x="76" y="444">Production UPROPERTY repair remains credible;</text>
  <text class="small" x="76" y="468">the gap was in the regression proof.</text>

  <path class="arrow" d="M 438 325 L 500 325"/>

  <rect class="panel guard" x="500" y="130" width="430" height="390"/>
  <text class="head" x="528" y="172">Hardened test path</text>
  <text class="body" x="528" y="218">1 · Load production metadata</text>
  <text class="small" x="548" y="246">JSON loader → strong RuntimeInfo</text>
  <text class="body" x="528" y="294">2 · Reject protected fixtures</text>
  <text class="small" x="548" y="322">Icon and material assert no keep flags.</text>
  <text class="body" x="528" y="370">3 · Collect with RF_NoFlags</text>
  <text class="small" x="548" y="398">Full purge cannot retain RF_Standalone</text>
  <text class="small" x="548" y="422">as an independent lifetime shortcut.</text>
  <text class="body" x="528" y="470">4 · Verify reflected reachability</text>
  <text class="small" x="548" y="498">Validity, identity, and paths remain readable.</text>

  <path class="arrow" d="M 930 325 L 992 325"/>

  <rect class="panel gate" x="992" y="130" width="360" height="390"/>
  <text class="head" x="1020" y="172">Validation gates</text>
  <text class="pass" x="1020" y="224">PASS · Aura build</text>
  <text class="pass" x="1020" y="260">PASS · focused GC test 1/1</text>
  <text class="small" x="1040" y="284">zero warnings/errors</text>
  <text class="pass" x="1020" y="328">PASS · metadata suite 6/6</text>
  <text class="pass" x="1020" y="364">PASS · launcher matrix 6/6</text>
  <text class="small" x="1020" y="420">Production map remains transient.</text>
  <text class="small" x="1020" y="448">No persistence or Blueprint change.</text>

  <rect x="48" y="590" width="1304" height="150" rx="16" fill="#121d31" stroke="#354a70" stroke-width="2"/>
  <text class="head" x="76" y="632">Result</text>
  <text class="body" x="76" y="674">The packet's remaining concern was a real test-design risk.</text>
  <text class="small" x="76" y="704">The regression now proves shipped assets survive a no-keep-flags full purge through the reflected metadata map.</text>
</svg>
