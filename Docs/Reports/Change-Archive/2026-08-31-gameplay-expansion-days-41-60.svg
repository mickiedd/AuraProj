<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1250" viewBox="0 0 1440 1250" role="img" aria-labelledby="title desc">
<title id="title">AuraProj Days 41–60: from a working loop to replayable gameplay</title>
<desc id="desc">Planning-only change. Before: combat, economy and recovery exist but replay choices and packaged proof are limited. Planned: missions, enemy counterplay, role builds, rescue, supplies, boss and durable rewards. Separate run, encounter, combat and persistence owners, with technical, human and performance gates.</desc>
