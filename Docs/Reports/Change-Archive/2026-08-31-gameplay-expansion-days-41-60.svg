<text x="60" y="395" font-size="17" fill="#334155" font-weight="400"></text>
<text x="60" y="421" font-size="17" fill="#334155" font-weight="400">Gaps to address</text>
<text x="60" y="447" font-size="17" fill="#334155" font-weight="400">• Few mission / replay decisions</text>
<text x="60" y="473" font-size="17" fill="#334155" font-weight="400">• Enemy AI ownership ambiguity</text>
<text x="60" y="499" font-size="17" fill="#334155" font-weight="400">• Fixture reward is civilian-kill gold</text>
<text x="60" y="525" font-size="17" fill="#334155" font-weight="400">• Packaged gates not fully proven</text></g>
<text x="470" y="205" font-size="21" fill="#0f766e" font-weight="700">AFTER  /  proposed 12–18 minute expedition</text>
