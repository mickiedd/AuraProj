<text x="40" y="633" font-size="23" fill="#132b3b" font-weight="700">ARCHITECTURE  /  optimize ownership before increasing content</text>
<g><rect x="40" y="658" width="435" height="172" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60" y="690" font-size="21" fill="#132b3b" font-weight="700">Mission owns progress</text><text x="60" y="723" font-size="17" fill="#334155" font-weight="400">One run ID / epoch / revision</text>
<text x="60" y="749" font-size="17" fill="#334155" font-weight="400">Objective reducers, entry and settlement</text>
<text x="60" y="775" font-size="17" fill="#334155" font-weight="400">Public snapshot; private owner choices</text>
<text x="60" y="801" font-size="17" fill="#334155" font-weight="400">GameMode stays a bootstrap / router</text></g>
<g><rect x="500" y="658" width="440" height="172" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="520" y="690" font-size="21" fill="#132b3b" font-weight="700">Encounter owns threats</text><text x="520" y="723" font-size="17" fill="#334155" font-weight="400">Spawn leases and hard enemy budgets</text>
<text x="520" y="749" font-size="17" fill="#334155" font-weight="400">One active AI driver per enemy</text>
<text x="520" y="775" font-size="17" fill="#334155" font-weight="400">Battle rules still authorize all damage</text>
<text x="520" y="801" font-size="17" fill="#334155" font-weight="400">Civilian manager retains civilian lifetime</text></g>
<g><rect x="965" y="658" width="435" height="172" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="985" y="690" font-size="21" fill="#132b3b" font-weight="700">Profile owns durable value</text><text x="985" y="723" font-size="17" fill="#334155" font-weight="400">Run ammo / effects never leak into saves</text>
<text x="985" y="749" font-size="17" fill="#334155" font-weight="400">Reconnect retains spent resources</text>
<text x="985" y="775" font-size="17" fill="#334155" font-weight="400">Batch manifest commits payouts once</text>
<text x="985" y="801" font-size="17" fill="#334155" font-weight="400">Legacy profile and evidence stay intact</text></g>
<text x="40" y="878" font-size="23" fill="#132b3b" font-weight="700">20 LOGICAL GATES  /  three early playable checkpoints</text>
