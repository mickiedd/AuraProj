<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">Finished DayPlan mind-map archive change</title>
  <desc id="desc">A manually authored before and after diagram showing scattered completed-day evidence becoming an indexed archive of four detailed mind maps, with evidence-based inclusion guards and validation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#edf3f8"/></linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17324d" flood-opacity="0.16"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#39749d"/></marker>
    <style>
      .title{font:700 32px Segoe UI,Arial,sans-serif;fill:#17324d}.subtitle{font:400 16px Segoe UI,Arial,sans-serif;fill:#557086}
      .cardtitle{font:700 21px Segoe UI,Arial,sans-serif;fill:#17324d}.body{font:400 15px Segoe UI,Arial,sans-serif;fill:#294c64}.small{font:400 13px Segoe UI,Arial,sans-serif;fill:#557086}
      .label{font:700 12px Segoe UI,Arial,sans-serif;fill:#fff;letter-spacing:1px}.daylabel{font:700 12px Segoe UI,Arial,sans-serif;fill:#294c64;letter-spacing:1px}.darkbody{font:400 15px Segoe UI,Arial,sans-serif;fill:#fff}.darksmall{font:400 13px Segoe UI,Arial,sans-serif;fill:#d9efff}.line{stroke:#39749d;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="1080" fill="url(#bg)"/>
  <text x="70" y="58" class="title">New archive: finished DayPlans as detailed mind maps</text>
  <text x="70" y="88" class="subtitle">2026-08-13 | manually authored from numbered plans, implementation evidence, reports, runners, and retained tests</text>

  <rect x="70" y="135" width="500" height="300" rx="22" fill="#fffdf7" stroke="#d3a44f" stroke-width="2" filter="url(#shadow)"/>
  <rect x="70" y="135" width="500" height="44" rx="22" fill="#ad7922"/><text x="96" y="163" class="label">BEFORE</text>
  <text x="96" y="220" class="cardtitle">Finished-day knowledge was scattered</text>
  <text x="96" y="258" class="body">• numbered plans described completion contracts</text>
  <text x="96" y="286" class="body">• dated reports held runtime/test evidence</text>
  <text x="96" y="314" class="body">• Git day maps summarized calendar changes</text>
  <text x="96" y="342" class="body">• the master/index header stopped at Day 02</text>
  <text x="96" y="382" class="small">A newcomer had to reconcile several sources and could</text>
  <text x="96" y="403" class="small">mistake future day contracts for completed behavior.</text>

  <path d="M570 285 C680 285 690 285 790 285" class="line"/>
  <rect x="640" y="226" width="270" height="118" rx="20" fill="#28658e" filter="url(#shadow)"/>
  <text x="677" y="262" class="label">EVIDENCE RECONCILIATION</text>
  <text x="677" y="292" class="darkbody">plan + commit + tests + runner</text>
  <text x="677" y="319" class="darksmall">open checks stay visible</text>

  <rect x="900" y="135" width="830" height="300" rx="22" fill="#f5fbf7" stroke="#6ca887" stroke-width="2" filter="url(#shadow)"/>
  <rect x="900" y="135" width="830" height="44" rx="22" fill="#39845d"/><text x="926" y="163" class="label">AFTER: DOCS/REPORTS/DAYPLAN-ARCHIVE</text>
  <text x="926" y="220" class="cardtitle">One indexed completion view per finished milestone</text>
  <rect x="926" y="250" width="180" height="112" rx="15" fill="#eef6fb" stroke="#7aa5c2"/><text x="948" y="280" class="daylabel">DAY 01</text><text x="948" y="310" class="body">Baseline</text><text x="948" y="338" class="small">conditional</text>
  <rect x="1122" y="250" width="180" height="112" rx="15" fill="#eef8fa" stroke="#72a3ab"/><text x="1144" y="280" class="daylabel">DAY 02</text><text x="1144" y="310" class="body">Identity</text><text x="1144" y="338" class="small">complete</text>
  <rect x="1318" y="250" width="180" height="112" rx="15" fill="#f4f3ff" stroke="#8f8dc2"/><text x="1340" y="280" class="daylabel">DAY 03</text><text x="1340" y="310" class="body">Rules/state</text><text x="1340" y="338" class="small">complete</text>
  <rect x="1514" y="250" width="180" height="112" rx="15" fill="#fff4f1" stroke="#bd7e72"/><text x="1536" y="280" class="daylabel">DAY 04</text><text x="1536" y="310" class="body">Damage</text><text x="1536" y="338" class="small">complete</text>
  <text x="926" y="397" class="small">Each entry: detailed SVG + Markdown record + sources + validation + carryover.</text>

  <path d="M900 435 L900 495" class="line"/>
  <rect x="70" y="510" width="520" height="385" rx="22" fill="#f4f9fd" stroke="#7aa5c2" stroke-width="2" filter="url(#shadow)"/>
  <rect x="70" y="510" width="520" height="44" rx="22" fill="#39749d"/><text x="96" y="538" class="label">MIND-MAP CONTENT CONTRACT</text>
  <text x="96" y="597" class="cardtitle">Every map answers the same human questions</text>
  <text x="96" y="638" class="body">What was the day's intent?</text>
  <text x="96" y="672" class="body">What problem or baseline existed?</text>
  <text x="96" y="706" class="body">What flow was implemented?</text>
  <text x="96" y="740" class="body">What authority, safety, or idempotence guard matters?</text>
  <text x="96" y="774" class="body">Which tests and topologies prove the result?</text>
  <text x="96" y="808" class="body">What work honestly carries forward?</text>
  <text x="96" y="856" class="small">A human can understand the behavior without reading a diff.</text>

  <rect x="640" y="510" width="520" height="385" rx="22" fill="#fffdf7" stroke="#d3a44f" stroke-width="2" filter="url(#shadow)"/>
  <rect x="640" y="510" width="520" height="44" rx="22" fill="#ad7922"/><text x="666" y="538" class="label">INCLUSION GUARD</text>
  <text x="666" y="597" class="cardtitle">Completion is evidence-driven</text>
  <text x="666" y="638" class="body">✓ Day 01 included, but clearly labeled conditional</text>
  <text x="666" y="672" class="body">✓ Days 02–04 backed by code, tests, and runners</text>
  <text x="666" y="706" class="body">✓ Day 04 inventory debt closes the Day 01 handoff</text>
  <text x="666" y="740" class="body">✕ Days 05–20 are not pre-created or implied complete</text>
  <text x="666" y="774" class="body">✕ A written plan alone is not implementation evidence</text>
  <text x="666" y="822" class="small">Future completion adds a new immutable day record.</text>

  <rect x="1210" y="510" width="520" height="385" rx="22" fill="#f5fbf7" stroke="#6ca887" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1210" y="510" width="520" height="44" rx="22" fill="#39845d"/><text x="1236" y="538" class="label">VALIDATION</text>
  <text x="1236" y="597" class="cardtitle">Archive structure and evidence checked</text>
  <text x="1236" y="638" class="body">✓ 4 detailed SVGs rendered and inspected</text>
  <text x="1236" y="672" class="body">✓ SVG XML parses cleanly</text>
  <text x="1236" y="706" class="body">✓ Markdown and local links resolve</text>
  <text x="1236" y="740" class="body">✓ status reconciled: Day 05 is next</text>
  <text x="1236" y="774" class="body">✓ 2026-08-13 Aura suite: 35 tests, exit 0</text>
  <text x="1236" y="808" class="body">✓ Day 03/04 Listen and Dedicated reports pass</text>
  <text x="1236" y="856" class="small">Final repository check: git diff --check and archive links.</text>

  <rect x="70" y="935" width="1660" height="90" rx="18" fill="#eef6fb" stroke="#7aa5c2" stroke-width="2"/>
  <text x="98" y="972" class="cardtitle">Navigation result</text>
  <text x="98" y="1003" class="body">Docs index → DayPlan Archive index → one finished-day mind map + record → source plan/report. Calendar change maps remain separate.</text>
  <text x="70" y="1058" class="small">Scattered evidence → guarded completion set → four hand-authored visual records → searchable archive</text>
</svg>
