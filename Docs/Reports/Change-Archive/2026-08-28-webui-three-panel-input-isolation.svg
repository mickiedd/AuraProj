<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Aura HUD three-panel WebUI and level input isolation</title>
  <desc id="desc">Before and after flow showing one full-screen browser replaced by bounded left-top, right-top, and bottom WebViews, with native level mouse input preserved outside those regions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#75d9ff"/></marker>
    <style>
      .bg{fill:#08111f}.title{font:700 28px Arial,sans-serif;fill:#eef7ff}.subtitle{font:15px Arial,sans-serif;fill:#a9bfd6}.section{font:700 19px Arial,sans-serif;fill:#ffd66b}.label{font:700 14px Arial,sans-serif;fill:#eef7ff}.body{font:14px Arial,sans-serif;fill:#c5d6e8}.small{font:12px Arial,sans-serif;fill:#9eb1c8}.before{fill:#241d2b;stroke:#d96b86;stroke-width:2}.after{fill:#112a36;stroke:#65dcff;stroke-width:2}.game{fill:#162337;stroke:#6e87a3;stroke-width:2}.panel{fill:#173e51;stroke:#65dcff;stroke-width:2}.intent{fill:#3b2f16;stroke:#ffd66b;stroke-width:2}.bad{stroke:#d96b86;stroke-width:3;stroke-dasharray:8 6;fill:none}.good{stroke:#65dcff;stroke-width:3;fill:none;marker-end:url(#arrow)}.code{font:13px Consolas,monospace;fill:#b9eaff}.check{fill:#a7f3c4;font:700 14px Arial,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text x="52" y="50" class="title">Gameplay HUD: three bounded WebViews</text>
  <text x="52" y="78" class="subtitle">The browser only owns visible HUD regions; the uncovered level keeps native mouse hit testing.</text>

  <text x="70" y="125" class="section">BEFORE</text>
  <rect x="52" y="145" width="500" height="300" rx="14" class="before"/>
  <text x="78" y="180" class="label">AAuraHUD</text>
  <rect x="78" y="198" width="448" height="205" rx="10" class="game"/>
  <text x="222" y="226" class="body">level viewport</text>
  <rect x="90" y="239" width="424" height="148" rx="6" fill="#2c3140" stroke="#d96b86" stroke-width="2"/>
  <text x="190" y="260" class="code">WebUI/hud.html</text>
  <text x="164" y="283" class="small">one full-screen UWebBrowser</text>
  <path d="M 305 307 C 370 335, 404 352, 430 370" class="bad"/>
  <text x="112" y="350" class="body">blank page pointerdown</text>
  <text x="112" y="373" class="body">synthesized gameplay LMB</text>
  <text x="78" y="430" class="small">Transparent CSS did not remove the Slate/CEF hit surface.</text>

  <path d="M 568 294 L 632 294" class="good"/>
  <text x="580" y="272" class="small">split + bound</text>

  <text x="660" y="125" class="section">AFTER</text>
  <rect x="648" y="145" width="500" height="300" rx="14" class="after"/>
  <text x="674" y="180" class="label">AAuraHUD at z-order 200</text>
  <rect x="674" y="198" width="448" height="205" rx="10" class="game"/>
  <text x="854" y="226" class="body">level viewport</text>
  <rect x="688" y="212" width="128" height="55" rx="7" class="panel"/><text x="700" y="235" class="small">left-top</text><text x="700" y="253" class="code">progress</text>
  <rect x="982" y="212" width="128" height="55" rx="7" class="panel"/><text x="993" y="235" class="small">right-top</text><text x="993" y="253" class="code">menus</text>
  <rect x="720" y="350" width="356" height="42" rx="7" class="panel"/><text x="805" y="376" class="small">bottom: vitals + skill buttons</text>
  <text x="835" y="300" class="check">native click path</text>
  <path d="M 910 312 L 910 340" class="good"/>
  <text x="674" y="430" class="small">Each UWebUIWidget has its own HTML, socket client, and viewport slot.</text>

  <text x="70" y="490" class="section">INPUT / LAYOUT GUARDS</text>
  <rect x="52" y="515" width="1096" height="175" rx="14" fill="#0d1c2d" stroke="#304d69" stroke-width="2"/>
  <rect x="78" y="545" width="300" height="112" rx="9" class="panel"/>
  <text x="98" y="575" class="label">Normal play</text>
  <text x="98" y="600" class="body">Bounded regions consume only</text>
  <text x="98" y="622" class="body">HUD clicks; blank level clicks</text>
  <text x="98" y="644" class="code">stay native.</text>
  <path d="M 392 601 L 452 601" class="good"/>
  <rect x="462" y="545" width="300" height="112" rx="9" class="intent"/>
  <text x="482" y="575" class="label">Intentional overlays</text>
  <text x="482" y="600" class="body">Menus and interaction prompts</text>
  <text x="482" y="622" class="body">temporarily expand their owner</text>
  <text x="482" y="644" class="code">then return to bounds.</text>
  <path d="M 776 601 L 836 601" class="good"/>
  <rect x="846" y="545" width="276" height="112" rx="9" fill="#142a22" stroke="#78d6a3" stroke-width="2"/>
  <text x="866" y="575" class="label">Validation</text>
  <text x="866" y="600" class="check">Build passed</text>
  <text x="866" y="622" class="check">4/4 plugin tests</text>
  <text x="866" y="644" class="check">2/2 HUD tests + JS check</text>
</svg>
