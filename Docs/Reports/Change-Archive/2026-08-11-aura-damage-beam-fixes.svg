<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc">
  <title id="title">Aura damage and modular beam fixes</title>
  <desc id="desc">Before and after diagram showing safe damage actor validation, beam target eligibility filtering, dead target pruning, replacement, and regression tests.</desc>
  <defs>
    <style>
      .title { font: 700 32px "Segoe UI", Arial, sans-serif; fill: #f7fbff; }
      .subtitle { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #a7b7cc; }
      .section { font: 700 21px "Segoe UI", Arial, sans-serif; fill: #f7fbff; }
      .label { font: 700 15px "Segoe UI", Arial, sans-serif; fill: #dbe7f5; }
      .body { font: 400 15px "Segoe UI", Arial, sans-serif; fill: #dbe7f5; }
      .small { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #a7b7cc; }
      .card { fill: #131d2d; stroke-width: 2; }
      .before { stroke: #e56b72; }
      .after { stroke: #54d49b; }
      .tests { stroke: #62a6ef; }
      .node { fill: #1c2a3d; stroke: #3b506b; stroke-width: 1.5; }
      .bug { fill: #3b202b; stroke: #e56b72; stroke-width: 1.5; }
      .fix { fill: #16392f; stroke: #54d49b; stroke-width: 1.5; }
      .test { fill: #182f4a; stroke: #62a6ef; stroke-width: 1.5; }
      .arrow { stroke: #54d49b; stroke-width: 2.5; fill: none; marker-end: url(#arrow-green); }
      .bug-arrow { stroke: #e56b72; stroke-width: 2.5; fill: none; marker-end: url(#arrow-red); }
      .muted-arrow { stroke: #71839a; stroke-width: 2; fill: none; marker-end: url(#arrow-muted); }
    </style>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#54d49b" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e56b72" />
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#71839a" />
    </marker>
  </defs>

  <rect width="1400" height="940" fill="#0b1220" />
  <text x="60" y="58" class="title">Aura damage &amp; modular beam fixes</text>
  <text x="60" y="88" class="subtitle">The recent regressions are blocked at the boundary, then covered by focused tests.</text>

  <!-- Before -->
  <rect x="60" y="120" width="395" height="390" rx="18" class="card before" />
  <text x="88" y="158" class="section">Before: failure paths</text>
  <text x="88" y="183" class="small">What the recent commits could allow</text>

  <rect x="88" y="207" width="118" height="54" rx="10" class="node" />
  <text x="147" y="230" text-anchor="middle" class="label">ASC object</text>
  <text x="147" y="249" text-anchor="middle" class="small">exists</text>
  <path d="M206 234 L224 234" class="bug-arrow" />
  <rect x="224" y="207" width="112" height="54" rx="10" class="bug" />
  <text x="280" y="230" text-anchor="middle" class="label">GetAvatarActor()</text>
  <text x="280" y="249" text-anchor="middle" class="small">unchecked</text>
  <path d="M336 234 L354 234" class="bug-arrow" />
  <rect x="354" y="207" width="74" height="54" rx="10" class="bug" />
  <text x="391" y="230" text-anchor="middle" class="label">assert</text>
  <text x="391" y="249" text-anchor="middle" class="small">/ crash</text>
  <text x="88" y="292" class="small">Damage params</text>

  <rect x="88" y="314" width="118" height="54" rx="10" class="node" />
  <text x="147" y="337" text-anchor="middle" class="label">Radius actors</text>
  <text x="147" y="356" text-anchor="middle" class="small">all candidates</text>
  <path d="M206 341 L224 341" class="bug-arrow" />
  <rect x="224" y="314" width="112" height="54" rx="10" class="bug" />
  <text x="280" y="337" text-anchor="middle" class="label">No CanDamage</text>
  <text x="280" y="356" text-anchor="middle" class="small">filter</text>
  <path d="M336 341 L354 341" class="bug-arrow" />
  <rect x="354" y="314" width="74" height="54" rx="10" class="bug" />
  <text x="391" y="337" text-anchor="middle" class="label">slot</text>
  <text x="391" y="356" text-anchor="middle" class="small">wasted</text>
  <text x="88" y="399" class="small">Beam target selection</text>

  <rect x="88" y="421" width="118" height="54" rx="10" class="node" />
  <text x="147" y="444" text-anchor="middle" class="label">Valid pointer</text>
  <text x="147" y="463" text-anchor="middle" class="small">still alive</text>
  <path d="M206 448 L224 448" class="bug-arrow" />
  <rect x="224" y="421" width="112" height="54" rx="10" class="bug" />
  <text x="280" y="444" text-anchor="middle" class="label">Weak check only</text>
  <text x="280" y="463" text-anchor="middle" class="small">dead state missed</text>
  <path d="M336 448 L354 448" class="bug-arrow" />
  <rect x="354" y="421" width="74" height="54" rx="10" class="bug" />
  <text x="391" y="444" text-anchor="middle" class="label">dead</text>
  <text x="391" y="463" text-anchor="middle" class="small">beam</text>

  <!-- After -->
  <rect x="485" y="120" width="855" height="390" rx="18" class="card after" />
  <text x="513" y="158" class="section">After: guarded flows</text>
  <text x="513" y="183" class="small">Safe validation, eligibility, pruning, and replacement</text>

  <!-- Damage flow -->
  <text x="513" y="215" class="label">Damage boundary</text>
  <rect x="513" y="229" width="150" height="54" rx="10" class="node" />
  <text x="588" y="252" text-anchor="middle" class="label">ASC + target</text>
  <text x="588" y="271" text-anchor="middle" class="small">incoming params</text>
  <path d="M663 256 L684 256" class="arrow" />
  <rect x="684" y="229" width="153" height="54" rx="10" class="fix" />
  <text x="760" y="252" text-anchor="middle" class="label">Safe avatar lookup</text>
  <text x="760" y="271" text-anchor="middle" class="small">no unsafe assert</text>
  <path d="M837 256 L858 256" class="arrow" />
  <rect x="858" y="229" width="165" height="54" rx="10" class="fix" />
  <text x="940" y="252" text-anchor="middle" class="label">Validate actor info</text>
  <text x="940" y="271" text-anchor="middle" class="small">+ authority/rules</text>
  <path d="M1023 256 L1044 256" class="arrow" />
  <rect x="1044" y="229" width="268" height="54" rx="10" class="fix" />
  <text x="1178" y="252" text-anchor="middle" class="label">Reject safely OR apply effect</text>
  <text x="1178" y="271" text-anchor="middle" class="small">invalid input never reaches damage builder</text>

  <!-- Eligibility flow -->
  <text x="513" y="320" class="label">Beam target eligibility</text>
  <rect x="513" y="334" width="178" height="54" rx="10" class="node" />
  <text x="602" y="357" text-anchor="middle" class="label">Primary + chain</text>
  <text x="602" y="376" text-anchor="middle" class="small">candidate actors</text>
  <path d="M691 361 L712 361" class="arrow" />
  <rect x="712" y="334" width="206" height="54" rx="10" class="fix" />
  <text x="815" y="357" text-anchor="middle" class="label">CanDamage eligibility</text>
  <text x="815" y="376" text-anchor="middle" class="small">friendly/protected filtered</text>
  <path d="M918 361 L939 361" class="arrow" />
  <rect x="939" y="334" width="185" height="54" rx="10" class="fix" />
  <text x="1031" y="357" text-anchor="middle" class="label">Eligible chain only</text>
  <text x="1031" y="376" text-anchor="middle" class="small">slots match visuals</text>
  <path d="M1124 361 L1145 361" class="arrow" />
  <rect x="1145" y="334" width="167" height="54" rx="10" class="node" />
  <text x="1229" y="357" text-anchor="middle" class="label">Replace invalid?</text>
  <text x="1229" y="376" text-anchor="middle" class="small">flag now honored</text>

  <!-- Pruning flow -->
  <text x="513" y="425" class="label">Beam pruning</text>
  <rect x="513" y="439" width="145" height="54" rx="10" class="node" />
  <text x="586" y="462" text-anchor="middle" class="label">Prune loop</text>
  <text x="586" y="481" text-anchor="middle" class="small">every update</text>
  <path d="M658 466 L679 466" class="arrow" />
  <rect x="679" y="439" width="201" height="54" rx="10" class="fix" />
  <text x="780" y="462" text-anchor="middle" class="label">Weak + dead-state check</text>
  <text x="780" y="481" text-anchor="middle" class="small">direct/native-safe query</text>
  <path d="M880 466 L901 466" class="arrow" />
  <rect x="901" y="439" width="164" height="54" rx="10" class="fix" />
  <text x="983" y="462" text-anchor="middle" class="label">Remove + destroy</text>
  <text x="983" y="481" text-anchor="middle" class="small">stale beam is gone</text>
  <path d="M1065 466 L1086 466" class="arrow" />
  <rect x="1086" y="439" width="226" height="54" rx="10" class="fix" />
  <text x="1199" y="462" text-anchor="middle" class="label">Optional reacquire target</text>
  <text x="1199" y="481" text-anchor="middle" class="small">closest eligible + new visual</text>

  <!-- Test coverage -->
  <rect x="60" y="545" width="1280" height="330" rx="18" class="card tests" />
  <text x="88" y="584" class="section">Regression coverage added</text>
  <text x="88" y="609" class="small">Each issue now has a focused test; the smoke run completed with 25 passed and 0 failed.</text>

  <rect x="88" y="635" width="584" height="76" rx="12" class="test" />
  <text x="110" y="662" class="label">DamageEffectParams</text>
  <text x="110" y="686" class="body">Bare ASC / invalid actor info is rejected without a crash.</text>
  <circle cx="642" cy="673" r="12" fill="#54d49b" />
  <path d="M636 673 L641 678 L650 666" stroke="#0b1220" stroke-width="3" fill="none" />

  <rect x="700" y="635" width="584" height="76" rx="12" class="test" />
  <text x="722" y="662" class="label">ModularBeamTargetEligibility</text>
  <text x="722" y="686" class="body">Friendly or protected candidates no longer consume chain slots.</text>
  <circle cx="1254" cy="673" r="12" fill="#54d49b" />
  <path d="M1248 673 L1253 678 L1262 666" stroke="#0b1220" stroke-width="3" fill="none" />

  <rect x="88" y="735" width="584" height="76" rx="12" class="test" />
  <text x="110" y="762" class="label">ModularBeamTargetPruning</text>
  <text x="110" y="786" class="body">A live pointer that enters the dead state is removed and stops its beam.</text>
  <circle cx="642" cy="773" r="12" fill="#54d49b" />
  <path d="M636 773 L641 778 L650 766" stroke="#0b1220" stroke-width="3" fill="none" />

  <rect x="700" y="735" width="584" height="76" rx="12" class="test" />
  <text x="722" y="762" class="label">ModularBeamTargetReplacement</text>
  <text x="722" y="786" class="body">When replacement is enabled, the next eligible target refills the slot.</text>
  <circle cx="1254" cy="773" r="12" fill="#54d49b" />
  <path d="M1248 773 L1253 778 L1262 766" stroke="#0b1220" stroke-width="3" fill="none" />

  <line x1="88" y1="838" x2="1284" y2="838" stroke="#2b415d" />
  <circle cx="102" cy="855" r="6" fill="#e56b72" />
  <text x="116" y="860" class="small">previous failure path</text>
  <circle cx="294" cy="855" r="6" fill="#54d49b" />
  <text x="308" y="860" class="small">new guard or behavior</text>
  <circle cx="496" cy="855" r="6" fill="#62a6ef" />
  <text x="510" y="860" class="small">regression test</text>
  <text x="1284" y="860" text-anchor="end" class="small">25 smoke tests: 25 passed</text>
</svg>
