<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Day 7 to Day 9 test coverage gate</title>
  <desc id="desc">A validation flow showing the 25 named native tests, strengthened runtime probes, and the remaining packaged cook gate.</desc>
  <rect width="1200" height="760" fill="#101827"/>
  <text x="60" y="64" fill="#f8fafc" font-family="Segoe UI, Arial" font-size="30" font-weight="700">Day 7-9 test coverage gate</text>
  <text x="60" y="96" fill="#a7b4c8" font-family="Segoe UI, Arial" font-size="16">Exact inventory, runtime topology, and evidence checks</text>

  <rect x="60" y="140" width="320" height="210" rx="16" fill="#172338" stroke="#3b82f6" stroke-width="2"/>
  <text x="84" y="178" fill="#93c5fd" font-family="Segoe UI, Arial" font-size="21" font-weight="700">Native automation</text>
  <text x="84" y="218" fill="#f8fafc" font-family="Segoe UI, Arial" font-size="18">Day 7: 10 / 10</text>
  <text x="84" y="248" fill="#f8fafc" font-family="Segoe UI, Arial" font-size="18">Day 8: 6 / 6</text>
  <text x="84" y="278" fill="#f8fafc" font-family="Segoe UI, Arial" font-size="18">Day 9: 9 / 9</text>
  <text x="84" y="320" fill="#a7b4c8" font-family="Segoe UI, Arial" font-size="15">25 exact plan paths; log exit code 0</text>

  <rect x="440" y="140" width="320" height="210" rx="16" fill="#172338" stroke="#22c55e" stroke-width="2"/>
  <text x="464" y="178" fill="#86efac" font-family="Segoe UI, Arial" font-size="21" font-weight="700">Runtime probes</text>
  <text x="464" y="218" fill="#f8fafc" font-family="Segoe UI, Arial" font-size="18">Day 8 Listen + Dedicated</text>
  <text x="464" y="248" fill="#f8fafc" font-family="Segoe UI, Arial" font-size="18">Day 9 Listen + Dedicated</text>
  <text x="464" y="290" fill="#a7b4c8" font-family="Segoe UI, Arial" font-size="15">ASC / identity / empty grants</text>
  <text x="464" y="316" fill="#a7b4c8" font-family="Segoe UI, Arial" font-size="15">3 canonical slots + late client</text>

  <rect x="820" y="140" width="320" height="210" rx="16" fill="#172338" stroke="#f59e0b" stroke-width="2"/>
  <text x="844" y="178" fill="#fcd34d" font-family="Segoe UI, Arial" font-size="21" font-weight="700">Guard strengthened</text>
  <text x="844" y="218" fill="#f8fafc" font-family="Segoe UI, Arial" font-size="17">Quoted automation command</text>
  <text x="844" y="246" fill="#f8fafc" font-family="Segoe UI, Arial" font-size="17">Success-count enforcement</text>
  <text x="844" y="274" fill="#f8fafc" font-family="Segoe UI, Arial" font-size="17">Duplicate-finalize probe</text>
  <text x="844" y="316" fill="#a7b4c8" font-family="Segoe UI, Arial" font-size="15">No process-exit-only false green</text>

  <path d="M380 245 H440 M760 245 H820" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="60" y="420" width="1080" height="250" rx="16" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <text x="88" y="462" fill="#f8fafc" font-family="Segoe UI, Arial" font-size="21" font-weight="700">Release evidence</text>
  <circle cx="96" cy="510" r="8" fill="#22c55e"/>
  <text x="118" y="516" fill="#dbeafe" font-family="Segoe UI, Arial" font-size="17">AuraEditor Win64 Development build: PASS</text>
  <circle cx="96" cy="550" r="8" fill="#22c55e"/>
  <text x="118" y="556" fill="#dbeafe" font-family="Segoe UI, Arial" font-size="17">Static config/source contracts and git diff check: PASS</text>
  <circle cx="96" cy="590" r="8" fill="#22c55e"/>
  <text x="118" y="596" fill="#dbeafe" font-family="Segoe UI, Arial" font-size="17">Listen/Dedicated runtime reports: PASS for Days 8 and 9</text>
  <circle cx="96" cy="630" r="8" fill="#f59e0b"/>
  <text x="118" y="636" fill="#fde68a" font-family="Segoe UI, Arial" font-size="17">Packaged BuildCookRun: not counted; bounded engine compile timeout remains</text>
