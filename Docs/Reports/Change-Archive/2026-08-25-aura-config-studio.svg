<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Aura Config Studio before and after</title>
  <desc id="desc">Before and after diagram showing Content Config JSON files gaining an embedded HTML and JavaScript editor backed by a safe C++ bridge with validation, version checks, atomic writes, and backups.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0a1020"/><stop offset="1" stop-color="#15243c"/></linearGradient>
    <linearGradient id="after" x1="0" x2="1"><stop stop-color="#173951"/><stop offset="1" stop-color="#17463f"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".32"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#83b7ff"/></marker>
    <style>
      .title{font:700 30px Segoe UI,Arial;fill:#f3f7ff}.sub{font:400 15px Segoe UI,Arial;fill:#a9b9d6}.head{font:700 19px Segoe UI,Arial;fill:#e9f0ff}.body{font:400 14px Segoe UI,Arial;fill:#d3def3}.small{font:400 12px Segoe UI,Arial;fill:#aab9d3}.code{font:600 13px Consolas,monospace;fill:#bfe0ff}.box{stroke:#344767;stroke-width:1.5;rx:14;filter:url(#shadow)}.before{fill:#20283a}.after{fill:url(#after)}.node{fill:#14263a;stroke:#5a9cca;stroke-width:1.2;rx:10}.guard{fill:#203a35;stroke:#56bb91;stroke-width:1.2;rx:9}.warn{fill:#3d3030;stroke:#d47b87;stroke-width:1.2;rx:9}.test{fill:#1f3c35;stroke:#5bc396;stroke-width:1.5;rx:12}
    </style>
  </defs>
  <rect width="1500" height="900" fill="url(#bg)"/>
  <text x="54" y="55" class="title">Aura Config Studio: Content/Config becomes an interactive authoring surface</text>
  <text x="54" y="84" class="sub">Embedded HTML/JavaScript UI on the existing AuraWebUI bridge, with C++ ownership of every file operation</text>

  <rect x="54" y="124" width="420" height="424" class="box before"/>
  <text x="82" y="164" class="head">Before: config editing was file-first</text>
  <rect x="82" y="192" width="364" height="105" class="warn"/>
  <text x="105" y="224" class="code">Content/Config/*.json</text>
  <text x="105" y="250" class="small">RoleConfig, LevelConfig, BattleZones,</text>
  <text x="105" y="271" class="small">PopulationSpawnTable, and other data files</text>
  <rect x="82" y="322" width="364" height="105" class="node"/>
  <text x="105" y="354" class="head">Manual text-editor workflow</text>
  <text x="105" y="381" class="small">No searchable project list</text>
  <text x="105" y="402" class="small">No structured editing or write guard</text>
  <text x="82" y="477" class="body">Runtime systems parsed files independently.</text>
  <text x="82" y="503" class="small">Editing was possible, but the project had no visual</text>
  <text x="82" y="522" class="small">inspection surface or shared save safety boundary.</text>

  <path d="M494 336 H548" stroke="#83b7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="487" y="315" class="small">add editor boundary</text>

  <rect x="572" y="124" width="874" height="424" class="box after"/>
  <text x="602" y="164" class="head">After: embedded Config Studio</text>
  <rect x="602" y="192" width="254" height="112" class="node"/>
  <text x="626" y="225" class="head">HTML + JavaScript</text>
  <text x="626" y="251" class="code">config-editor.html</text>
  <text x="626" y="274" class="small">file search, tree editor, Raw JSON</text>
  <path d="M856 248 H894" stroke="#83b7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="894" y="192" width="238" height="112" class="node"/>
  <text x="918" y="225" class="head">Loopback bridge</text>
  <text x="918" y="251" class="code">config_list/read/save</text>
  <text x="918" y="274" class="small">request-correlated events</text>
  <path d="M1132 248 H1170" stroke="#83b7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1170" y="192" width="244" height="112" class="guard"/>
  <text x="1194" y="225" class="head">C++ service</text>
  <text x="1194" y="251" class="code">FWebUIConfigService</text>
  <text x="1194" y="274" class="small">discover, parse, write</text>

  <rect x="602" y="337" width="812" height="170" class="guard"/>
  <text x="628" y="371" class="head">Native safety and persistence path</text>
  <text x="628" y="400" class="body">relative .json path</text><text x="812" y="400" class="small">-&gt; containment check under Content/Config</text>
  <text x="628" y="428" class="body">submitted JSON</text><text x="812" y="428" class="small">-&gt; parse + object/array root check + 8 MB limit</text>
  <text x="628" y="456" class="body">content version</text><text x="812" y="456" class="small">-&gt; reject stale external changes before writing</text>
  <text x="628" y="484" class="body">safe write</text><text x="812" y="484" class="small">-&gt; save .bak, write temp, atomically replace</text>

  <rect x="54" y="588" width="1392" height="184" class="box" fill="#111b2f"/>
  <text x="82" y="627" class="head">Interactive behavior</text>
  <rect x="82" y="651" width="285" height="78" class="node"/>
  <text x="104" y="681" class="code">AuraWebUI.ConfigEditor</text>
  <text x="104" y="706" class="small">open in PIE/game with local player</text>
  <rect x="397" y="651" width="285" height="78" class="node"/>
  <text x="419" y="681" class="code">select + inspect</text>
  <text x="419" y="706" class="small">14 discovered project configs</text>
  <rect x="712" y="651" width="285" height="78" class="node"/>
  <text x="734" y="681" class="code">edit + Ctrl/Cmd+S</text>
  <text x="734" y="706" class="small">dirty state and local parse feedback</text>
  <rect x="1027" y="651" width="387" height="78" class="node"/>
  <text x="1049" y="681" class="code">config_saved / config_error</text>
  <text x="1049" y="706" class="small">success, backup path, or conflict explanation</text>

  <rect x="54" y="806" width="1392" height="60" class="test"/>
  <text x="82" y="833" class="head">Validation</text>
  <text x="242" y="833" class="body">AuraEditor + Aura builds passed · 4/4 AuraWebUI automation tests passed · JavaScript syntax parse passed · git diff --check passed</text>
</svg>
