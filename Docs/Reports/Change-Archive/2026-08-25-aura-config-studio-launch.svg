<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Aura Config Studio deferred launch flow</title>
  <desc id="desc">The command line launch flag waits for a local player world before attaching the Config Studio web widget.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#91a7c0"/>
    </marker>
    <style>
      .bg { fill: #101827; }
      .box { fill: #18283b; stroke: #5f7894; stroke-width: 2; rx: 12; }
      .guard { fill: #2d253f; stroke: #ad8ce0; stroke-width: 2; rx: 12; }
      .good { fill: #173b36; stroke: #55c2a4; stroke-width: 2; rx: 12; }
      .text { fill: #eef5ff; font: 16px Arial, sans-serif; text-anchor: middle; }
      .small { fill: #b8c8da; font: 13px Arial, sans-serif; text-anchor: middle; }
      .arrow { stroke: #91a7c0; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1100" height="430"/>
  <text x="550" y="38" class="text" style="font-size:22px;font-weight:bold">Config Studio launch: deterministic world readiness</text>
  <rect x="40" y="145" width="190" height="100" class="box"/>
  <text x="135" y="182" class="text">Launch game</text>
  <text x="135" y="208" class="small">-AuraConfigEditor</text>
  <text x="135" y="228" class="small">StartupMap</text>
  <path d="M230 195 H300" class="arrow"/>
  <rect x="305" y="130" width="210" height="130" class="guard"/>
  <text x="410" y="168" class="text">Deferred ticker</text>
  <text x="410" y="194" class="small">wait until GEngine</text>
  <text x="410" y="214" class="small">has a local player</text>
  <text x="410" y="234" class="small">(no startup race)</text>
  <path d="M515 195 H585" class="arrow"/>
  <rect x="590" y="145" width="190" height="100" class="box"/>
  <text x="685" y="182" class="text">Attach widget</text>
  <text x="685" y="208" class="small">config-editor.html</text>
  <text x="685" y="228" class="small">WebSocket bridge</text>
  <path d="M780 195 H850" class="arrow"/>
  <rect x="855" y="145" width="205" height="100" class="good"/>
  <text x="957" y="182" class="text">Config Studio open</text>
  <text x="957" y="208" class="small">browse / edit / save</text>
  <text x="957" y="228" class="small">Content/Config/*.json</text>
  <text x="550" y="330" class="small">Validation: AuraEditor + Aura Development builds, focused AuraWebUI automation suite, and null-RHI launch log.</text>
  <text x="550" y="355" class="small">Environment note: this host has no usable D3D11/D3D12 GPU, so null-RHI verifies native startup but cannot display rendered pixels.</text>
</svg>
