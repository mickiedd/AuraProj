<rect width="1200" height="760" fill="#101923"/>
<style>
text{font-family:Segoe UI,Arial,sans-serif;fill:#ecf2f8}.title{font-size:29px;font-weight:600}.sub{font-size:17px;fill:#b7c7d8}.label{font-size:20px;font-weight:600}.small{font-size:16px}.before{fill:#273442;stroke:#5c7287;stroke-width:2}.after{fill:#164740;stroke:#59c9ac;stroke-width:2}.guard{fill:#59452d;stroke:#e0b96d;stroke-width:2}
