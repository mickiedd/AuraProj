<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#111827"/>
  <text x="60" y="58" fill="#f9fafb" font-family="Arial, sans-serif" font-size="30" font-weight="700">Great South Gate · high-fidelity import</text>
  <text x="60" y="92" fill="#9ca3af" font-family="Arial, sans-serif" font-size="16">Z-up GLB → shared Nanite scene → isolated UE5.5 preview level</text>

  <g font-family="Arial, sans-serif">
    <rect x="60" y="145" width="285" height="225" rx="14" fill="#1f2937" stroke="#60a5fa" stroke-width="2"/>
    <text x="85" y="183" fill="#93c5fd" font-size="19" font-weight="700">Source package</text>
    <text x="85" y="217" fill="#e5e7eb" font-size="15">GreatSouthGate…HighFidelity.glb</text>
    <text x="85" y="250" fill="#d1d5db" font-size="15">112 meshes · 12,196 nodes</text>
    <text x="85" y="278" fill="#d1d5db" font-size="15">179,312 stored triangles</text>
    <text x="85" y="306" fill="#d1d5db" font-size="15">7 materials · 17 embedded maps</text>
    <text x="85" y="345" fill="#fbbf24" font-size="14">Authored Z-up</text>

    <rect x="455" y="145" width="290" height="225" rx="14" fill="#1f2937" stroke="#34d399" stroke-width="2"/>
    <text x="480" y="183" fill="#6ee7b7" font-size="19" font-weight="700">Interchange glTF</text>
    <text x="480" y="217" fill="#e5e7eb" font-size="15">Scene hierarchy import</text>
    <text x="480" y="250" fill="#d1d5db" font-size="15">bake_meshes = false</text>
    <text x="480" y="278" fill="#d1d5db" font-size="15">combine_static_meshes = false</text>
    <text x="480" y="306" fill="#d1d5db" font-size="15">Nanite = enabled</text>
    <text x="480" y="334" fill="#fbbf24" font-size="14">roll −90° · collision off</text>

    <rect x="855" y="145" width="285" height="225" rx="14" fill="#1f2937" stroke="#c084fc" stroke-width="2"/>
    <text x="880" y="183" fill="#d8b4fe" font-size="19" font-weight="700">Project result</text>
    <text x="880" y="217" fill="#e5e7eb" font-size="15">112 shared .uasset meshes</text>
    <text x="880" y="245" fill="#e5e7eb" font-size="15">7 materials · 17 textures</text>
    <text x="880" y="273" fill="#e5e7eb" font-size="15">12,195 mesh scene actors</text>
    <text x="880" y="301" fill="#e5e7eb" font-size="15">2700 × 1705 × 2303 cm</text>
    <text x="880" y="338" fill="#86efac" font-size="14">Preview map isolated from showcase</text>

    <path d="M345 258 L455 258" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M745 258 L855 258" stroke="#6ee7b7" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="60" y="445" width="1080" height="190" rx="14" fill="#0f172a" stroke="#374151" stroke-width="2"/>
    <text x="85" y="483" fill="#f9fafb" font-size="19" font-weight="700">Guards and evidence</text>
    <circle cx="92" cy="520" r="7" fill="#34d399"/><text x="112" y="526" fill="#d1d5db" font-size="15">Existing GreatSouthGate asset and L_showcase_level preserved</text>
    <circle cx="92" cy="553" r="7" fill="#34d399"/><text x="112" y="559" fill="#d1d5db" font-size="15">Shared-geometry check: 12,195 actors reference 112 static mesh assets</text>
    <circle cx="92" cy="586" r="7" fill="#34d399"/><text x="112" y="592" fill="#d1d5db" font-size="15">Automated validation: Nanite, materials, bounds, grounding, orientation — PASS</text>
    <circle cx="92" cy="619" r="7" fill="#34d399"/><text x="112" y="625" fill="#d1d5db" font-size="15">Visual check: rendered preview capture saved under Saved/RawModelImport</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d1d5db"/>
    </marker>
  </defs>
</svg>
