<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">AuraProj daily change reference for 2026-07-12</title><desc id="desc">Headless automation, crouch animation, and test plugin.</desc><defs><linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eaf2f9"/></linearGradient><style>.t{font:700 26px Segoe UI,Arial;fill:#17324d}.s{font:400 15px Segoe UI,Arial;fill:#47657e}.h{font:700 18px Segoe UI,Arial;fill:#17324d}.b{font:400 15px Segoe UI,Arial;fill:#25475f}.l{font:700 12px Segoe UI,Arial;fill:white;letter-spacing:1px}</style></defs><rect width="1200" height="700" fill="url(#bg)"/><text x="50" y="52" class="t">2026-07-12 - Headless automation and crouch animation</text><text x="50" y="80" class="s">main | 5 commits: 28eb13e, 040ac0f, 2440fa9, 12bd5a0, 006d868</text><rect x="50" y="110" width="1100" height="70" rx="14" fill="white" stroke="#7aa5c2"/><text x="75" y="140" class="h">Daily job</text><text x="190" y="140" class="b">Make multiplayer testing possible without a visible client and finish the rename/animation path.</text><text x="75" y="164" class="s">Automation, NullRHI launch, test control, animation content, and BehaviorU glue changed together.</text><rect x="50" y="215" width="335" height="245" rx="16" fill="white" stroke="#7aa5c2"/><rect x="50" y="215" width="335" height="38" rx="16" fill="#2d668f"/><text x="72" y="240" class="l">BEFORE</text><text x="72" y="290" class="h">Visible-client test dependency</text><text x="72" y="322" class="b">No structured XML-driven test runner.</text><text x="72" y="348" class="b">No clean stopped-run status.</text><text x="72" y="384" class="b">No headless login/transfer path.</text><text x="72" y="420" class="b">Crouch animation and rename cleanup</text><text x="72" y="446" class="b">were incomplete.</text><path d="M385 337 L430 337" stroke="#2d668f" stroke-width="3"/><rect x="430" y="215" width="720" height="245" rx="16" fill="#f5fbf7" stroke="#6ca887"/><rect x="430" y="215" width="720" height="38" rx="16" fill="#39845d"/><text x="452" y="240" class="l">AFTER</text><text x="452" y="290" class="h">Headless, reportable, and animated</text><text x="452" y="322" class="b">AuraAutoTest loads XML, runs agents/nodes, and writes structured reports.</text><text x="452" y="348" class="b">StopRun and Aborted distinguish a stopped run from a completed failure.</text><text x="452" y="384" class="b">NullRHI auto-login, TransferToRandomPlayer, and RunClientNullRHI.bat support clients.</text><text x="452" y="410" class="b">ABP_Aura gains crouch/crouch-walk states; BehaviorU names are completed.</text><text x="452" y="444" class="s">Guard: XML defines the test; the plugin executes it; NullRHI supplies the client.</text><rect x="50" y="500" width="520" height="130" rx="16" fill="#fffdf7" stroke="#d3a44f"/><text x="75" y="535" class="h">Important guard</text><text x="75" y="565" class="b">Aborted is not a normal test failure.</text><text x="75" y="590" class="b">Headless targeting and login need explicit fallbacks;</text><text x="75" y="615" class="b">a missing cursor is an environment condition.</text><rect x="600" y="500" width="550" height="130" rx="16" fill="#f2f8ff" stroke="#7aa5c2"/><text x="625" y="535" class="h">Validation / newcomer path</text><text x="625" y="565" class="b">Follow XML -> AuraAutoTest -> report, then NullRHI</text><text x="625" y="590" class="b">client launch. Animation changes live in ABP_Aura and</text><text x="625" y="615" class="b">AuraCharacterAnimInstance.</text></svg>
