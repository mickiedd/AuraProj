<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040" role="img" aria-labelledby="title desc">
  <title id="title">Aura gameplay expansion Day 46A deterministic contract harness</title>
  <desc id="desc">A before and after diagram showing isolated Days 42 through 45 gameplay authorities composed by a test-only deterministic event harness, with generation, source-life, driver-owner, and terminal cleanup guards plus validation gates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef4fa"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e2f0ff"/>
      <stop offset="1" stop-color="#c8e2fb"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e7f8ef"/>
      <stop offset="1" stop-color="#cbeedc"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff4d8"/>
      <stop offset="1" stop-color="#ffe5a3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#16405e" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#397398"/>
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a8a5b"/>
    </marker>
    <style>
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #12334a; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4c6475; }
      .section { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #234b64; letter-spacing: 0.4px; }
      .boxTitle { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #163a52; }
      .body { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #315468; }
      .small { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #587180; }
      .tiny { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #607b8c; }
      .guardTitle { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #19523a; }
      .guardBody { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #3a6b55; }
      .deferTitle { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #7a4b12; }
      .deferBody { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #795b2e; }
      .pill { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect width="1500" height="1040" fill="url(#bg)"/>
  <rect x="40" y="32" width="1420" height="976" rx="24" fill="#ffffff" stroke="#d6e6f0"/>

  <text x="78" y="82" class="title">Day 46A · Deterministic Contract Harness</text>
  <text x="78" y="113" class="subtitle">Compose the real Days 42–45 authority seams into a replayable, value-only validation boundary.</text>
  <rect x="1195" y="62" width="216" height="38" rx="19" fill="#dff3e8" stroke="#93d4b0"/>
  <text x="1303" y="87" text-anchor="middle" class="pill" fill="#26744d">INERT · TEST ONLY</text>

  <text x="78" y="157" class="section">Before → after</text>

  <rect x="78" y="177" width="420" height="230" rx="16" fill="#f6f9fc" stroke="#b9cbd7" stroke-dasharray="7 6"/>
  <text x="104" y="211" class="boxTitle">Before: isolated contracts</text>
  <text x="104" y="237" class="body">Days 42–45 already guard their own state, but</text>
  <text x="104" y="258" class="body">there is no shared deterministic replay surface.</text>
  <rect x="104" y="281" width="170" height="45" rx="10" fill="#ffffff" stroke="#b9cbd7"/>
  <text x="189" y="309" text-anchor="middle" class="small">Mission run</text>
  <rect x="294" y="281" width="170" height="45" rx="10" fill="#ffffff" stroke="#b9cbd7"/>
  <text x="379" y="309" text-anchor="middle" class="small">Attack timeline</text>
  <rect x="104" y="342" width="170" height="45" rx="10" fill="#ffffff" stroke="#b9cbd7"/>
  <text x="189" y="370" text-anchor="middle" class="small">Lease coordinator</text>
  <rect x="294" y="342" width="170" height="45" rx="10" fill="#ffffff" stroke="#b9cbd7"/>
  <text x="379" y="370" text-anchor="middle" class="small">Status / channel ledger</text>

  <path d="M518 292 C570 292 575 292 620 292" fill="none" stroke="#397398" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="568" y="274" text-anchor="middle" class="tiny">explicit event stream</text>

  <rect x="640" y="177" width="388" height="230" rx="16" fill="url(#blue)" stroke="#82b3d6" filter="url(#shadow)"/>
  <text x="668" y="211" class="boxTitle">After: Day 46A harness</text>
  <text x="668" y="237" class="body">One deterministic driver supplies:</text>
  <circle cx="679" cy="266" r="5" fill="#397398"/>
  <text x="694" y="271" class="body">RunId + epoch + encounter generation</text>
  <circle cx="679" cy="294" r="5" fill="#397398"/>
  <text x="694" y="299" class="body">Authority-issued identities and timestamps</text>
  <circle cx="679" cy="322" r="5" fill="#397398"/>
  <text x="694" y="327" class="body">Real mission, timeline, lease, status APIs</text>
  <circle cx="679" cy="350" r="5" fill="#397398"/>
  <text x="694" y="355" class="body">No world timers, input, movement, GAS, or damage</text>
  <rect x="668" y="371" width="326" height="22" rx="11" fill="#ffffff" fill-opacity="0.72"/>
  <text x="831" y="386" text-anchor="middle" class="tiny">private test tree only · no production/config edits</text>

  <path d="M1048 292 C1095 292 1100 292 1142 292" fill="none" stroke="#2a8a5b" stroke-width="3" marker-end="url(#greenArrow)"/>
  <text x="1095" y="274" text-anchor="middle" class="tiny">sorted snapshot</text>

  <rect x="1160" y="177" width="250" height="230" rx="16" fill="url(#green)" stroke="#8dcdac" filter="url(#shadow)"/>
  <text x="1186" y="211" class="boxTitle">Value-only receipt</text>
  <text x="1186" y="239" class="body">Identity</text>
  <text x="1280" y="239" class="small">Run / epoch / generation</text>
  <text x="1186" y="264" class="body">Mission</text>
  <text x="1280" y="264" class="small">phase / revision / cells</text>
  <text x="1186" y="289" class="body">Attack</text>
  <text x="1280" y="289" class="small">phase / key / deadlines</text>
  <text x="1186" y="314" class="body">Leases</text>
  <text x="1280" y="314" class="small">serials / tokens / owners</text>
  <text x="1186" y="339" class="body">Ledger</text>
  <text x="1280" y="339" class="small">statuses / channels</text>
  <text x="1186" y="378" class="guardTitle">same stream = same snapshot</text>

  <text x="78" y="448" class="section">Authoritative stream covered by the harness</text>
  <rect x="78" y="469" width="1332" height="126" rx="16" fill="#f9fcfe" stroke="#c7dae5"/>
  <line x1="120" y1="533" x2="1364" y2="533" stroke="#85a8ba" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <circle cx="150" cy="533" r="28" fill="#d8ebfa" stroke="#7eb0d3"/>
    <text x="150" y="529" text-anchor="middle" class="pill" fill="#285a7b">01</text>
    <text x="150" y="547" text-anchor="middle" class="tiny">cell death</text>
    <text x="150" y="581" text-anchor="middle" class="tiny">t=100</text>
  </g>
  <g>
    <circle cx="310" cy="533" r="28" fill="#d8ebfa" stroke="#7eb0d3"/>
    <text x="310" y="529" text-anchor="middle" class="pill" fill="#285a7b">02</text>
    <text x="310" y="547" text-anchor="middle" class="tiny">attack begin</text>
    <text x="310" y="581" text-anchor="middle" class="tiny">t=100</text>
  </g>
  <g>
    <circle cx="470" cy="533" r="28" fill="#d8ebfa" stroke="#7eb0d3"/>
    <text x="470" y="529" text-anchor="middle" class="pill" fill="#285a7b">03</text>
    <text x="470" y="547" text-anchor="middle" class="tiny">heavy lease</text>
    <text x="470" y="581" text-anchor="middle" class="tiny">t=100→101.5</text>
  </g>
  <g>
    <circle cx="630" cy="533" r="28" fill="#d8ebfa" stroke="#7eb0d3"/>
    <text x="630" y="529" text-anchor="middle" class="pill" fill="#285a7b">04</text>
    <text x="630" y="547" text-anchor="middle" class="tiny">support lease</text>
    <text x="630" y="581" text-anchor="middle" class="tiny">t=100→102</text>
  </g>
  <g>
    <circle cx="790" cy="533" r="28" fill="#d8ebfa" stroke="#7eb0d3"/>
    <text x="790" y="529" text-anchor="middle" class="pill" fill="#285a7b">05</text>
    <text x="790" y="547" text-anchor="middle" class="tiny">status + channel</text>
    <text x="790" y="581" text-anchor="middle" class="tiny">t=100</text>
  </g>
  <g>
    <circle cx="950" cy="533" r="28" fill="#d8ebfa" stroke="#7eb0d3"/>
    <text x="950" y="529" text-anchor="middle" class="pill" fill="#285a7b">06</text>
    <text x="950" y="547" text-anchor="middle" class="tiny">impact resolve</text>
    <text x="950" y="581" text-anchor="middle" class="tiny">t=100.85</text>
  </g>
  <g>
    <circle cx="1110" cy="533" r="28" fill="#d8ebfa" stroke="#7eb0d3"/>
    <text x="1110" y="529" text-anchor="middle" class="pill" fill="#285a7b">07</text>
    <text x="1110" y="547" text-anchor="middle" class="tiny">interrupt</text>
    <text x="1110" y="581" text-anchor="middle" class="tiny">t=100.5</text>
  </g>
  <g>
    <circle cx="1270" cy="533" r="28" fill="#d8ebfa" stroke="#7eb0d3"/>
    <text x="1270" y="529" text-anchor="middle" class="pill" fill="#285a7b">08</text>
    <text x="1270" y="547" text-anchor="middle" class="tiny">snapshot</text>
    <text x="1270" y="581" text-anchor="middle" class="tiny">sorted values</text>
  </g>

  <text x="78" y="639" class="section">Guards and convergence assertions</text>
  <rect x="78" y="660" width="316" height="132" rx="14" fill="url(#green)" stroke="#8dcdac"/>
  <text x="100" y="691" class="guardTitle">Generation barrier</text>
  <text x="100" y="718" class="guardBody">Old heavy/support leases invalidate</text>
  <text x="100" y="737" class="guardBody">before generation-two replacements.</text>
  <text x="100" y="767" class="guardBody">Repeat invalidation → zero removals.</text>

  <rect x="414" y="660" width="316" height="132" rx="14" fill="url(#green)" stroke="#8dcdac"/>
  <text x="436" y="691" class="guardTitle">Source-life barrier</text>
  <text x="436" y="718" class="guardBody">Replacement life cannot commit or</text>
  <text x="436" y="737" class="guardBody">release the prior life’s keyed state.</text>
  <text x="436" y="767" class="guardBody">Old and new channel identities coexist.</text>

  <rect x="750" y="660" width="316" height="132" rx="14" fill="url(#green)" stroke="#8dcdac"/>
  <text x="772" y="691" class="guardTitle">Driver ownership</text>
  <text x="772" y="718" class="guardBody">Legacy callbacks cannot commit,</text>
  <text x="772" y="737" class="guardBody">release, or update canonical leases.</text>
  <text x="772" y="767" class="guardBody">Only the recorded owner may mutate.</text>

  <rect x="1086" y="660" width="324" height="132" rx="14" fill="url(#green)" stroke="#8dcdac"/>
  <text x="1108" y="691" class="guardTitle">Terminal convergence</text>
  <text x="1108" y="718" class="guardBody">Cancelled attack reset is explicit;</text>
  <text x="1108" y="737" class="guardBody">expiry/removal/settlement repeat safely.</text>
  <text x="1108" y="767" class="guardBody">Stale storm leaves replacement snapshot.</text>

  <rect x="78" y="827" width="752" height="133" rx="14" fill="#f5fbf7" stroke="#a8d9bc"/>
  <text x="102" y="858" class="boxTitle">Validation performed / authored</text>
  <rect x="102" y="879" width="128" height="28" rx="14" fill="#dff3e8"/>
  <text x="166" y="898" text-anchor="middle" class="pill" fill="#26744d">OFFLINE 4/4</text>
  <text x="248" y="899" class="body">Day 46A source/config contracts</text>
  <rect x="102" y="917" width="128" height="28" rx="14" fill="#dff3e8"/>
  <text x="166" y="936" text-anchor="middle" class="pill" fill="#26744d">INHERITED 15/15</text>
  <text x="248" y="937" class="body">Days 42–43 (4/4) + Days 44–45 (11/11)</text>
  <text x="102" y="958" class="small">Native UE: 9/9 passed · UHT/UBT passed · queue-empty evidence verified · 0 warnings after 7 resaves.</text>

  <rect x="850" y="827" width="560" height="133" rx="14" fill="url(#amber)" stroke="#e2bb6d"/>
  <text x="874" y="858" class="deferTitle">Scope boundary / remaining gates</text>
  <text x="874" y="884" class="deferBody">Deferred: FocusShot, ShockTrap, Exposed consume/order, supplies,</text>
  <text x="874" y="903" class="deferBody">GAS/input/movement/damage wiring, profile activation, packaged clips.</text>
  <text x="874" y="930" class="deferBody">Full Day 46 remains Planned; runtime stays blocked by:</text>
  <text x="874" y="949" class="deferBody">DAY40_PACKAGED_EVIDENCE_MISSING · ANCHOR_SURVEY_UNVERIFIED</text>

  <text x="78" y="991" class="tiny">AuraProj · 2026-09-03 · authoritative timestamps only · deterministic snapshot excludes UObject addresses and hash iteration order</text>
</svg>
