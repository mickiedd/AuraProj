<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AuraWebUI automated test coverage</title>
  <desc id="desc">A diagram showing the two automated tests: content contract validation and a real loopback WebSocket handshake, masked command, native callback, and JSON response.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#17233d"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#76a9ff"/>
      <stop offset="1" stop-color="#4c78d9"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0" stop-color="#66e3a0"/>
      <stop offset="1" stop-color="#279c6b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9eb8ed"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="60" y="64" fill="#f2f6ff" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">AuraWebUI test coverage</text>
  <text x="60" y="96" fill="#aebddd" font-family="Segoe UI, Arial, sans-serif" font-size="16">A real browser-shaped transport test plus a packaged-content contract test</text>

  <rect x="60" y="145" width="1080" height="175" rx="18" fill="#111a2d" stroke="#385176" stroke-width="2" filter="url(#shadow)"/>
  <rect x="84" y="169" width="350" height="126" rx="12" fill="#1d3153" stroke="#5277b5"/>
  <text x="108" y="204" fill="#dce8ff" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">ContentContract</text>
  <text x="108" y="234" fill="#b8c9e8" font-family="Segoe UI, Arial, sans-serif" font-size="15">AuraWebUI.uplugin exists</text>
  <text x="108" y="258" fill="#b8c9e8" font-family="Segoe UI, Arial, sans-serif" font-size="15">index.html is loadable</text>
  <text x="108" y="282" fill="#b8c9e8" font-family="Segoe UI, Arial, sans-serif" font-size="15">URL + command contract intact</text>
  <path d="M456 232 H560" stroke="#9eb8ed" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="580" y="185" width="260" height="94" rx="12" fill="url(#green)"/>
  <text x="710" y="226" text-anchor="middle" fill="#071b16" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">PASS</text>
  <text x="710" y="253" text-anchor="middle" fill="#0a2d23" font-family="Segoe UI, Arial, sans-serif" font-size="15">Assets can ship with plugin</text>

  <rect x="60" y="360" width="1080" height="270" rx="18" fill="#111a2d" stroke="#385176" stroke-width="2" filter="url(#shadow)"/>
  <text x="88" y="402" fill="#dce8ff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">WebSocketLoopback</text>
  <text x="88" y="430" fill="#aebddd" font-family="Segoe UI, Arial, sans-serif" font-size="15">Port 18766 in the test; runtime default remains 18765</text>

  <rect x="88" y="465" width="175" height="92" rx="12" fill="#1d3153" stroke="#5277b5"/>
  <text x="175" y="502" text-anchor="middle" fill="#dce8ff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">TCP client</text>
  <text x="175" y="529" text-anchor="middle" fill="#b8c9e8" font-family="Segoe UI, Arial, sans-serif" font-size="14">HTTP upgrade</text>
  <path d="M275 511 H350" stroke="#9eb8ed" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="370" y="465" width="205" height="92" rx="12" fill="#1d3153" stroke="#5277b5"/>
  <text x="472" y="502" text-anchor="middle" fill="#dce8ff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Native server</text>
  <text x="472" y="529" text-anchor="middle" fill="#b8c9e8" font-family="Segoe UI, Arial, sans-serif" font-size="14">101 + hello frame</text>
  <path d="M587 511 H662" stroke="#9eb8ed" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="682" y="465" width="205" height="92" rx="12" fill="#1d3153" stroke="#5277b5"/>
  <text x="784" y="502" text-anchor="middle" fill="#dce8ff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Masked JSON</text>
  <text x="784" y="529" text-anchor="middle" fill="#b8c9e8" font-family="Segoe UI, Arial, sans-serif" font-size="14">command → callback</text>
  <path d="M899 511 H974" stroke="#9eb8ed" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="994" y="465" width="118" height="92" rx="12" fill="url(#green)"/>
  <text x="1053" y="502" text-anchor="middle" fill="#071b16" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">PASS</text>
  <text x="1053" y="529" text-anchor="middle" fill="#0a2d23" font-family="Segoe UI, Arial, sans-serif" font-size="13">response frame</text>

  <text x="88" y="600" fill="#aebddd" font-family="Segoe UI, Arial, sans-serif" font-size="14">Build validation: AuraEditor + AuraServer Development</text>
  <text x="88" y="621" fill="#aebddd" font-family="Segoe UI, Arial, sans-serif" font-size="14">Automation result: 3 tests discovered, 3 passed, exit code 0</text>
</svg>
