<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Day 7 through Day 9 role and Civilian population implementation</title>
  <desc id="desc">Before and after flow showing validated role data, the server-owned population manager, Civilian initialization, deterministic member state, and validation evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="after" x1="0" x2="1"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#93c5fd"/></marker>
    <style>
      .title{font:700 30px Arial;fill:#f8fafc}.sub{font:400 16px Arial;fill:#cbd5e1}.head{font:700 18px Arial;fill:#f8fafc}.body{font:400 15px Arial;fill:#e2e8f0}.small{font:400 13px Arial;fill:#cbd5e1}.before{fill:#2b1720;stroke:#fb7185;stroke-width:2}.after{fill:url(#after);stroke:#86efac;stroke-width:2}.neutral{fill:#172033;stroke:#60a5fa;stroke-width:2}.evidence{fill:#111827;stroke:#fbbf24;stroke-width:2}.line{stroke:#93c5fd;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <text x="60" y="62" class="title">Aura Role Battle — Days 7–9</text>
  <text x="60" y="92" class="sub">Role/package regression, role-derived Civilian actor, and deterministic server-owned population spawning</text>
  <rect x="60" y="130" width="1280" height="180" rx="18" class="before" filter="url(#shadow)"/>
  <text x="90" y="168" class="head">Before</text>
  <text x="90" y="202" class="body">Civilian existed only as a validated RoleConfig record.</text>
  <text x="90" y="230" class="body">No native Civilian shell owned GAS state; no versioned population table or deterministic member identity existed.</text>
  <text x="90" y="258" class="body">A population row could not reserve a stable slot, set role state before FinishSpawning, or replicate member metadata.</text>
  <text x="1080" y="208" class="head">Risk</text><text x="1080" y="238" class="small">player grants / weapon inheritance</text><text x="1080" y="262" class="small">ambiguous spawn ownership</text>
  <path d="M700 322 L700 360" class="line"/>
  <rect x="60" y="370" width="380" height="190" rx="16" class="neutral" filter="url(#shadow)"/>
  <text x="86" y="408" class="head">1 · InitGame</text><text x="86" y="440" class="body">RoleConfig publishes first.</text><text x="86" y="468" class="body">UAuraPopulationManager is created</text><text x="86" y="492" class="body">as a transient GameMode-owned object.</text><text x="86" y="528" class="small">Loads schema v1 tables; validates map, role,</text><text x="86" y="548" class="small">class, work profile, slot and respawn fields.</text>
  <rect x="510" y="370" width="380" height="190" rx="16" class="after" filter="url(#shadow)"/>
  <text x="536" y="408" class="head">2 · Deferred Civilian spawn</text><text x="536" y="440" class="body">Spawn volume supplies candidates only.</text><text x="536" y="468" class="body">Manager reserves MarketCivilians:slot.</text><text x="536" y="496" class="body">Before FinishSpawning:</text><text x="536" y="524" class="small">RequestedRoleId + six-field member state</text><text x="536" y="546" class="small">are assigned authority-side.</text>
  <rect x="960" y="370" width="380" height="190" rx="16" class="after" filter="url(#shadow)"/>
  <text x="986" y="408" class="head">3 · Actor initialization</text><text x="986" y="440" class="body">AAuraCivilian owns one ASC + AttributeSet.</text><text x="986" y="468" class="body">ApplyRoleAtSpawn commits identity, empty</text><text x="986" y="496" class="body">grant ledger and positive role attributes.</text><text x="986" y="524" class="small">No EnemyInterface, AI controller, player</text><text x="986" y="546" class="small">weapon, FireGun or offensive loadout.</text>
  <path d="M440 465 L500 465" class="line"/><path d="M890 465 L950 465" class="line"/><path d="M1150 575 L1150 625" class="line"/>
  <rect x="230" y="625" width="940" height="105" rx="16" class="after" filter="url(#shadow)"/>
  <text x="260" y="662" class="head">After · one authority registry</text><text x="260" y="690" class="body">InitialCount 3 → MarketCivilians:0, :1, :2 · generation guarded · failed reservations released · no Day 09 refill timer</text><text x="260" y="716" class="small">Replicated state: PopulationId, SlotIndex, MemberId, WorkProfileId, ZoneId, MerchantDefinitionId</text>
  <rect x="60" y="770" width="1280" height="90" rx="16" class="evidence" filter="url(#shadow)"/>
  <text x="88" y="804" class="head">Validation evidence</text><text x="88" y="832" class="body">AuraEditor build passed · Day 7/8/9 native automation passed · Day 8 and Day 9 Listen + Dedicated smoke passed · static JSON/UFS contracts passed</text><text x="88" y="852" class="small">Cook attempt recorded separately: UAT required a target split and exceeded the bounded 5-minute build window while compiling engine modules.</text>
</svg>
