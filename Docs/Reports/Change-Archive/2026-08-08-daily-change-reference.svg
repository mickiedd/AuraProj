<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">AuraProj daily change reference for 2026-08-08</title>
  <desc id="desc">Replicated server-owned combat identity and Day 2 network validation.</desc>
  <defs><linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eaf2f9"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#17324d" flood-opacity="0.16"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2d668f"/></marker><style>.title{font:700 28px Segoe UI,Arial,sans-serif;fill:#17324d}.subtitle{font:400 16px Segoe UI,Arial,sans-serif;fill:#47657e}.head{font:700 20px Segoe UI,Arial,sans-serif;fill:#17324d}.body{font:400 16px Segoe UI,Arial,sans-serif;fill:#25475f}.small{font:400 14px Segoe UI,Arial,sans-serif;fill:#47657e}.label{font:700 13px Segoe UI,Arial,sans-serif;fill:white;letter-spacing:1px}.line{stroke:#2d668f;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1400" height="820" fill="url(#bg)"/><text x="60" y="58" class="title">2026-08-08 - Replicated combat identity</text><text x="60" y="88" class="subtitle">main | commits 2abcfcb, 8721069 | manually reconstructed daily mind map</text>
  <rect x="60" y="115" width="1280" height="70" rx="16" fill="white" stroke="#7aa5c2" stroke-width="2"/><text x="85" y="145" class="head">Daily job</text><text x="220" y="145" class="body">Replace incidental Player/Enemy tags with an explicit identity boundary shared by runtime, AI, and network code.</text><text x="85" y="170" class="small">Identity component, gameplay tags, actor consumers, native tests, and a two-process smoke runner changed together.</text>
  <rect x="60" y="225" width="390" height="245" rx="18" fill="white" stroke="#7aa5c2" stroke-width="2" filter="url(#shadow)"/><rect x="60" y="225" width="390" height="40" rx="18" fill="#2d668f"/><text x="84" y="251" class="label">BEFORE</text><text x="84" y="302" class="head">Incidental actor meaning</text><text x="84" y="335" class="body">Relationship checks read Player/Enemy tags</text><text x="84" y="361" class="body">or controller fallback behavior.</text><text x="84" y="397" class="body">No replicated identity payload.</text><text x="84" y="433" class="small">AI targeting could select by legacy category</text><text x="84" y="454" class="small">instead of combat truth.</text>
  <path d="M450 345 C490 345 490 345 530 345" class="line"/><text x="454" y="322" class="small">make identity explicit</text>
  <rect x="530" y="225" width="810" height="245" rx="18" fill="#f5fbf7" stroke="#6ca887" stroke-width="2" filter="url(#shadow)"/><rect x="530" y="225" width="810" height="40" rx="18" fill="#39845d"/><text x="554" y="251" class="label">AFTER</text><text x="554" y="302" class="head">Server-owned identity truth</text><text x="554" y="335" class="body">FAuraCombatIdentity carries faction, control, profile, death policy, and explicit flags.</text><text x="554" y="361" class="body">UAuraCombatIdentityComponent replicates from server and validates initialization.</text><text x="554" y="387" class="body">IsNotFriend and FindNearestPlayer use valid identity, targetability, and faction.</text><text x="554" y="423" class="body">Native tags resolve after startup; Combat.Unassigned is an intentional transition profile.</text><text x="554" y="449" class="small">Affected paths: CharacterBase, Character, Enemy, AI query, ASC library, gameplay tags, tests.</text>
  <rect x="60" y="520" width="620" height="220" rx="18" fill="#fffdf7" stroke="#d3a44f" stroke-width="2"/><text x="86" y="559" class="head">Important guard</text><text x="86" y="594" class="body">Identity is server-owned and replicated. Missing or invalid</text><text x="86" y="620" class="body">identity is rejected and logged at a bounded rate; it is</text><text x="86" y="646" class="body">never silently reconstructed from display or controller tags.</text><text x="86" y="690" class="small">AI keeps its Player blackboard contract while changing its source of truth.</text>
  <rect x="720" y="520" width="620" height="220" rx="18" fill="#f2f8ff" stroke="#7aa5c2" stroke-width="2"/><text x="746" y="559" class="head">Validation and reading path</text><text x="746" y="594" class="body">Focused identity automation: 3/3.</text><text x="746" y="620" class="body">Full Aura regression: 17/17. Graph smoke: 22/22.</text><text x="746" y="646" class="body">Day 1 regression and server/client identity replication passed.</text><text x="746" y="690" class="small">Full evidence: Role-Battle-Day-02-Combat-Identity-2026-08-08.md.</text>
</svg>
