<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AuraWebUI plugin refactor</title>
  <desc id="desc">Before and after diagram showing web UI code moved out of the Aura game module into a standalone plugin, with build validation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#151d31"/></linearGradient>
    <linearGradient id="plugin" x1="0" x2="1"><stop stop-color="#19384d"/><stop offset="1" stop-color="#174844"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#83b7ff"/></marker>
    <style>
      .title{font:700 29px Segoe UI,Arial;fill:#f1f5ff}.sub{font:400 15px Segoe UI,Arial;fill:#aab7d4}.head{font:700 19px Segoe UI,Arial;fill:#e8eefc}.body{font:400 15px Segoe UI,Arial;fill:#d2dcf2}.small{font:400 13px Segoe UI,Arial;fill:#aab7d4}.code{font:600 14px Consolas,monospace;fill:#b9c8e8}.box{stroke:#34415f;stroke-width:1.5;rx:14;filter:url(#shadow)}.before{fill:#20283a}.after{fill:url(#plugin)}.test{fill:#203b36;stroke:#4fa77d;stroke-width:1.5;rx:12}
    </style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="52" y="56" class="title">AuraWebUI refactor: project-owned code → standalone runtime plugin</text>
  <text x="52" y="84" class="sub">Aura keeps UMG/GAS ownership; the web surface now has an independent module, content root, and public API</text>

  <rect x="52" y="120" width="430" height="360" class="box before"/>
  <text x="80" y="158" class="head">Before: coupled to Aura</text>
  <rect x="80" y="184" width="374" height="78" rx="10" fill="#151d31" stroke="#a35f72"/>
  <text x="104" y="216" class="code">Source/Aura</text>
  <text x="104" y="241" class="small">Build.cs + Aura.cpp + AuraHUD</text>
  <rect x="80" y="282" width="374" height="78" rx="10" fill="#151d31" stroke="#a35f72"/>
  <text x="104" y="314" class="code">Content/WebUI</text>
  <text x="104" y="339" class="small">HTML owned by the game project</text>
  <text x="80" y="409" class="body">Aura source directly created and toggled the web widget.</text>
  <text x="80" y="435" class="small">Reuse required copying project-level code and dependencies.</text>

  <path d="M502 300 H558" stroke="#83b7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="495" y="280" class="small">extract boundary</text>

  <rect x="582" y="120" width="566" height="438" class="box after"/>
  <text x="610" y="158" class="head">After: AuraWebUI plugin</text>
  <rect x="610" y="184" width="244" height="110" rx="10" fill="#142638" stroke="#5ec9aa"/>
  <text x="632" y="216" class="head">Runtime module</text>
  <text x="632" y="243" class="code">AuraWebUI</text>
  <text x="632" y="267" class="small">UMG + WebBrowserWidget</text>
  <text x="632" y="285" class="small">JSON bridge + socket transport</text>
  <rect x="882" y="184" width="238" height="110" rx="10" fill="#142638" stroke="#5ec9aa"/>
  <text x="904" y="216" class="head">Plugin content</text>
  <text x="904" y="243" class="code">Content/WebUI</text>
  <text x="904" y="267" class="small">index.html</text>
  <text x="904" y="285" class="small">non-UFS staged by plugin</text>
  <path d="M854 239 H882" stroke="#83b7ff" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="610" y="326" width="510" height="102" rx="10" fill="#142638" stroke="#5a98c2"/>
  <text x="632" y="358" class="head">Reusable public surface</text>
  <text x="632" y="385" class="code">UWebUIWidget  •  UWebUIBridgeSubsystem</text>
  <text x="632" y="409" class="small">Any game/module can create the widget or bind OnCommand</text>
  <path d="M732 294 V326" stroke="#83b7ff" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="610" y="458" width="510" height="70" rx="10" fill="#0d1828"/>
  <text x="632" y="487" class="code">AuraWebUI.Toggle</text>
  <text x="632" y="510" class="small">plugin-owned convenience command; no AAuraHUD dependency</text>

  <rect x="52" y="604" width="1096" height="70" class="test"/>
  <text x="78" y="633" class="head">Validation</text>
  <text x="78" y="657" class="body">AuraEditor Win64 Development passed  •  AuraServer Win64 Development passed  •  no Aura source-level Web UI ownership remains</text>
</svg>
