<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Guidemen realism upgrade</title>
  <desc id="desc">Before and after diagram showing the original single Guidemen mesh replaced by ten aligned, higher-density realism-upgrade pieces in the Scifi Desert level.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101b2d"/>
      <stop offset="1" stop-color="#182338"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e1d1ac"/>
      <stop offset="1" stop-color="#8b775d"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a6040"/>
      <stop offset="1" stop-color="#4a2a21"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#687586"/>
      <stop offset="1" stop-color="#293746"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#07101c" flood-opacity="0.55"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#68d5ff"/>
    </marker>
    <style>
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #f1f6ff; }
      .subtitle { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #a9bad1; }
      .panel { fill: #20304a; stroke: #405979; stroke-width: 2; }
      .panel-title { font: 700 21px 'Segoe UI', Arial, sans-serif; fill: #f1f6ff; }
      .body { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #d5e1ef; }
      .small { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #b5c7dc; }
      .mono { font: 400 13px Consolas, monospace; fill: #d5e1ef; }
      .good { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #7ce3a3; }
      .warn { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #ffd17c; }
      .chip { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: #112237; }
    </style>
  </defs>

  <rect width="1200" height="780" fill="url(#bg)"/>
  <text x="56" y="58" class="title">Guidemen realism upgrade — Scifi Desert</text>
  <text x="56" y="88" class="subtitle">Replacement package: Guidemen_UE5_RealismUpgrade.zip · 14,039,401 triangles · 1.30× prior geometry</text>

  <rect x="56" y="126" width="490" height="560" rx="16" class="panel"/>
  <text x="84" y="170" class="panel-title">Before</text>
  <text x="84" y="199" class="body">One combined imported mesh represented</text>
  <text x="84" y="223" class="body">the placed building.</text>
  <rect x="114" y="270" width="374" height="230" rx="10" fill="#a88b65" stroke="#e4ce9f" stroke-width="2"/>
  <g filter="url(#shadow)">
    <path d="M196 452 L196 346 L218 324 L218 302 L384 302 L406 324 L406 452 Z" fill="#66798c" stroke="#d7e1e9" stroke-width="2"/>
    <path d="M218 302 L384 302 L406 324 L240 324 Z" fill="#adbdc9" stroke="#d7e1e9" stroke-width="2"/>
    <path d="M222 350 L380 350" stroke="#b8915e" stroke-width="15"/>
    <path d="M236 380 L366 380" stroke="#3c4e60" stroke-width="18"/>
    <path d="M258 322 L258 448 M340 322 L340 448" stroke="#9d6a45" stroke-width="10"/>
  </g>
  <text x="301" y="542" text-anchor="middle" class="warn">SM_Guidemen</text>
  <text x="84" y="592" class="mono">/Game/.../Guidemen/SM_Guidemen</text>
  <text x="84" y="625" class="small">Single actor · imported PBR repair already applied</text>
  <text x="84" y="651" class="small">Level footprint: 3060 × 1394 × 1897 cm</text>

  <line x1="574" y1="405" x2="626" y2="405" stroke="#68d5ff" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="600" y="379" text-anchor="middle" class="small">import 10 GLBs</text>
  <text x="600" y="436" text-anchor="middle" class="small">replace actor</text>

  <rect x="654" y="126" width="490" height="560" rx="16" class="panel"/>
  <text x="682" y="170" class="panel-title">After</text>
  <text x="682" y="199" class="body">Ten aligned detail actors reconstruct the</text>
  <text x="682" y="223" class="body">same building at the same world transform.</text>
  <rect x="704" y="270" width="390" height="230" rx="10" fill="#a88b65" stroke="#e4ce9f" stroke-width="2"/>
  <g filter="url(#shadow)">
    <path d="M786 452 L786 348 L808 326 L808 304 L974 304 L996 326 L996 452 Z" fill="url(#stone)" stroke="#f0e5ce" stroke-width="2"/>
    <path d="M808 304 L974 304 L996 326 L830 326 Z" fill="url(#roof)" stroke="#d7e1e9" stroke-width="2"/>
    <path d="M814 350 L968 350" stroke="url(#wood)" stroke-width="16"/>
    <path d="M826 377 L956 377" stroke="url(#roof)" stroke-width="21"/>
    <path d="M842 324 L842 452 M922 324 L922 452" stroke="url(#wood)" stroke-width="11"/>
    <path d="M802 432 L980 432" stroke="#d7b56e" stroke-width="7"/>
    <circle cx="918" cy="342" r="8" fill="#e8c57a"/>
  </g>
  <rect x="714" y="524" width="120" height="25" rx="12" fill="#7ce3a3"/>
  <text x="774" y="542" text-anchor="middle" class="chip">8× NANITE</text>
  <rect x="846" y="524" width="140" height="25" rx="12" fill="#ffd17c"/>
  <text x="916" y="542" text-anchor="middle" class="chip">2× FULL GEO</text>
  <text x="682" y="592" class="good">Saved/reloaded · footprint preserved</text>
  <text x="682" y="620" class="mono">Location: (-140400, 110295, 100) cm</text>
  <text x="682" y="646" class="mono">Tag: ImportedGuidemenBuilding</text>
  <text x="682" y="672" class="small">Facade Nanite build exceeded the editor memory budget</text>

  <rect x="56" y="716" width="1088" height="44" rx="12" fill="#14273a" stroke="#365a70"/>
  <text x="80" y="744" class="good">Validation passed:</text>
  <text x="226" y="744" class="body">10/10 meshes · materials assigned · grounded · no external XY overlap · old actor removed</text>
</svg>
