<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">MilitaryWeapDark server cook fix</title>
  <desc id="desc">The role configuration references an assault rifle asset. DefaultGame.ini now always cooks the MilitaryWeapDark directory, and the Windows Server package contains the rifle asset and dependencies.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 16px Arial, sans-serif; fill: #475569; }
      .section { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 15px Arial, sans-serif; fill: #0f172a; }
      .body { font: 14px Arial, sans-serif; fill: #334155; }
      .mono { font: 13px Consolas, monospace; fill: #1e293b; }
      .bad { fill: #fef2f2; stroke: #ef4444; stroke-width: 2; }
      .fix { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .good { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .guard { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 8 7; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="title" x="48" y="52">Windows Server role-asset cook fix</text>
  <text class="subtitle" x="48" y="82">Loading → game travel was rejected because the authoritative role candidate could not load its weapon mesh.</text>

  <text class="section" x="48" y="130">Before</text>
  <rect class="bad" x="48" y="150" width="315" height="160" rx="12"/>
  <text class="label" x="70" y="182">RoleConfig.json</text>
  <text class="mono" x="70" y="211">/Game/MilitaryWeapDark/</text>
  <text class="mono" x="70" y="232">Weapons/Assault_Rifle_B</text>
  <text class="body" x="70" y="267">Asset exists in source Content/</text>
  <text class="body" x="70" y="289">but was not in the server cook set.</text>
  <rect class="bad" x="405" y="150" width="315" height="160" rx="12"/>
  <text class="label" x="427" y="182">Server PreLogin</text>
  <text class="body" x="427" y="215">Role candidate validation fails</text>
  <text class="body" x="427" y="237">weaponMesh cannot load</text>
  <text class="body" x="427" y="277">Client never travels to game level.</text>
  <path class="arrow dash" d="M363 230 L405 230"/>

  <text class="section" x="48" y="365">Fix and validation</text>
  <rect class="fix" x="48" y="385" width="315" height="190" rx="12"/>
  <text class="label" x="70" y="417">Config/DefaultGame.ini</text>
  <text class="mono" x="70" y="450">+DirectoriesToAlwaysCook=</text>
  <text class="mono" x="70" y="472">  (Path="/Game/</text>
  <text class="mono" x="70" y="494">  MilitaryWeapDark")</text>
  <text class="body" x="70" y="532">Explicit server cook inclusion</text>
  <text class="body" x="70" y="554">for the referenced role assets.</text>
  <rect class="guard" x="405" y="385" width="315" height="190" rx="12"/>
  <text class="label" x="427" y="417">BuildCookRun</text>
  <text class="body" x="427" y="450">Full WindowsServer cook completed</text>
  <text class="body" x="427" y="472">3,303/3,304 packages processed</text>
  <text class="body" x="427" y="508">Packaging rerun with complete</text>
  <text class="body" x="427" y="530">UE_5.5 engine metadata.</text>
  <text class="body" x="427" y="554">AutomationTool exit code 0</text>
  <path class="arrow" d="M363 480 L405 480"/>
  <rect class="good" x="762" y="385" width="390" height="190" rx="12"/>
  <text class="label" x="784" y="417">Cooked/staged result</text>
  <text class="body" x="784" y="450">Assault_Rifle_B.uasset + .uexp</text>
  <text class="body" x="784" y="472">Physics asset and skeleton included</text>
  <text class="body" x="784" y="508">Aura-WindowsServer.pak</text>
  <text class="body" x="784" y="530">Aura-WindowsServer.ucas/.utoc</text>
  <text class="body" x="784" y="554">freshly staged at 23:25</text>
  <path class="arrow" d="M720 480 L762 480"/>

  <rect class="good" x="48" y="620" width="1104" height="42" rx="10"/>
  <text class="label" x="70" y="647">Expected flow after deploying the fresh server stage: role validation succeeds → PreLogin accepts → client can travel from Loading to the game level.</text>
</svg>
