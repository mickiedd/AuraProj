<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">A Little Princess EPUB export</title>
  <desc id="desc">A visual summary of the reviewed Markdown manuscript being packaged as a valid text-first EPUB with a title page, nineteen chapter pages, navigation, package metadata, and archive checks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ed"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#26354a" flood-opacity=".16"/>
    </filter>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #18273b; }
      .subtitle { font: 400 17px 'Segoe UI', Arial, sans-serif; fill: #506176; }
      .label { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #18273b; }
      .body { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #33465e; }
      .small { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #53657b; }
      .metric { font: 700 23px 'Segoe UI', Arial, sans-serif; fill: #18273b; }
      .line { stroke: #b8c8d9; stroke-width: 3; fill: none; }
    </style>
  </defs>

  <rect width="1400" height="850" fill="url(#bg)"/>
  <rect x="34" y="28" width="1332" height="794" rx="24" fill="#ffffff" opacity=".74" stroke="#d8e2ec" stroke-width="2"/>

  <text x="72" y="84" class="title">A Little Princess · EPUB export</text>
  <text x="72" y="116" class="subtitle">Reviewed manuscript → text-first, navigable ebook · 2026-09-16</text>

  <rect x="72" y="160" width="334" height="310" rx="18" fill="#fff3df" stroke="#edc786" stroke-width="2" filter="url(#shadow)"/>
  <text x="104" y="208" class="label">Source manuscript</text>
  <text x="104" y="250" class="metric">19 chapters</text>
  <text x="104" y="282" class="body">58,741 words</text>
  <text x="104" y="309" class="body">3,004–3,344 words per chapter</text>
  <path d="M104 336 H374" class="line"/>
  <text x="104" y="370" class="body">A1–A2-oriented prose</text>
  <text x="104" y="397" class="body">reviewed for continuity and duplicates</text>
  <text x="104" y="438" class="small">Markdown headings become stable chapter IDs.</text>

  <path d="M420 315 H490" class="line"/>
  <path d="M476 303 L496 315 L476 327" fill="none" stroke="#b8c8d9" stroke-width="3"/>

  <rect x="506" y="160" width="388" height="310" rx="18" fill="#edf6ff" stroke="#9fc5e8" stroke-width="2" filter="url(#shadow)"/>
  <text x="538" y="208" class="label">EPUB assembly</text>
  <text x="538" y="253" class="body">1. title page XHTML</text>
  <text x="538" y="282" class="body">2. 19 chapter XHTML pages</text>
  <text x="538" y="311" class="body">3. CSS for readable ebook text</text>
  <text x="538" y="340" class="body">4. EPUB 3 navigation document</text>
  <text x="538" y="369" class="body">5. package metadata and spine</text>
  <path d="M538 396 H862" class="line"/>
  <text x="538" y="430" class="small">Reproducible builder kept outside project source.</text>

  <path d="M908 315 H978" class="line"/>
  <path d="M964 303 L984 315 L964 327" fill="none" stroke="#b8c8d9" stroke-width="3"/>

  <rect x="994" y="160" width="292" height="310" rx="18" fill="#effaf1" stroke="#a9d7b0" stroke-width="2" filter="url(#shadow)"/>
  <text x="1026" y="208" class="label">EPUB package</text>
  <text x="1026" y="253" class="metric">387,763 bytes</text>
  <text x="1026" y="286" class="body">mimetype first + stored</text>
  <text x="1026" y="313" class="body">19 chapter links</text>
  <text x="1026" y="340" class="body">title page present</text>
  <text x="1026" y="367" class="body">0 image assets</text>
  <text x="1026" y="409" class="small">No artwork was requested.</text>
  <text x="1026" y="432" class="small">No cover image is claimed.</text>

  <text x="72" y="532" class="label">Validated package anatomy</text>
  <path d="M120 655 H1280" class="line"/>
  <path d="M1246 643 L1284 655 L1246 667" fill="none" stroke="#b8c8d9" stroke-width="3"/>

  <g filter="url(#shadow)">
    <rect x="82" y="586" width="190" height="138" rx="14" fill="#f6c85f"/>
    <text x="177" y="625" text-anchor="middle" class="label">mimetype</text>
    <text x="177" y="654" text-anchor="middle" class="small">exact EPUB bytes</text>
    <text x="177" y="681" text-anchor="middle" class="small">uncompressed</text>
    <rect x="300" y="586" width="190" height="138" rx="14" fill="#8fc6e8"/>
    <text x="395" y="625" text-anchor="middle" class="label">container.xml</text>
    <text x="395" y="654" text-anchor="middle" class="small">rootfile points</text>
    <text x="395" y="681" text-anchor="middle" class="small">to content.opf</text>
    <rect x="518" y="586" width="190" height="138" rx="14" fill="#a7d6a8"/>
    <text x="613" y="625" text-anchor="middle" class="label">content.opf</text>
    <text x="613" y="654" text-anchor="middle" class="small">metadata + spine</text>
    <text x="613" y="681" text-anchor="middle" class="small">19 chapters</text>
    <rect x="736" y="586" width="190" height="138" rx="14" fill="#c8b5e8"/>
    <text x="831" y="625" text-anchor="middle" class="label">nav.xhtml</text>
    <text x="831" y="654" text-anchor="middle" class="small">title + chapter</text>
    <text x="831" y="681" text-anchor="middle" class="small">navigation links</text>
    <rect x="954" y="586" width="190" height="138" rx="14" fill="#f2b4b4"/>
    <text x="1049" y="625" text-anchor="middle" class="label">XHTML</text>
    <text x="1049" y="654" text-anchor="middle" class="small">XML parsed</text>
    <text x="1049" y="681" text-anchor="middle" class="small">20 pages total</text>
    <rect x="1172" y="586" width="160" height="138" rx="14" fill="#d8e2ec"/>
    <text x="1252" y="625" text-anchor="middle" class="label">checks</text>
    <text x="1252" y="654" text-anchor="middle" class="small">PASS</text>
    <text x="1252" y="681" text-anchor="middle" class="small">epubcheck unavailable</text>
  </g>

  <rect x="72" y="758" width="1214" height="34" rx="10" fill="#18273b"/>
  <text x="104" y="781" font-family="Segoe UI, Arial" font-size="14" fill="#f6f9fc">Outcome: a readable, navigable EPUB at Docs/Books/a-little-princess-simple-english.epub; source Markdown remains the editable master.</text>
</svg>
