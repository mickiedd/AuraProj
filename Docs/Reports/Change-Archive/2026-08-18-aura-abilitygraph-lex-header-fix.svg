<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">AuraAbilityGraph UE 5.5 LexFromString include fix</title>
  <desc id="desc">Before and after build flow showing the Unreal Engine 5.5 header path migration and successful AuraEditor validation.</desc>
  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#b42318"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#137333"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 16px Arial, sans-serif; fill: #526070; }
      .section { font: 700 20px Arial, sans-serif; fill: #172033; }
      .label { font: 700 16px Arial, sans-serif; fill: #172033; }
      .body { font: 15px Arial, sans-serif; fill: #344054; }
      .mono { font: 15px Consolas, monospace; fill: #172033; }
      .small { font: 13px Arial, sans-serif; fill: #526070; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="60" y="58" class="title">AuraAbilityGraph: UE 5.5 header compatibility fix</text>
  <text x="60" y="88" class="subtitle">The parser contract is unchanged; only the Core header location is corrected.</text>

  <rect x="50" y="125" width="1100" height="205" rx="14" fill="#fff1f0" stroke="#f3b5b0" stroke-width="2"/>
  <text x="80" y="165" class="section" fill="#b42318">Before: build blocked</text>
  <rect x="80" y="195" width="270" height="88" rx="10" fill="#ffffff" stroke="#d92d20" stroke-width="2"/>
  <text x="215" y="227" text-anchor="middle" class="label">AbilityDefinition.cpp</text>
  <text x="215" y="254" text-anchor="middle" class="mono">Misc/LexFromString.h</text>
  <line x1="350" y1="239" x2="465" y2="239" stroke="#b42318" stroke-width="3" marker-end="url(#arrow-red)"/>
  <rect x="470" y="195" width="270" height="88" rx="10" fill="#ffffff" stroke="#d92d20" stroke-width="2"/>
  <text x="605" y="227" text-anchor="middle" class="label">UE 5.5 include lookup</text>
  <text x="605" y="254" text-anchor="middle" class="body">file not found</text>
  <line x1="740" y1="239" x2="855" y2="239" stroke="#b42318" stroke-width="3" marker-end="url(#arrow-red)"/>
  <rect x="860" y="195" width="260" height="88" rx="10" fill="#ffffff" stroke="#d92d20" stroke-width="2"/>
  <text x="990" y="227" text-anchor="middle" class="label">C1083 / exit 6</text>
  <text x="990" y="254" text-anchor="middle" class="body">AuraEditor build fails</text>

  <rect x="50" y="355" width="1100" height="205" rx="14" fill="#ecfdf3" stroke="#9ad7b0" stroke-width="2"/>
  <text x="80" y="395" class="section" fill="#137333">After: header resolves and build completes</text>
  <rect x="80" y="425" width="270" height="88" rx="10" fill="#ffffff" stroke="#34a853" stroke-width="2"/>
  <text x="215" y="457" text-anchor="middle" class="label">AbilityDefinition.cpp</text>
  <text x="215" y="484" text-anchor="middle" class="mono">String/LexFromString.h</text>
  <line x1="350" y1="469" x2="465" y2="469" stroke="#137333" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect x="470" y="425" width="270" height="88" rx="10" fill="#ffffff" stroke="#34a853" stroke-width="2"/>
  <text x="605" y="457" text-anchor="middle" class="label">Core public header</text>
  <text x="605" y="484" text-anchor="middle" class="body">LexTryParseString remains available</text>
  <line x1="740" y1="469" x2="855" y2="469" stroke="#137333" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect x="860" y="425" width="260" height="88" rx="10" fill="#ffffff" stroke="#34a853" stroke-width="2"/>
  <text x="990" y="457" text-anchor="middle" class="label">AuraEditor Win64</text>
  <text x="990" y="484" text-anchor="middle" class="body">Development build succeeds</text>

  <rect x="50" y="585" width="1100" height="75" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="80" y="614" class="label">Validation</text>
  <text x="195" y="614" class="body">Build.bat AuraEditor Win64 Development: exit 0; 11 actions completed.</text>
  <text x="80" y="640" class="small">Non-blocking existing warnings remain: UE 5.5 deprecations, plugin dependency declarations, and the Aura/AuraAbilityGraph circular dependency.</text>
</svg>
