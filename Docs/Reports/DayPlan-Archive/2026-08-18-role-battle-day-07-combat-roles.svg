<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <title>Role Battle Day 07 - Aura and BungeeMan regression</title>
  <desc>Role regression flow from validated definitions through packaged topology and client mutation rejection.</desc>
  <style>
    .bg{fill:#0f172a}.panel{fill:#172554;stroke:#60a5fa;stroke-width:2}.before{fill:#3f1d2e;stroke:#fb7185;stroke-width:2}.after{fill:#12352b;stroke:#34d399;stroke-width:2}.guard{fill:#422006;stroke:#fbbf24;stroke-width:2}.text{fill:#e5e7eb;font:18px Arial,sans-serif}.small{fill:#cbd5e1;font:15px Arial,sans-serif}.title{fill:#f8fafc;font:bold 30px Arial,sans-serif}.head{fill:#f8fafc;font:bold 20px Arial,sans-serif}.arrow{stroke:#93c5fd;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#93c5fd"/></marker></defs>
  <rect class="bg" width="1280" height="760"/>
  <text class="title" x="48" y="58">Day 07 | Aura + BungeeMan role regression</text>
  <text class="small" x="48" y="88">Definitions, grant ledger, combat rules, and staged topology checked as one evidence gate</text>
  <rect class="before" x="48" y="135" width="330" height="220" rx="14"/>
  <text class="head" x="72" y="175">Before / open gate</text>
  <text class="text" x="72" y="215">Editor-only role evidence</text>
  <text class="text" x="72" y="244">could hide package or</text>
  <text class="text" x="72" y="273">client-authority regressions.</text>
  <text class="text" x="72" y="302">FireGun needed runtime proof.</text>
  <path class="arrow" d="M390 245 H455"/>
  <rect class="panel" x="475" y="135" width="330" height="220" rx="14"/>
  <text class="head" x="499" y="175">Regression flow</text>
  <text class="text" x="499" y="215">validated role + FireGun XML</text>
  <text class="text" x="499" y="244">server grant/profile audit</text>
  <text class="text" x="499" y="273">combat + respawn probes</text>
  <text class="text" x="499" y="302">late client + package manifest</text>
  <path class="arrow" d="M820 245 H885"/>
  <rect class="after" x="905" y="135" width="327" height="220" rx="14"/>
  <text class="head" x="929" y="175">After / verified</text>
  <text class="text" x="929" y="215">Aura and BungeeMan</text>
  <text class="text" x="929" y="244">profiles match on clients.</text>
  <text class="text" x="929" y="273">One grant survives two</text>
  <text class="text" x="929" y="302">respawns in staged builds.</text>
  <rect class="guard" x="48" y="410" width="1184" height="125" rx="14"/>
  <text class="head" x="72" y="450">Guard</text>
  <text class="text" x="72" y="484">Stable role-ID requests are revalidated by the server; clients cannot author identity, grants, damage, or presentation.</text>
  <text class="text" x="72" y="513">FireGun stays server-owned and enters the shared combat/damage boundary exactly once.</text>
  <rect class="panel" x="48" y="590" width="1184" height="105" rx="14"/>
  <text class="head" x="72" y="630">Validation</text>
  <text class="text" x="72" y="663">10/10 native tests | Listen + Dedicated | final packaged report Passed=true | staged manifest, checksums, mutation, respawn, crash gates</text>
</svg>
