<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura HUD</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#eef5ff;--cyan:#65dcff;--gold:#ffd66b;--panel:rgba(10,18,31,.88);--line:rgba(151,203,255,.28);--muted:#9eb1c8;}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}button{font:inherit;color:inherit;border:1px solid var(--line);background:rgba(19,34,55,.9);border-radius:8px;padding:.55rem .75rem;cursor:pointer;transition:.15s}button:hover{border-color:var(--cyan);background:rgba(37,66,96,.95)}button:disabled{opacity:.42;cursor:not-allowed}.hud{position:fixed;inset:0;pointer-events:none;font-size:clamp(10px,1.05vw,15px)}.clickable,.clickable *{pointer-events:auto}.card{background:linear-gradient(135deg,rgba(15,29,48,.92),rgba(8,15,27,.86));border:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.28);backdrop-filter:blur(10px)}
.top-left{position:absolute;top:2.5%;left:2.5%;width:min(280px,25vw);padding:12px 15px;border-radius:12px}.eyebrow{color:var(--muted);font-size:.72rem;letter-spacing:.15em;text-transform:uppercase}.level-line{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 8px}.level{font-size:1.55rem;color:var(--gold);font-weight:700}.mounted{font-size:.74rem;color:var(--cyan);text-transform:uppercase}.xp-track,.vital-track{height:7px;border-radius:99px;background:rgba(0,0,0,.45);overflow:hidden;border:1px solid rgba(255,255,255,.12)}.xp-fill,.health-fill,.mana-fill{height:100%;width:0%;transition:width .25s}.xp-fill{background:linear-gradient(90deg,#8a63ff,#e7c1ff)}.xp-text{display:flex;justify-content:space-between;color:var(--muted);font-size:.72rem;margin-top:4px}
.location{position:absolute;top:2.5%;right:2.5%;padding:8px 12px;border-radius:8px;color:#ffe692;font: .78rem ui-monospace,monospace;display:none}.location.visible{display:block}.message-stack{position:absolute;top:17%;left:50%;transform:translateX(-50%);width:min(380px,38vw);display:flex;flex-direction:column;gap:7px;align-items:center}.message{padding:8px 14px;border-radius:8px;color:#f8e6ae;animation:fade 4s forwards}@keyframes fade{0%,75%{opacity:1}100%{opacity:0}}
.interaction{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);min-width:min(390px,42vw);max-width:50vw;padding:12px;border-radius:11px;display:none}.interaction.visible{display:block}.interaction-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:8px}.target-name{font-weight:700}.target-meta{color:var(--muted);font-size:.74rem}.target-health{height:5px;margin:6px 0;background:#331c27;border-radius:99px;overflow:hidden}.target-health>i{display:block;height:100%;background:#e85563;width:0}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.options button{text-align:left;font-size:.78rem;padding:7px}.options button.selected{border-color:var(--gold);color:var(--gold)}.interaction-hint{color:var(--muted);font-size:.7rem;margin-top:7px}
.bottom{position:absolute;left:2.5%;right:2.5%;bottom:2.5%;display:grid;grid-template-columns:minmax(150px,1fr) minmax(320px,2.6fr) minmax(150px,1fr);align-items:end;gap:clamp(10px,1.5vw,26px)}.vital{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;min-height:86px}.orb{width:55px;height:55px;border-radius:50%;display:grid;place-items:center;border:2px solid rgba(255,255,255,.35);box-shadow:inset 0 0 18px rgba(255,255,255,.18),0 0 18px rgba(0,0,0,.3);font-size:1.05rem;font-weight:800}.health .orb{background:radial-gradient(circle at 35% 30%,#ffb3bd,#a81f45 66%,#3e122b)}.mana .orb{background:radial-gradient(circle at 35% 30%,#c1eaff,#2473d3 66%,#10244f)}.vital-copy{flex:1;min-width:0}.vital-title{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);margin-bottom:6px}.vital-value{color:#fff;font-weight:700}.health-fill{background:linear-gradient(90deg,#d02b52,#ff8c8e)}.mana-fill{background:linear-gradient(90deg,#2467d0,#70d6ff)}
.skills{display:flex;justify-content:center;gap:clamp(5px,.8vw,12px);padding:9px 13px;border-radius:16px;background:linear-gradient(180deg,rgba(19,35,57,.78),rgba(7,14,26,.88));border-color:rgba(147,204,255,.36);box-shadow:0 14px 34px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.08)}.skill{width:clamp(48px,5vw,76px);aspect-ratio:1/1.08;position:relative;padding:3px;background:linear-gradient(145deg,rgba(105,219,255,.62),rgba(73,93,154,.42) 46%,rgba(22,34,59,.98));border:1px solid rgba(191,226,255,.46);border-radius:13px;overflow:hidden;isolation:isolate;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 5px 14px rgba(0,0,0,.28);transition:transform .16s,border-color .16s,box-shadow .16s}.skill::before{content:"";position:absolute;inset:3px;border-radius:10px;background:radial-gradient(circle at 32% 20%,rgba(255,255,255,.25),transparent 26%),linear-gradient(145deg,rgba(3,10,21,.08),rgba(3,10,21,.54));pointer-events:none;z-index:2}.skill::after{content:"";position:absolute;left:3px;right:3px;bottom:3px;height:34%;border-radius:0 0 10px 10px;background:linear-gradient(transparent,rgba(2,7,15,.86));pointer-events:none;z-index:2}.skill img{width:100%;height:100%;object-fit:cover;display:none;border-radius:10px;filter:saturate(1.14) contrast(1.06) brightness(1.04);transform:scale(1.02)}.skill img.show{display:block}.skill .fallback{position:absolute;inset:0;display:grid;place-items:center;color:#7eabcc;font-size:1.42rem;text-shadow:0 0 16px rgba(101,220,255,.7);z-index:1}.skill .key{position:absolute;left:6px;top:5px;min-width:18px;padding:2px 4px;border-radius:5px;background:rgba(4,10,20,.72);color:#ffe28a;font-size:.62rem;font-weight:850;line-height:1;text-align:center;z-index:3}.skill .slot-name{position:absolute;left:7px;right:7px;bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#f1f7ff;font-size:.59rem;font-weight:650;text-align:center;text-shadow:0 1px 3px #000;z-index:3}.skill .status{position:absolute;right:5px;top:5px;font-size:.58rem;color:#fff}.skill.offensive{background:linear-gradient(145deg,rgba(255,133,122,.72),rgba(104,58,119,.52) 48%,rgba(22,29,54,.98))}.skill.passive{background:linear-gradient(145deg,rgba(181,142,255,.72),rgba(62,84,153,.52) 48%,rgba(20,29,54,.98))}.skill.equipped{border-color:#ffe18a;box-shadow:0 0 0 1px rgba(255,225,138,.26),0 0 24px rgba(255,196,86,.35),inset 0 1px 0 rgba(255,255,255,.34)}.skill.locked{filter:grayscale(.72);opacity:.58}.skill:not(.locked):hover{transform:translateY(-3px);border-color:#8de9ff;box-shadow:0 10px 22px rgba(0,0,0,.34),0 0 18px rgba(101,220,255,.24)}.skill:active{transform:scale(.94)}
.actions{display:flex;justify-content:flex-end;gap:6px;margin-bottom:96px}.action{font-size:.73rem;padding:.55rem .7rem}.action .points{color:var(--gold);margin-left:3px}.modal-wrap{position:absolute;inset:0;display:none;place-items:center;background:rgba(1,6,12,.5);pointer-events:auto}.modal-wrap.open{display:grid}.modal{width:min(820px,88vw);max-height:84vh;padding:18px;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;gap:12px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-title{font-size:1.15rem;color:var(--gold);font-weight:700}.close{padding:.25rem .55rem}.attribute-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;overflow:auto}.attribute{padding:10px;border-radius:9px;display:grid;grid-template-columns:1fr auto;gap:4px 10px}.attribute small{grid-column:1/-1;color:var(--muted);line-height:1.35}.attribute .value{color:var(--cyan);font-weight:700}.attribute button{grid-column:2;grid-row:1/3;align-self:center}.spell-body{display:grid;grid-template-columns:1.25fr .75fr;gap:12px;min-height:0}.spell-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:7px;overflow:auto;padding-right:3px}.spell{display:flex;align-items:center;gap:8px;text-align:left;padding:8px}.spell img{width:34px;height:34px;border-radius:6px;object-fit:cover;background:#11243c}.spell-copy{min-width:0}.spell-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.78rem}.spell-status{display:block;color:var(--muted);font-size:.66rem}.spell.selected{border-color:var(--gold)}.spell-details{padding:12px;border-radius:10px;min-height:170px}.spell-details p{color:#c8d6e8;line-height:1.4;white-space:pre-wrap}.spell-controls{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.slot-pick{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.slot-pick button{margin:4px 4px 0 0;font-size:.72rem}.empty{color:var(--muted);padding:18px;text-align:center}.quit{width:min(360px,85vw);padding:20px;border-radius:14px;text-align:center}.quit p{color:var(--muted)}
@media(max-width:800px){.top-left{width:38vw}.bottom{grid-template-columns:1fr 2.3fr 1fr;gap:5px}.vital{padding:7px}.orb{width:40px;height:40px;font-size:.8rem}.vital-title{font-size:.65rem}.actions{margin-bottom:83px;flex-wrap:wrap}.action{font-size:.63rem;padding:.4rem}.spell-body{grid-template-columns:1fr}.spell-details{display:none}.interaction{bottom:27%;max-width:90vw}.options{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main class="hud" aria-label="Aura gameplay HUD">
  <section class="top-left card"><div class="eyebrow">Aura adventurer</div><div class="level-line"><span class="level">LV <b id="level">1</b></span><span class="mounted" id="mounted"></span></div><div class="xp-track"><div class="xp-fill" id="xpFill"></div></div><div class="xp-text"><span>experience</span><span id="xpText">0%</span></div></section>
  <div id="location" class="location card"></div><div id="messages" class="message-stack"></div>
  <section id="interaction" class="interaction card"><div class="interaction-head"><div><div id="targetName" class="target-name">Target</div><div id="targetMeta" class="target-meta"></div></div><button id="interact" class="clickable">Interact</button></div><div class="target-health"><i id="targetHealth"></i></div><div id="options" class="options"></div><div class="interaction-hint">Choose an option, then press Interact.</div></section>
  <section class="bottom clickable"><div class="vital health card"><div class="orb">♥</div><div class="vital-copy"><div class="vital-title"><span>HEALTH</span><span class="vital-value" id="healthValue">0 / 0</span></div><div class="vital-track"><div class="health-fill" id="healthFill"></div></div></div></div><div id="skills" class="skills card"></div><div class="vital mana card"><div class="orb">✦</div><div class="vital-copy"><div class="vital-title"><span>MANA</span><span class="vital-value" id="manaValue">0 / 0</span></div><div class="vital-track"><div class="mana-fill" id="manaFill"></div></div></div></div></section>
  <nav class="actions clickable"><button id="attributes" class="action">Attributes <span id="attributePoints" class="points">0</span></button><button id="spells" class="action">Spells <span id="spellPoints" class="points">0</span></button><button id="locationToggle" class="action">Location</button><button id="quit" class="action">Quit</button></nav>
</main>
<div id="attributeModal" class="modal-wrap"><section class="modal card"><div class="modal-head"><div class="modal-title">Attributes</div><button class="close" data-close="attributeModal">×</button></div><div id="attributeGrid" class="attribute-grid"></div></section></div>
<div id="spellModal" class="modal-wrap"><section class="modal card"><div class="modal-head"><div class="modal-title">Spell book</div><button class="close" data-close="spellModal">×</button></div><div class="spell-body"><div id="spellList" class="spell-list"></div><div id="spellDetails" class="spell-details card"><div class="empty">Select a spell to inspect it.</div></div></div></section></div>
<div id="quitModal" class="modal-wrap"><section class="quit card"><div class="modal-title">Leave the adventure?</div><p>Your current session will return to the load menu.</p><button id="confirmQuit">Leave</button> <button id="cancelQuit">Stay</button></section></div>
<script>
const socketUrl='__AURA_WEBSOCKET_URL__';
const slots=['InputTag.LMB','InputTag.RMB','InputTag.1','InputTag.2','InputTag.3','InputTag.4','InputTag.Passive_1','InputTag.Passive_2'];
const slotLabels=['LMB','RMB','1','2','3','4','P1','P2'];
const state={skills:{},attributes:{},spells:[],selectedSpell:null,waitingType:'',interaction:null,selectedOption:-1};
let socket=null,holdTimer=null,heldInput='',gameplayHoldTimer=null,gameplayLmbDown=false;
const $=id=>document.getElementById(id);
function send(command,payload={}){if(socket&&socket.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type:'command',command,payload}));}
function pct(value,max){return max>0?Math.max(0,Math.min(100,value/max*100)):0}
function shortTag(tag){return String(tag||'').split('.').pop()||''}
function status(tag){return shortTag(tag).replace('Abilities_','')}
function setVitals(p){$('healthValue').textContent=`${Math.round(p.health||0)} / ${Math.round(p.maxHealth||0)}`;$('manaValue').textContent=`${Math.round(p.mana||0)} / ${Math.round(p.maxMana||0)}`;$('healthFill').style.width=pct(p.health,p.maxHealth)+'%';$('manaFill').style.width=pct(p.mana,p.maxMana)+'%'}
function isHudInteractiveTarget(target){return target instanceof Element&&(target.closest('button,.clickable,.modal-wrap.open')!==null)}
function releaseSkillInput(){if(!heldInput)return;const slot=heldInput;clearInterval(holdTimer);holdTimer=null;heldInput='';send('skill_ability_released',{inputTag:slot})}
function releaseGameplayLmb(){if(!gameplayLmbDown)return;clearInterval(gameplayHoldTimer);gameplayHoldTimer=null;gameplayLmbDown=false;send('skill_ability_released',{inputTag:'InputTag.LMB'})}
function startGameplayLmb(){if(gameplayLmbDown||heldInput){return}gameplayLmbDown=true;send('skill_ability_pressed',{inputTag:'InputTag.LMB'});clearInterval(gameplayHoldTimer);gameplayHoldTimer=setInterval(()=>send('skill_ability_held',{inputTag:'InputTag.LMB'}),120)}
function renderSkills(){const host=$('skills');host.innerHTML='';slots.forEach((slot,i)=>{const info=state.skills[slot]||{};const type=shortTag(info.abilityType).toLowerCase();const b=document.createElement('button');b.className='skill '+(type.includes('offensive')?'offensive ':'')+(type.includes('passive')?'passive ':'')+(info.statusTag?.endsWith('Locked')?'locked ':'')+(info.statusTag?.endsWith('Equipped')?'equipped':'');b.dataset.inputTag=slot;b.title=info.abilityTag||'Empty slot';const img=document.createElement('img');img.src=info.icon||'';img.className=info.icon?'show':'';img.onerror=()=>img.classList.remove('show');const fallback=document.createElement('span');fallback.className='fallback';fallback.textContent=info.clear?'':'✧';const key=document.createElement('span');key.className='key';key.textContent=slotLabels[i];const name=document.createElement('span');name.className='slot-name';name.textContent=shortTag(info.abilityTag)||'Empty';b.append(img,fallback,key,name);if(info.abilityTag){b.onpointerdown=e=>{e.currentTarget.setPointerCapture?.(e.pointerId);send('skill_ability_pressed',{inputTag:slot});heldInput=slot;clearInterval(holdTimer);holdTimer=setInterval(()=>send('skill_ability_held',{inputTag:heldInput}),120)};b.onpointerup=()=>releaseSkillInput();b.onpointercancel=()=>releaseSkillInput();b.onlostpointercapture=()=>releaseSkillInput()}host.appendChild(b)})}
function renderAttributes(){const host=$('attributeGrid');host.innerHTML='';const rows=Object.values(state.attributes).sort((a,b)=>a.name.localeCompare(b.name));if(!rows.length){host.innerHTML='<div class="empty">Attributes are loading…</div>';return}rows.forEach(a=>{const row=document.createElement('article');row.className='attribute card';row.innerHTML=`<strong>${a.name||shortTag(a.attributeTag)}</strong><span class="value">${Number(a.value||0).toFixed(0)}</span><small>${a.description||''}</small>`;const button=document.createElement('button');button.textContent='+';button.title='Spend an attribute point';button.disabled=Number($('attributePoints').textContent||0)<=0;button.onclick=()=>send('hud_attribute_upgrade',{attributeTag:a.attributeTag});row.appendChild(button);host.appendChild(row)})}
function renderSpells(){const host=$('spellList');host.innerHTML='';if(!state.spells.length){host.innerHTML='<div class="empty">Spell catalog is loading…</div>';return}state.spells.forEach(spell=>{const b=document.createElement('button');b.className='spell '+(state.selectedSpell?.abilityTag===spell.abilityTag?'selected':'');const img=spell.icon?`<img src="${spell.icon}" onerror="this.style.display='none'">`:'<img alt="">';b.innerHTML=`${img}<span class="spell-copy"><span class="spell-name">${shortTag(spell.abilityTag)}</span><span class="spell-status">${status(spell.statusTag)||'Locked'} · Req ${spell.levelRequirement||1}</span></span>`;b.onclick=()=>{state.selectedSpell=spell;send('hud_spell_select',{abilityTag:spell.abilityTag});renderSpells();renderSpellDetails()};host.appendChild(b)})}
function renderSpellDetails(){const host=$('spellDetails');const s=state.selectedSpell;if(!s){host.innerHTML='<div class="empty">Select a spell to inspect it.</div>';return}host.innerHTML=`<strong>${shortTag(s.abilityTag)}</strong><p id="spellDescription">${s.description||'No description available.'}</p><div class="spell-controls"><button id="spendSpell" ${state.spellCanSpend?'':'disabled'}>Spend point</button><button id="equipSpell" ${state.spellCanEquip?'':'disabled'}>Equip</button><button id="deselectSpell">Clear</button></div><div id="slotPicker" class="slot-pick" style="display:${state.waitingType?'block':'none'}"><span>Choose a ${shortTag(state.waitingType)} slot:</span><div id="slotButtons"></div></div>`;$('spendSpell').onclick=()=>send('hud_spell_spend');$('equipSpell').onclick=()=>send('hud_spell_equip');$('deselectSpell').onclick=()=>{send('hud_spell_deselect');state.selectedSpell=null;state.waitingType='';renderSpells();renderSpellDetails()};if(state.waitingType){const slotsForType=state.waitingType.endsWith('Passive')?['InputTag.Passive_1','InputTag.Passive_2']:['InputTag.LMB','InputTag.RMB','InputTag.1','InputTag.2','InputTag.3','InputTag.4'];$('slotButtons').innerHTML=slotsForType.map(x=>`<button data-slot="${x}">${shortTag(x)}</button>`).join('');$('slotButtons').querySelectorAll('button').forEach(b=>b.onclick=()=>send('hud_spell_slot',{slotTag:b.dataset.slot,abilityType:state.waitingType}))}}
function renderInteraction(){const p=state.interaction;const host=$('interaction');if(!p){host.classList.remove('visible');return}host.classList.add('visible');$('targetName').textContent=p.displayName||shortTag(p.kindTag)||'Target';$('targetMeta').textContent=shortTag(p.relationshipTag)+' · '+shortTag(p.lifeTag);$('targetHealth').style.width=pct(p.health,p.maxHealth)+'%';const options=$('options');options.innerHTML='';(p.options||[]).forEach(o=>{const b=document.createElement('button');b.textContent=o.displayText+(o.enabled?'':' (unavailable)');b.disabled=!o.enabled;b.className=o.index===state.selectedOption?'selected':'';b.onclick=()=>{state.selectedOption=o.index;send('hud_interaction_select',{index:o.index});renderInteraction()};options.appendChild(b)})}
function addMessage(p){const m=document.createElement('div');m.className='message card';m.textContent=p.message||p.messageTag||'';$('messages').appendChild(m);setTimeout(()=>m.remove(),4200)}
function handleEvent(name,p){switch(name){case'hud_vitals':setVitals(p);break;case'hud_progress':$('level').textContent=p.level??1;$('xpFill').style.width=((p.xpPercent||0)*100)+'%';$('xpText').textContent=Math.round((p.xpPercent||0)*100)+'%';$('attributePoints').textContent=p.attributePoints??0;$('spellPoints').textContent=p.spellPoints??0;renderAttributes();renderSpellDetails();break;case'skill_panel_ability':state.skills[p.inputTag]=p;renderSkills();break;case'hud_attribute_catalog':if(p.replace){state.attributes={};renderAttributes()}break;case'hud_attribute':state.attributes[p.attributeTag]=p;renderAttributes();break;case'hud_spell_catalog':state.spells=p.abilities||[];$('spellPoints').textContent=p.spellPoints??$('spellPoints').textContent;renderSpells();renderSpellDetails();break;case'hud_spell_selection':state.spellCanSpend=!!p.canSpend;state.spellCanEquip=!!p.canEquip;renderSpellDetails();break;case'hud_wait_for_equip':state.waitingType=p.abilityType||'';renderSpellDetails();break;case'hud_stop_wait_for_equip':state.waitingType='';renderSpellDetails();break;case'hud_spell_reassigned':renderSpells();break;case'hud_interaction':state.interaction=p;renderInteraction();break;case'hud_interaction_cleared':state.interaction=null;renderInteraction();break;case'hud_message':addMessage(p);break;case'hud_level_up':addMessage({message:`Level ${p.level} reached!`});break;case'hud_mounted':$('mounted').textContent=p.mounted?'Mounted':'';break;case'hud_location':$('location').classList.toggle('visible',!!p.visible);$('location').textContent=p.visible?`X ${Number(p.x||0).toFixed(0)}  Y ${Number(p.y||0).toFixed(0)}  Z ${Number(p.z||0).toFixed(0)}`:'';break;case'hud_quit_prompt':$('quitModal').classList.toggle('open',!!p.visible);break}}
function connect(){socket=new WebSocket(socketUrl);socket.onopen=()=>{send('hud_ready');send('ready')};socket.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='event')handleEvent(m.event,m.payload||{})}catch(_){}};socket.onclose=()=>setTimeout(connect,900);socket.onerror=()=>socket.close()}
document.addEventListener('pointerdown',e=>{if(e.button===0&&!isHudInteractiveTarget(e.target))startGameplayLmb()},true);
window.addEventListener('pointerup',e=>{if(e.button===0){releaseSkillInput();releaseGameplayLmb()}},true);
window.addEventListener('pointercancel',e=>{if(e.button===0){releaseSkillInput();releaseGameplayLmb()}},true);
window.addEventListener('blur',()=>{releaseSkillInput();releaseGameplayLmb()});
$('attributes').onclick=()=>{$('attributeModal').classList.add('open');send('hud_attributes_clicked');renderAttributes()};$('spells').onclick=()=>{$('spellModal').classList.add('open');send('hud_spells_clicked');renderSpells()};$('quit').onclick=()=>send('hud_close_clicked');$('locationToggle').onclick=()=>send('hud_location_toggle');$('interact').onclick=()=>send('hud_interaction_activate');$('confirmQuit').onclick=()=>send('hud_quit_confirm');$('cancelQuit').onclick=()=>send('hud_quit_cancel');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).classList.remove('open'));window.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.modal-wrap.open').forEach(x=>x.classList.remove('open'));send('hud_quit_cancel')}});renderSkills();renderAttributes();connect();
</script>
</body>
</html>
