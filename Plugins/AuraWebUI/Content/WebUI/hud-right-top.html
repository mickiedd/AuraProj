<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura HUD - right top</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#eef5ff;--cyan:#65dcff;--gold:#ffd66b;--line:rgba(151,203,255,.28);--muted:#9eb1c8}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}button{font:inherit;color:inherit;border:1px solid var(--line);background:rgba(19,34,55,.9);border-radius:8px;padding:.55rem .75rem;cursor:pointer;transition:.15s}button:hover{border-color:var(--cyan);background:rgba(37,66,96,.95)}button:disabled{opacity:.42;cursor:not-allowed}.hud{position:relative;width:100%;height:100%;font-size:clamp(10px,1.05vw,15px)}
.card{background:linear-gradient(135deg,rgba(15,29,48,.92),rgba(8,15,27,.86));border:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.28);backdrop-filter:blur(10px)}.location{position:absolute;top:0;right:0;padding:8px 12px;border-radius:8px;color:#ffe692;font:.78rem ui-monospace,monospace;display:none}.location.visible{display:block}.actions{position:absolute;top:52px;right:0;display:flex;justify-content:flex-end;gap:6px}.action{font-size:.73rem;padding:.55rem .7rem}.action .points{color:var(--gold);margin-left:3px}.firearm{position:absolute;top:92px;right:0;min-width:235px;padding:10px 12px;border-radius:10px}.firearm-title{display:flex;justify-content:space-between;gap:10px;color:var(--gold);font-size:.76rem}.firearm-state{color:var(--cyan);font-weight:700}.firearm-ammo{margin-top:5px;font:700 1.05rem ui-monospace,monospace}.firearm-meta{color:var(--muted);font-size:.66rem;margin-top:3px}.firearm button{margin-top:7px;font-size:.7rem;padding:.35rem .6rem}
.modal-wrap{position:absolute;inset:0;display:none;place-items:center;background:rgba(1,6,12,.5);pointer-events:auto}.modal-wrap.open{display:grid}.modal{width:min(820px,88vw);max-height:84vh;padding:18px;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;gap:12px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-title{font-size:1.15rem;color:var(--gold);font-weight:700}.close{padding:.25rem .55rem}.attribute-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;overflow:auto}.attribute{padding:10px;border-radius:9px;display:grid;grid-template-columns:1fr auto;gap:4px 10px}.attribute small{grid-column:1/-1;color:var(--muted);line-height:1.35}.attribute .value{color:var(--cyan);font-weight:700}.attribute button{grid-column:2;grid-row:1/3;align-self:center}.spell-body{display:grid;grid-template-columns:1.25fr .75fr;gap:12px;min-height:0}.spell-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:7px;overflow:auto;padding-right:3px}.spell{display:flex;align-items:center;gap:8px;text-align:left;padding:8px}.spell img{width:34px;height:34px;border-radius:6px;object-fit:cover;background:#11243c}.spell-copy{min-width:0}.spell-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.78rem}.spell-status{display:block;color:var(--muted);font-size:.66rem}.spell.selected{border-color:var(--gold)}.spell-details{padding:12px;border-radius:10px;min-height:170px}.spell-details p{color:#c8d6e8;line-height:1.4;white-space:pre-wrap}.spell-controls{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.slot-pick{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.slot-pick button{margin:4px 4px 0 0;font-size:.72rem}.inventory-list,.merchant-list{display:grid;gap:7px;overflow:auto}.inventory-row,.merchant-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px;border-radius:9px}.inventory-row small,.merchant-row small{display:block;color:var(--muted);font-size:.66rem}.inventory-quantity,.wallet-balance{color:var(--cyan);font-weight:750}.merchant-row{grid-template-columns:1fr auto auto auto}.merchant-price{color:var(--gold);font-weight:700}.merchant-stock{color:var(--muted);font-size:.7rem}.merchant-status{min-height:1.1em;color:var(--gold);font-size:.72rem}.merchant-row button{font-size:.72rem;padding:.4rem .55rem}.unavailable{opacity:.55}.modal-subtitle{color:var(--muted);font-size:.72rem}.wallet-banner{display:flex;justify-content:space-between;gap:12px;padding:10px;border-radius:9px;color:var(--muted)}.quit{width:min(360px,85vw);padding:20px;border-radius:14px;text-align:center}.quit p{color:var(--muted)}
@media(min-width:800px){.location{top:2.5%;right:2.5%}.actions{top:calc(2.5% + 48px);right:2.5%}}
@media(max-width:800px){.action{font-size:.62rem;padding:.4rem}.spell-body{grid-template-columns:1fr}.spell-details{display:none}}
</style>
<style>
/* Fits the existing 366 x 210 native browser host; no larger input-capture area. */
.firearm{top:86px;right:0;width:min(320px,100%);min-width:0;padding:8px 10px;border-radius:10px}
.firearm[hidden]{display:none}.firearm-title{align-items:center;font-size:11px;line-height:14px}.firearm-title strong{letter-spacing:.08em}.firearm-key{color:var(--muted);margin-left:6px;font-weight:400;letter-spacing:0}
.firearm-ammo{display:flex;justify-content:space-between;align-items:baseline;margin-top:3px;font:700 24px/27px ui-monospace,monospace}.firearm-reserve{color:var(--muted);font:12px/16px Inter,sans-serif}
.firearm-meta{font-size:11px;line-height:14px;margin-top:3px;overflow-wrap:anywhere}.firearm-footer{display:flex;align-items:center;gap:10px;margin-top:5px;min-height:24px}.firearm button{margin:0;padding:4px 8px;font-size:11px;line-height:14px}.reload-duration{color:var(--muted);font-size:10px}
.firearm[data-state="EmptyMagazine"],.firearm[data-state="OutOfAmmo"]{border-color:#ff987e}.firearm[data-state="EmptyMagazine"] .firearm-state,.firearm[data-state="OutOfAmmo"] .firearm-state{color:#ffb29d}.firearm[data-state="Reloading"] .firearm-state::before{content:'↻ ';color:var(--gold)}
@media(min-width:800px){.firearm{top:calc(2.5% + 86px);right:2.5%}}
/* DPI-scaled editor panels can expose only ~196 x 112 CSS pixels. Keep gun info above the existing menu row. */
@media(max-height:160px){
  .firearm{top:0;right:0;width:100%;padding:3px 6px;border-radius:6px}
  .firearm-title{font-size:9px;line-height:11px;gap:4px}.firearm-key{margin-left:4px}
  .firearm-ammo{display:block;margin-top:0;font-size:15px;line-height:17px}.firearm-reserve{margin-left:8px;font-size:9px;line-height:11px}
  .firearm-meta{margin-top:0;font-size:9px;line-height:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .firearm-footer{position:absolute;right:5px;top:16px;margin:0;min-height:0}.firearm button{padding:2px 4px;font-size:9px;line-height:12px}.reload-duration{display:none}
  .firearm-active .location{top:auto;bottom:0;padding:0 2px;font-size:8px;line-height:10px;max-width:100%}
}
</style>
</head>
<body>
<main class="hud" aria-label="Aura right-top HUD panel">
  <div id="location" class="location card"></div>
  <nav class="actions"><button id="attributes" class="action">Attributes <span id="attributePoints" class="points">0</span></button><button id="spells" class="action">Spells <span id="spellPoints" class="points">0</span></button><button id="inventory" class="action">Bag <span id="walletBalance" class="points">0</span></button><button id="locationToggle" class="action">Location</button><button id="quit" class="action">Quit</button></nav>
</main>
<section id="firearmPanel" class="firearm card" aria-label="BungeeMan FireGun ammunition" hidden>
  <div class="firearm-title"><strong>FIREGUN<span class="firearm-key">LMB</span></strong><span id="firearmState" class="firearm-state" role="status" aria-live="polite">Not applicable</span></div>
  <div class="firearm-ammo"><span id="firearmAmmo">—</span><span id="firearmReserve" class="firearm-reserve"></span></div>
  <div id="firearmMeta" class="firearm-meta"></div>
  <div class="firearm-footer"><button id="reloadFirearm" type="button" disabled>Reload [R]</button><span id="reloadDuration" class="reload-duration"></span></div>
</section>
<div id="attributeModal" class="modal-wrap"><section class="modal card"><div class="modal-head"><div class="modal-title">Attributes</div><button class="close" data-close="attributeModal">X</button></div><div id="attributeGrid" class="attribute-grid"></div></section></div>
<div id="spellModal" class="modal-wrap"><section class="modal card"><div class="modal-head"><div class="modal-title">Spell book</div><button class="close" data-close="spellModal">X</button></div><div class="spell-body"><div id="spellList" class="spell-list"></div><div id="spellDetails" class="spell-details card"><div class="empty">Select a spell to inspect it.</div></div></div></section></div>
<div id="inventoryModal" class="modal-wrap"><section class="modal card"><div class="modal-head"><div><div class="modal-title">Wallet &amp; inventory</div><div id="inventorySubtitle" class="modal-subtitle">Owner-only progression</div></div><button class="close" data-close="inventoryModal">X</button></div><div class="wallet-banner card"><span id="currencyName">Currency</span><span id="inventoryBalance" class="wallet-balance">0</span></div><div id="inventoryList" class="inventory-list"></div></section></div>
<div id="merchantModal" class="modal-wrap"><section class="modal card"><div class="modal-head"><div><div id="merchantTitle" class="modal-title">Merchant</div><div id="merchantSubtitle" class="modal-subtitle"></div></div><button id="closeMerchant" class="close">X</button></div><div id="merchantStatus" class="merchant-status"></div><div id="merchantList" class="merchant-list"></div></section></div>
<div id="quitModal" class="modal-wrap"><section class="quit card"><div class="modal-title">Leave the adventure?</div><p>Your current session will return to the load menu.</p><button id="confirmQuit">Leave</button> <button id="cancelQuit">Stay</button></section></div>
<script>
const socketUrl='__AURA_WEBSOCKET_URL__';const passiveSlots=['InputTag.Passive.1','InputTag.Passive.2'];const state={attributes:{},spells:[],selectedSpell:null,waitingType:'',spellCanSpend:false,spellCanEquip:false,wallet:{balance:0,items:[]},firearm:{applicable:false,state:'NotApplicable',magazineRounds:0,magazineCapacity:0,reserveRounds:0,reserveCapacity:0,canFire:false},merchant:null,pendingOffers:{},requestOffers:{}};let socket=null;
const $=id=>document.getElementById(id);function send(command,payload={}){if(socket&&socket.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type:'command',command,payload}))}function shortTag(tag){return String(tag||'').split('.').pop()||''}function status(tag){return shortTag(tag).replace('Abilities_','')}
function renderAttributes(){const host=$('attributeGrid');host.innerHTML='';const rows=Object.values(state.attributes).sort((a,b)=>(a.name||'').localeCompare(b.name||''));if(!rows.length){host.innerHTML='<div class="empty">Attributes are loading...</div>';return}rows.forEach(a=>{const row=document.createElement('article');row.className='attribute card';row.innerHTML=`<strong>${a.name||shortTag(a.attributeTag)}</strong><span class="value">${Number(a.value||0).toFixed(0)}</span><small>${a.description||''}</small>`;const button=document.createElement('button');button.textContent='+';button.title='Spend an attribute point';button.disabled=Number($('attributePoints').textContent||0)<=0;button.onclick=()=>send('hud_attribute_upgrade',{attributeTag:a.attributeTag});row.appendChild(button);host.appendChild(row)})}
function renderSpells(){const host=$('spellList');host.innerHTML='';if(!state.spells.length){host.innerHTML='<div class="empty">Spell catalog is loading...</div>';return}state.spells.forEach(spell=>{const b=document.createElement('button');b.className='spell '+(state.selectedSpell?.abilityTag===spell.abilityTag?'selected':'');const img=spell.icon?`<img src="${spell.icon}" onerror="this.style.display='none'">`:'<img alt="">';b.innerHTML=`${img}<span class="spell-copy"><span class="spell-name">${shortTag(spell.abilityTag)}</span><span class="spell-status">${status(spell.statusTag)||'Locked'} - Req ${spell.levelRequirement||1}</span></span>`;b.onclick=()=>{state.selectedSpell=spell;send('hud_spell_select',{abilityTag:spell.abilityTag});renderSpells();renderSpellDetails()};host.appendChild(b)})}
function renderSpellDetails(){const host=$('spellDetails');const s=state.selectedSpell;if(!s){host.innerHTML='<div class="empty">Select a spell to inspect it.</div>';return}host.innerHTML=`<strong>${shortTag(s.abilityTag)}</strong><p>${s.description||'No description available.'}</p><div class="spell-controls"><button id="spendSpell" ${state.spellCanSpend?'':'disabled'}>Spend point</button><button id="equipSpell" ${state.spellCanEquip?'':'disabled'}>Equip</button><button id="deselectSpell">Clear</button></div><div id="slotPicker" class="slot-pick" style="display:${state.waitingType?'block':'none'}"><span>Choose a ${shortTag(state.waitingType)} slot:</span><div id="slotButtons"></div></div>`;$('spendSpell').onclick=()=>send('hud_spell_spend');$('equipSpell').onclick=()=>send('hud_spell_equip');$('deselectSpell').onclick=()=>{send('hud_spell_deselect');state.selectedSpell=null;state.waitingType='';renderSpells();renderSpellDetails()};if(state.waitingType){const slotsForType=state.waitingType.endsWith('Passive')?passiveSlots:['InputTag.LMB','InputTag.RMB','InputTag.1','InputTag.2','InputTag.3','InputTag.4'];$('slotButtons').innerHTML=slotsForType.map(x=>`<button data-slot="${x}">${shortTag(x)}</button>`).join('');$('slotButtons').querySelectorAll('button').forEach(b=>b.onclick=()=>send('hud_spell_slot',{slotTag:b.dataset.slot,abilityType:state.waitingType}))}}
function renderInventory(){const host=$('inventoryList');host.innerHTML='';const items=state.wallet.items||[];$('walletBalance').textContent=Number(state.wallet.balance||0).toLocaleString();$('inventoryBalance').textContent=Number(state.wallet.balance||0).toLocaleString();$('currencyName').textContent=shortTag(state.wallet.currencyId||'Currency');$('inventorySubtitle').textContent=`Owner-only state • ${items.length} slot${items.length===1?'':'s'} used`+(state.wallet.maxSlots?` / ${state.wallet.maxSlots}`:'');if(!items.length){host.innerHTML='<div class="empty">Inventory is empty. Merchant purchases appear here.</div>';return}items.forEach(item=>{const row=document.createElement('article');row.className='inventory-row card';row.innerHTML=`<span><strong>${item.displayName||shortTag(item.itemId)}</strong><small>${item.itemId||''}</small></span><span class="inventory-quantity">×${Number(item.quantity||0).toLocaleString()}</span><span></span>`;host.appendChild(row)})}
function commerceResultName(code){return['Success','Invalid session','Invalid request','Stale request','Request gap','Invalid requester','Merchant unavailable','Out of range','Line of sight blocked','Offer unavailable','Eligibility denied','Sold out','Insufficient funds','Full inventory','Invalid definition','Rollback failed','Persistence failed'][Number(code)]||'Purchase failed'}
function renderMerchant(){const p=state.merchant;if(!p||!p.visible){$('merchantModal').classList.remove('open');return}$('merchantModal').classList.add('open');$('merchantTitle').textContent=shortTag(p.merchantDefinitionId||'Merchant');$('merchantSubtitle').textContent=`${p.populationMemberId||'unknown member'} • stock revision ${p.stockRevision??0}`;const host=$('merchantList');host.innerHTML='';const offers=p.offers||[];if(!offers.length){host.innerHTML='<div class="empty">This merchant has no available offers.</div>';return}offers.forEach(o=>{const row=document.createElement('article');row.className='merchant-row card '+(o.available?'':'unavailable');const stock=o.stockPolicyName==='Unlimited'?'Unlimited':Number(o.currentStock||0).toLocaleString();const pending=!!state.pendingOffers[o.offerId];row.innerHTML=`<span><strong>${o.itemDisplayName||shortTag(o.itemId)}</strong><small>×${Number(o.grantQuantity||0).toLocaleString()} • ${o.offerId}</small></span><span class="merchant-price">${Number(o.buyPrice||0).toLocaleString()}</span><span class="merchant-stock">${stock}</span><button data-offer="${o.offerId}" ${o.available&&!pending?'':'disabled'}>${pending?'Pending…':'Buy'}</button>`;row.querySelector('button').onclick=()=>{state.pendingOffers[o.offerId]=true;state.requestOffers[Date.now()]=o.offerId;renderMerchant();send('hud_merchant_buy',{offerId:o.offerId})};host.appendChild(row)})}
function isFireGun(f){return f.applicable===true&&f.roleId==='BungeeMan'&&f.abilityTag==='Abilities.Gun.Fire'&&f.inputTag==='InputTag.LMB'}
function renderFirearm(){
  const f=state.firearm,applicable=isFireGun(f),connected=socket?.readyState===WebSocket.OPEN;
  const labels={Ready:'Ready',EmptyMagazine:'Magazine empty',Reloading:'Reloading…',OutOfAmmo:'Out of ammo',Unavailable:'Unavailable'};
  const panel=$('firearmPanel');panel.hidden=!applicable;panel.dataset.state=f.state||'NotApplicable';
  document.body.classList.toggle('firearm-active',applicable);
  $('firearmState').textContent=!applicable?'Not applicable':!connected?'Reconnecting…':labels[f.state]||'Updating…';
  $('firearmAmmo').textContent=applicable?`${Number(f.magazineRounds||0)} / ${Number(f.magazineCapacity||0)}`:'—';
  $('firearmReserve').textContent=applicable?`Reserve ${Number(f.reserveRounds||0)}`:'';
  const hints={Ready:f.reserveRounds>0?(f.canReload?'Press R to top up.':'One shot per LMB press.'):'No reserve ammo left.',EmptyMagazine:'Press R or click Reload.',Reloading:'Waiting for server reload.',OutOfAmmo:'No reserve ammunition available.',Unavailable:'Unavailable while recovering.'};
  $('firearmMeta').textContent=!applicable?'':!connected?'Waiting for ammunition state…':hints[f.state]||'Waiting for ammunition state…';
  $('reloadFirearm').disabled=!applicable||!connected||f.canReload!==true;
  $('reloadFirearm').textContent=f.state==='Reloading'?'Reloading…':'Reload [R]';
  $('reloadDuration').textContent=applicable&&f.reloadDuration>0?`${Number(f.reloadDuration).toFixed(2).replace(/0$/,'')} s reload`:'';
}
function requestFirearmReload(){if(!$('reloadFirearm').disabled)send('hud_reload')}
/* R works with browser focus. Use block comments: UE LoadString removes line breaks. */
window.addEventListener('keydown',e=>{if(e.code==='KeyR'&&!e.repeat&&!e.ctrlKey&&!e.altKey&&!e.metaKey&&!e.shiftKey&&!e.target?.closest?.('input,textarea,select,[contenteditable="true"]')&&!document.querySelector('.modal-wrap.open')){if(!$('reloadFirearm').disabled){e.preventDefault();requestFirearmReload()}}});
function handleEvent(name,p){switch(name){case'hud_progress':$('attributePoints').textContent=p.attributePoints??0;$('spellPoints').textContent=p.spellPoints??0;renderAttributes();renderSpellDetails();break;case'hud_location':$('location').classList.toggle('visible',!!p.visible);$('location').textContent=p.visible?`X ${Number(p.x||0).toFixed(0)}  Y ${Number(p.y||0).toFixed(0)}  Z ${Number(p.z||0).toFixed(0)}`:'';break;case'hud_economy':state.wallet=p;renderInventory();break;case'hud_firearm':state.firearm=p;renderFirearm();break;case'hud_attribute_catalog':if(p.replace){state.attributes={};renderAttributes()}break;case'hud_attribute':state.attributes[p.attributeTag]=p;renderAttributes();break;case'hud_spell_catalog':state.spells=p.abilities||[];$('spellPoints').textContent=p.spellPoints??$('spellPoints').textContent;renderSpells();renderSpellDetails();break;case'hud_spell_selection':state.spellCanSpend=!!p.canSpend;state.spellCanEquip=!!p.canEquip;renderSpellDetails();break;case'hud_wait_for_equip':state.waitingType=p.abilityType||'';renderSpellDetails();break;case'hud_stop_wait_for_equip':state.waitingType='';renderSpellDetails();break;case'hud_spell_reassigned':renderSpells();break;case'hud_merchant':state.merchant=p;renderMerchant();break;case'hud_merchant_cleared':state.merchant=null;renderMerchant();break;case'hud_merchant_result':{const resultName=p.resultName&&p.resultName!=='Success'?p.resultName:commerceResultName(p.resultCode);$('merchantStatus').textContent=resultName==='Success'?'Purchase complete':resultName;Object.keys(state.pendingOffers).forEach(key=>{state.pendingOffers[key]=false});renderMerchant();break}case'hud_quit_prompt':$('quitModal').classList.toggle('open',!!p.visible);break}}
function closeMenu(id){$(id).classList.remove('open');if(id==='merchantModal')send('hud_merchant_close');else send('hud_menu_closed')}
function connect(){socket=new WebSocket(socketUrl);socket.onopen=()=>{send('hud_ready',{panel:'right-top'});send('ready');renderFirearm()};socket.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='event')handleEvent(m.event,m.payload||{})}catch(_){}};socket.onclose=()=>{state.firearm={applicable:false};renderFirearm();setTimeout(connect,900)};socket.onerror=()=>socket.close()}
$('attributes').onclick=()=>{$('attributeModal').classList.add('open');send('hud_attributes_clicked');renderAttributes()};$('spells').onclick=()=>{$('spellModal').classList.add('open');send('hud_spells_clicked');renderSpells()};$('inventory').onclick=()=>{$('inventoryModal').classList.add('open');send('hud_inventory_clicked');renderInventory()};$('reloadFirearm').onclick=()=>send('hud_reload');$('quit').onclick=()=>send('hud_close_clicked');$('locationToggle').onclick=()=>send('hud_location_toggle');$('confirmQuit').onclick=()=>send('hud_quit_confirm');$('cancelQuit').onclick=()=>send('hud_quit_cancel');$('closeMerchant').onclick=()=>closeMenu('merchantModal');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeMenu(b.dataset.close));window.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.modal-wrap.open').forEach(x=>x.classList.remove('open'));send('hud_merchant_close');send('hud_quit_cancel')}});renderAttributes();renderInventory();renderFirearm();connect();
</script>
</body>
</html>
