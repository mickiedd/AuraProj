<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aura Interaction</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#eef5ff;--cyan:#65dcff;--gold:#ffd66b;--line:rgba(151,203,255,.28);--muted:#9eb1c8}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}button{font:inherit;color:inherit;border:1px solid var(--line);background:rgba(19,34,55,.9);border-radius:8px;padding:.55rem .75rem;cursor:pointer;transition:.15s}button:hover{border-color:var(--cyan);background:rgba(37,66,96,.95)}button:disabled{opacity:.42;cursor:not-allowed}.card{background:linear-gradient(135deg,rgba(15,29,48,.94),rgba(8,15,27,.9));border:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.28);backdrop-filter:blur(10px)}
.hud{width:100%;height:100%;display:flex;justify-content:center;align-items:flex-start}.interaction{width:100%;padding:12px;border-radius:11px;display:none}.interaction.visible{display:block}.interaction-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:8px}.target-name{font-weight:700}.target-meta{color:var(--muted);font-size:.7rem;line-height:1.45}.target-health{height:5px;margin:6px 0;background:#331c27;border-radius:99px;overflow:hidden}.target-health>i{display:block;height:100%;background:#e85563;width:0}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.options button{text-align:left;font-size:.78rem;padding:7px}.options button.selected{border-color:var(--gold);color:var(--gold)}.interaction-hint{color:var(--muted);font-size:.7rem;margin-top:7px}.interaction-hint.trade{color:var(--gold)}
@media(max-width:520px){.options{grid-template-columns:1fr 1fr}.interaction{padding:9px}.interaction-head{gap:8px}}
</style>
</head>
<body>
<main class="hud" aria-label="Aura interaction panel">
  <section id="interaction" class="interaction card"><div class="interaction-head"><div><div id="targetName" class="target-name">Target</div><div id="targetMeta" class="target-meta"></div></div><button id="interact">Interact</button></div><div class="target-health"><i id="targetHealth"></i></div><div id="options" class="options"></div><div id="interactionHint" class="interaction-hint">Choose an option, then press Interact.</div></section>
</main>
<script>
const socketUrl='__AURA_WEBSOCKET_URL__';const state={interaction:null,selectedOption:-1};let socket=null;
const $=id=>document.getElementById(id);function send(command,payload={}){if(socket&&socket.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type:'command',command,payload}))}function pct(value,max){return max>0?Math.max(0,Math.min(100,value/max*100)):0}function shortTag(tag){return String(tag||'').split('.').pop()||''}function titleCase(value){return String(value||'Unknown').replaceAll('_',' ')}
function renderInteraction(){const p=state.interaction;const host=$('interaction');if(!p||p.visible===false||!p.kindTag||!p.lifeTag){host.classList.remove('visible');return}host.classList.add('visible');$('targetName').textContent=p.displayName||shortTag(p.kindTag)||'Target';const meta=[shortTag(p.relationshipTag),shortTag(p.lifeTag),p.activity?titleCase(p.activity):'',p.merchantAvailable?'Merchant':'',p.attackAllowed===false?'Combat protected':p.attackAllowed?'Combat ready':''].filter(Boolean);$('targetMeta').textContent=meta.join(' • ');$('targetHealth').style.width=pct(p.health,p.maxHealth)+'%';const options=$('options');options.innerHTML='';let selectedTrade=false;(p.options||[]).forEach(o=>{const b=document.createElement('button');b.textContent=o.displayText+(o.enabled?'':' (unavailable)');b.disabled=!o.enabled;b.className=o.index===state.selectedOption?'selected':'';if(o.optionTag==='Interaction.Trade'&&o.enabled)selectedTrade=o.index===state.selectedOption;b.onclick=()=>{state.selectedOption=o.index;send('hud_interaction_select',{index:o.index});if(o.optionTag==='Interaction.Trade'&&o.enabled)send('hud_merchant_open');renderInteraction()};options.appendChild(b)});$('interactionHint').textContent=selectedTrade?'Shop ready — merchant panel opened.':'Choose an option, then press Interact.';$('interactionHint').className='interaction-hint '+(selectedTrade?'trade':'')}
function handleEvent(name,p){switch(name){case'hud_interaction':state.interaction=p;renderInteraction();break;case'hud_interaction_cleared':state.interaction=null;state.selectedOption=-1;renderInteraction();break}}
function connect(){socket=new WebSocket(socketUrl);socket.onopen=()=>{send('hud_ready',{panel:'interaction'});send('ready')};socket.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='event')handleEvent(m.event,m.payload||{})}catch(_){}};socket.onclose=()=>{state.interaction=null;state.selectedOption=-1;renderInteraction();setTimeout(connect,900)};socket.onerror=()=>socket.close()}
$('interact').onclick=()=>send('hud_interaction_activate');renderInteraction();connect();
</script>
</body>
</html>
