<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura HUD - left top</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#eef5ff;--cyan:#65dcff;--gold:#ffd66b;--line:rgba(151,203,255,.28);--muted:#9eb1c8}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}.hud{position:relative;width:100%;height:100%;font-size:clamp(10px,1.05vw,15px)}
.card{background:linear-gradient(135deg,rgba(15,29,48,.92),rgba(8,15,27,.86));border:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.28);backdrop-filter:blur(10px)}
.top-left{position:absolute;inset:0 auto auto 0;width:100%;padding:12px 15px;border-radius:12px}.eyebrow{color:var(--muted);font-size:.68rem;letter-spacing:.15em;text-transform:uppercase}.identity-line,.level-line,.battle-line{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.identity-line{margin:3px 0}.role-name{font-size:1.15rem;color:#fff;font-weight:750}.life{font-size:.66rem;color:#8ff0c1;text-transform:uppercase;letter-spacing:.08em}.life.dying,.life.dead{color:#ff9b9b}.life.respawning{color:#ffe692}.identity-meta,.battle-line{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.68rem}.identity-meta span,.battle-line span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.battle-line{margin-top:9px;padding-top:8px;border-top:1px solid rgba(151,203,255,.18)}.battle-phase{color:var(--gold);font-weight:700}.battle-event{font-family:ui-monospace,monospace}.persistence{margin-top:7px;color:var(--cyan);font-size:.66rem}.tutorial{margin-top:5px;color:var(--gold);font-size:.66rem}.level-line{margin:8px 0 8px}.level{font-size:1.35rem;color:var(--gold);font-weight:700}.mounted{font-size:.7rem;color:var(--cyan);text-transform:uppercase}.xp-track{height:7px;border-radius:99px;background:rgba(0,0,0,.45);overflow:hidden;border:1px solid rgba(255,255,255,.12)}.xp-fill{height:100%;width:0%;transition:width .25s;background:linear-gradient(90deg,#8a63ff,#e7c1ff)}.xp-text{display:flex;justify-content:space-between;color:var(--muted);font-size:.7rem;margin-top:4px}
.message-stack{position:absolute;top:112px;left:0;right:0;display:flex;flex-direction:column;gap:7px;align-items:stretch}.message{padding:8px 14px;border-radius:8px;color:#f8e6ae;animation:fade 4s forwards}@keyframes fade{0%,75%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<main class="hud" aria-label="Aura left-top HUD panel">
  <section class="top-left card"><div class="eyebrow">Combat identity</div><div class="identity-line"><span class="role-name" id="roleName">Loading role</span><span class="life" id="lifeState">Respawning</span></div><div class="identity-meta"><span id="combatProfile">Profile —</span><span id="faction">Faction —</span></div><div class="battle-line"><span>Battle <b class="battle-phase" id="battlePhase">Peace</b></span><span class="battle-event" id="battleEvent">No active event</span><span id="populationSummary">Civilians —</span></div><div class="persistence" id="profileState">Profile session initializing…</div><div class="tutorial" id="tutorialState">Tutorial 0/6 • server owned</div><div class="level-line"><span class="level">LV <b id="level">1</b></span><span class="mounted" id="mounted"></span></div><div class="xp-track"><div class="xp-fill" id="xpFill"></div></div><div class="xp-text"><span>experience</span><span id="xpText">0%</span></div></section>
  <div id="messages" class="message-stack" aria-live="polite"></div>
</main>
<script>
const socketUrl='__AURA_WEBSOCKET_URL__';let socket=null;const shortTag=tag=>String(tag||'').split('.').pop()||'';const titleCase=value=>String(value||'Unknown').replaceAll('_',' ');const countBits=value=>{let count=0;for(let i=0;i<32;i++)if(value&(1<<i))count++;return count};
const $=id=>document.getElementById(id);
function send(command,payload={}){if(socket&&socket.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type:'command',command,payload}))}
function addMessage(p){const m=document.createElement('div');m.className='message card';m.textContent=p.message||p.messageTag||'';$('messages').appendChild(m);setTimeout(()=>m.remove(),4200)}
function handleEvent(name,p){switch(name){case'hud_progress':$('level').textContent=p.level??1;$('xpFill').style.width=((p.xpPercent||0)*100)+'%';$('xpText').textContent=Math.round((p.xpPercent||0)*100)+'%';break;case'hud_role_state':$('roleName').textContent=p.roleId||'Role unavailable';$('combatProfile').textContent='Profile '+shortTag(p.combatProfile||'Unknown');$('faction').textContent=shortTag(p.faction||'Unknown');$('lifeState').textContent=titleCase(p.recoveryState||p.lifeStateName);$('lifeState').className='life '+String(p.recoveryState||p.lifeStateName||'').toLowerCase();$('profileState').textContent=p.persistentProfile?'Persistent profile restored':'Session profile — progress is active';if(p.tutorialCompletionMask!==undefined)$('tutorialState').textContent=`Tutorial ${countBits(Number(p.tutorialCompletionMask))}/6 • server owned`;break;case'hud_tutorial':$('tutorialState').textContent=`Tutorial ${countBits(Number(p.completionMask||0))}/6 • server owned`;break;case'hud_battle_state':$('battlePhase').textContent=titleCase(p.phaseName||'Unknown');$('battleEvent').textContent=p.eventId||'No active event';$('populationSummary')?.replaceChildren(document.createTextNode(p.available?`Civilians ${p.populationActive??0}/${p.populationMaximum??0} • ${p.populationPending??0} returning • ${p.populationCasualties??0} lost`:'Civilians unavailable'));break;case'hud_mounted':$('mounted').textContent=p.mounted?'Mounted':'';break;case'hud_message':addMessage(p);break;case'hud_level_up':addMessage({message:`Level ${p.level} reached!`});break}}
function connect(){socket=new WebSocket(socketUrl);socket.onopen=()=>{send('hud_ready',{panel:'left-top'});send('ready')};socket.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='event')handleEvent(m.event,m.payload||{})}catch(_){}};socket.onclose=()=>setTimeout(connect,900);socket.onerror=()=>socket.close()}
window.addEventListener('keydown',e=>{if(e.code==='KeyL'&&!e.repeat&&!e.ctrlKey&&!e.altKey&&!e.metaKey&&!e.shiftKey&&!e.target?.closest?.('input,textarea,select,[contenteditable="true"]')){e.preventDefault();send('hud_landmarks_toggle')}});connect();
</script>
</body>
</html>
