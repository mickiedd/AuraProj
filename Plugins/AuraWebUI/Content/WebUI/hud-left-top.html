<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura HUD - left top</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#eef5ff;--cyan:#65dcff;--gold:#ffd66b;--line:rgba(151,203,255,.28);--muted:#9eb1c8}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}.hud{position:relative;width:100%;height:100%;font-size:clamp(10px,1.05vw,15px)}
.card{background:linear-gradient(135deg,rgba(15,29,48,.92),rgba(8,15,27,.86));border:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.28);backdrop-filter:blur(10px)}
.top-left{position:absolute;inset:0 auto auto 0;width:100%;padding:12px 15px;border-radius:12px}.eyebrow{color:var(--muted);font-size:.72rem;letter-spacing:.15em;text-transform:uppercase}.level-line{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 8px}.level{font-size:1.55rem;color:var(--gold);font-weight:700}.mounted{font-size:.74rem;color:var(--cyan);text-transform:uppercase}.xp-track{height:7px;border-radius:99px;background:rgba(0,0,0,.45);overflow:hidden;border:1px solid rgba(255,255,255,.12)}.xp-fill{height:100%;width:0%;transition:width .25s;background:linear-gradient(90deg,#8a63ff,#e7c1ff)}.xp-text{display:flex;justify-content:space-between;color:var(--muted);font-size:.72rem;margin-top:4px}
.message-stack{position:absolute;top:112px;left:0;right:0;display:flex;flex-direction:column;gap:7px;align-items:stretch}.message{padding:8px 14px;border-radius:8px;color:#f8e6ae;animation:fade 4s forwards}@keyframes fade{0%,75%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<main class="hud" aria-label="Aura left-top HUD panel">
  <section class="top-left card"><div class="eyebrow">Aura adventurer</div><div class="level-line"><span class="level">LV <b id="level">1</b></span><span class="mounted" id="mounted"></span></div><div class="xp-track"><div class="xp-fill" id="xpFill"></div></div><div class="xp-text"><span>experience</span><span id="xpText">0%</span></div></section>
  <div id="messages" class="message-stack" aria-live="polite"></div>
</main>
<script>
const socketUrl='__AURA_WEBSOCKET_URL__';let socket=null;
const $=id=>document.getElementById(id);
function send(command,payload={}){if(socket&&socket.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type:'command',command,payload}))}
function addMessage(p){const m=document.createElement('div');m.className='message card';m.textContent=p.message||p.messageTag||'';$('messages').appendChild(m);setTimeout(()=>m.remove(),4200)}
function handleEvent(name,p){switch(name){case'hud_progress':$('level').textContent=p.level??1;$('xpFill').style.width=((p.xpPercent||0)*100)+'%';$('xpText').textContent=Math.round((p.xpPercent||0)*100)+'%';break;case'hud_mounted':$('mounted').textContent=p.mounted?'Mounted':'';break;case'hud_message':addMessage(p);break;case'hud_level_up':addMessage({message:`Level ${p.level} reached!`});break}}
function connect(){socket=new WebSocket(socketUrl);socket.onopen=()=>{send('hud_ready',{panel:'left-top'});send('ready')};socket.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='event')handleEvent(m.event,m.payload||{})}catch(_){}};socket.onclose=()=>setTimeout(connect,900);socket.onerror=()=>socket.close()}
connect();
</script>
</body>
</html>
