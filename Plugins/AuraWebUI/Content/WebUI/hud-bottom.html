<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura HUD - bottom</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#eef5ff;--cyan:#65dcff;--gold:#ffd66b;--line:rgba(151,203,255,.28);--muted:#9eb1c8}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}button{font:inherit;color:inherit;border:1px solid var(--line);background:rgba(19,34,55,.9);border-radius:8px;padding:.55rem .75rem;cursor:pointer;transition:.15s}button:hover{border-color:var(--cyan);background:rgba(37,66,96,.95)}button:disabled{opacity:.42;cursor:not-allowed}.hud{position:relative;width:100%;height:100%;font-size:clamp(10px,1.05vw,15px)}
.card{background:linear-gradient(135deg,rgba(15,29,48,.92),rgba(8,15,27,.86));border:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.28);backdrop-filter:blur(10px)}.bottom{position:absolute;inset:0;display:grid;grid-template-columns:minmax(150px,1fr) minmax(320px,2.6fr) minmax(150px,1fr);align-items:end;gap:clamp(10px,1.5vw,26px)}.vital{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;min-height:86px}.orb{width:55px;height:55px;border-radius:50%;display:grid;place-items:center;border:2px solid rgba(255,255,255,.35);box-shadow:inset 0 0 18px rgba(255,255,255,.18),0 0 18px rgba(0,0,0,.3);font-size:1.05rem;font-weight:800}.health .orb{background:radial-gradient(circle at 35% 30%,#ffb3bd,#a81f45 66%,#3e122b)}.mana .orb{background:radial-gradient(circle at 35% 30%,#c1eaff,#2473d3 66%,#10244f)}.vital-copy{flex:1;min-width:0}.vital-title{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);margin-bottom:6px}.vital-value{color:#fff;font-weight:700}.vital-track{height:7px;border-radius:99px;background:rgba(0,0,0,.45);overflow:hidden;border:1px solid rgba(255,255,255,.12)}.health-fill,.mana-fill{height:100%;width:0%;transition:width .25s}.health-fill{background:linear-gradient(90deg,#d02b52,#ff8c8e)}.mana-fill{background:linear-gradient(90deg,#2467d0,#70d6ff)}
.skills{display:flex;justify-content:center;gap:clamp(5px,.8vw,12px);padding:9px 13px;border-radius:16px;background:linear-gradient(180deg,rgba(19,35,57,.78),rgba(7,14,26,.88));border-color:rgba(147,204,255,.36);box-shadow:0 14px 34px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.08)}.skill{width:clamp(48px,5vw,76px);aspect-ratio:1/1.08;position:relative;padding:3px;background:linear-gradient(145deg,rgba(105,219,255,.62),rgba(73,93,154,.42) 46%,rgba(22,34,59,.98));border:1px solid rgba(191,226,255,.46);border-radius:13px;overflow:hidden;isolation:isolate;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 5px 14px rgba(0,0,0,.28);transition:transform .16s,border-color .16s,box-shadow .16s}.skill::before{content:"";position:absolute;inset:3px;border-radius:10px;background:radial-gradient(circle at 32% 20%,rgba(255,255,255,.25),transparent 26%),linear-gradient(145deg,rgba(3,10,21,.08),rgba(3,10,21,.54));pointer-events:none;z-index:2}.skill::after{content:"";position:absolute;left:3px;right:3px;bottom:3px;height:34%;border-radius:0 0 10px 10px;background:linear-gradient(transparent,rgba(2,7,15,.86));pointer-events:none;z-index:2}.skill img{width:100%;height:100%;object-fit:cover;display:none;border-radius:10px;filter:saturate(1.14) contrast(1.06) brightness(1.04);transform:scale(1.02)}.skill img.show{display:block}.skill .fallback{position:absolute;inset:0;display:grid;place-items:center;color:#7eabcc;font-size:1.42rem;text-shadow:0 0 16px rgba(101,220,255,.7);z-index:1}.skill .key{position:absolute;left:6px;top:5px;min-width:18px;padding:2px 4px;border-radius:5px;background:rgba(4,10,20,.72);color:#ffe28a;font-size:.62rem;font-weight:850;line-height:1;text-align:center;z-index:3}.skill .slot-name{position:absolute;left:7px;right:7px;bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#f1f7ff;font-size:.59rem;font-weight:650;text-align:center;text-shadow:0 1px 3px #000;z-index:3}.skill.offensive{background:linear-gradient(145deg,rgba(255,133,122,.72),rgba(104,58,119,.52) 48%,rgba(22,29,54,.98))}.skill.passive{background:linear-gradient(145deg,rgba(181,142,255,.72),rgba(62,84,153,.52) 48%,rgba(20,29,54,.98))}.skill.equipped{border-color:#ffe18a;box-shadow:0 0 0 1px rgba(255,225,138,.26),0 0 24px rgba(255,196,86,.35),inset 0 1px 0 rgba(255,255,255,.34)}.skill.locked{filter:grayscale(.72);opacity:.58}.skill:not(.locked):hover{transform:translateY(-3px);border-color:#8de9ff;box-shadow:0 10px 22px rgba(0,0,0,.34),0 0 18px rgba(101,220,255,.24)}.skill:active{transform:scale(.94)}
.skills{align-items:center;min-height:104px}
.interaction{position:absolute;left:50%;top:0;transform:translateX(-50%);min-width:min(390px,42vw);max-width:50vw;padding:12px;border-radius:11px;display:none}.interaction.visible{display:block}.interaction-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:8px}.target-name{font-weight:700}.target-meta{color:var(--muted);font-size:.74rem}.target-health{height:5px;margin:6px 0;background:#331c27;border-radius:99px;overflow:hidden}.target-health>i{display:block;height:100%;background:#e85563;width:0}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.options button{text-align:left;font-size:.78rem;padding:7px}.options button.selected{border-color:var(--gold);color:var(--gold)}.interaction-hint{color:var(--muted);font-size:.7rem;margin-top:7px}
@media(max-width:800px){.bottom{grid-template-columns:1fr 2.3fr 1fr;gap:5px}.vital{padding:7px}.orb{width:40px;height:40px;font-size:.8rem}.vital-title{font-size:.65rem}.interaction{max-width:90vw}.options{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main class="hud" aria-label="Aura bottom HUD panel">
  <section id="interaction" class="interaction card"><div class="interaction-head"><div><div id="targetName" class="target-name">Target</div><div id="targetMeta" class="target-meta"></div></div><button id="interact">Interact</button></div><div class="target-health"><i id="targetHealth"></i></div><div id="options" class="options"></div><div class="interaction-hint">Choose an option, then press Interact.</div></section>
  <section class="bottom"><div class="vital health card"><div class="orb">HP</div><div class="vital-copy"><div class="vital-title"><span>HEALTH</span><span class="vital-value" id="healthValue">0 / 0</span></div><div class="vital-track"><div class="health-fill" id="healthFill"></div></div></div></div><div id="skills" class="skills card"></div><div class="vital mana card"><div class="orb">MP</div><div class="vital-copy"><div class="vital-title"><span>MANA</span><span class="vital-value" id="manaValue">0 / 0</span></div><div class="vital-track"><div class="mana-fill" id="manaFill"></div></div></div></div></section>
</main>
<script>
const socketUrl='__AURA_WEBSOCKET_URL__';const passiveSlots=['InputTag.Passive.1','InputTag.Passive.2'];const slots=['InputTag.LMB','InputTag.RMB','InputTag.1','InputTag.2','InputTag.3','InputTag.4',...passiveSlots];const slotLabels=['LMB','RMB','1','2','3','4','P1','P2'];const state={skills:{},interaction:null,selectedOption:-1};let socket=null,holdTimer=null,heldInput='';
const $=id=>document.getElementById(id);function send(command,payload={}){if(socket&&socket.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type:'command',command,payload}))}function pct(value,max){return max>0?Math.max(0,Math.min(100,value/max*100)):0}function shortTag(tag){return String(tag||'').split('.').pop()||''}
function setVitals(p){$('healthValue').textContent=`${Math.round(p.health||0)} / ${Math.round(p.maxHealth||0)}`;$('manaValue').textContent=`${Math.round(p.mana||0)} / ${Math.round(p.maxMana||0)}`;$('healthFill').style.width=pct(p.health,p.maxHealth)+'%';$('manaFill').style.width=pct(p.mana,p.maxMana)+'%'}
function releaseSkillInput(){if(!heldInput)return;const slot=heldInput;clearInterval(holdTimer);holdTimer=null;heldInput='';send('skill_ability_released',{inputTag:slot})}
function renderSkills(){const host=$('skills');host.innerHTML='';slots.forEach((slot,i)=>{const info=state.skills[slot]||{};const type=shortTag(info.abilityType).toLowerCase();const isPassive=passiveSlots.includes(slot)||type.includes('passive');const b=document.createElement('button');b.className='skill '+(type.includes('offensive')?'offensive ':'')+(isPassive?'passive ':'')+(info.statusTag?.endsWith('Locked')?'locked ':'')+(info.statusTag?.endsWith('Equipped')?'equipped':'');b.dataset.inputTag=slot;b.title=info.abilityTag||'Empty slot';const img=document.createElement('img');img.src=info.icon||'';img.className=info.icon?'show':'';img.onerror=()=>img.classList.remove('show');const fallback=document.createElement('span');fallback.className='fallback';fallback.textContent=info.clear?'':'*';const key=document.createElement('span');key.className='key';key.textContent=slotLabels[i];const name=document.createElement('span');name.className='slot-name';name.textContent=shortTag(info.abilityTag)||'Empty';b.append(img,fallback,key,name);if(info.abilityTag&&!isPassive){b.onpointerdown=e=>{e.currentTarget.setPointerCapture?.(e.pointerId);send('skill_ability_pressed',{inputTag:slot});heldInput=slot;clearInterval(holdTimer);holdTimer=setInterval(()=>send('skill_ability_held',{inputTag:heldInput}),120)};b.onpointerup=()=>releaseSkillInput();b.onpointercancel=()=>releaseSkillInput();b.onlostpointercapture=()=>releaseSkillInput()}host.appendChild(b)})}
function renderInteraction(){const p=state.interaction;const host=$('interaction');if(!p){host.classList.remove('visible');return}host.classList.add('visible');$('targetName').textContent=p.displayName||shortTag(p.kindTag)||'Target';$('targetMeta').textContent=shortTag(p.relationshipTag)+' - '+shortTag(p.lifeTag);$('targetHealth').style.width=pct(p.health,p.maxHealth)+'%';const options=$('options');options.innerHTML='';(p.options||[]).forEach(o=>{const b=document.createElement('button');b.textContent=o.displayText+(o.enabled?'':' (unavailable)');b.disabled=!o.enabled;b.className=o.index===state.selectedOption?'selected':'';b.onclick=()=>{state.selectedOption=o.index;send('hud_interaction_select',{index:o.index});renderInteraction()};options.appendChild(b)})}
function handleEvent(name,p){switch(name){case'hud_vitals':setVitals(p);break;case'skill_panel_ability':state.skills[p.inputTag]=p;renderSkills();break;case'hud_interaction':state.interaction=p;renderInteraction();break;case'hud_interaction_cleared':state.interaction=null;renderInteraction();break}}
function connect(){socket=new WebSocket(socketUrl);socket.onopen=()=>{send('hud_ready',{panel:'bottom'});send('ready')};socket.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='event')handleEvent(m.event,m.payload||{})}catch(_){}};socket.onclose=()=>setTimeout(connect,900);socket.onerror=()=>socket.close()}
$('interact').onclick=()=>send('hud_interaction_activate');document.addEventListener('pointerup',e=>{if(e.button===0)releaseSkillInput()},true);window.addEventListener('pointercancel',e=>{if(e.button===0)releaseSkillInput()},true);window.addEventListener('blur',releaseSkillInput);renderSkills();connect();
</script>
</body>
</html>
